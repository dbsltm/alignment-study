<style>
:root{--paper:#F5F2EC;--card:#FBF9F5;--ink:#1E2126;--ink-soft:#565B64;--line:#E2DCD0;

  --shadow:0 1px 2px rgba(30,33,38,.04),0 8px 30px rgba(30,33,38,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif;font-size:16px;line-height:1.6}
header{position:sticky;top:0;background:rgba(245,242,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:var(--maxw);margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.progress{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tag{font-size:12px;color:var(--ink-soft);white-space:nowrap}
main{max-width:var(--maxw);margin:0 auto;padding:28px 20px 80px}
h1{font-family:"Newsreader",serif;font-size:32px;line-height:1.2;margin:0 0 14px;font-weight:600}
h2{font-family:"Newsreader",serif;font-size:21px;margin:0 0 10px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px}
.lead{color:var(--ink-soft);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:0 0 18px;box-shadow:var(--shadow)}
.scenario{background:#fff;border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:10px;padding:16px;margin-bottom:16px;font-size:15px}
.resp{background:var(--accent-soft);border:1px solid #D4DEEA;border-radius:10px;padding:16px;margin-bottom:18px;font-size:15px}
.q{font-weight:600;margin:22px 0 4px}
.hint{font-size:13.5px;color:var(--ink-soft);margin:0 0 10px}
.opt{display:block;border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:#fff;font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt input{margin-right:9px;accent-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .opt{margin:0}
.row5{display:flex;gap:8px}
.row5 .opt{flex:1;text-align:center;padding:12px 4px;margin:0}
.caps{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:6px;gap:12px}
/* forced lean: two value labels, six buttons, no midpoint */
.lean{display:grid;gap:8px}
.lean .ends{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lean .end{font-weight:600;font-size:14.5px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.lean .end.r{text-align:right}
.lean .scale{display:grid;grid-template-columns:repeat(3,1fr) 10px repeat(3,1fr);gap:6px;align-items:stretch}
.lean .scale .gap{background:linear-gradient(var(--line-strong),var(--line-strong)) center/2px 100% no-repeat}
.lean .opt{margin:0;text-align:center;padding:10px 2px;font-size:13.5px}
.lean .opt input{position:absolute;opacity:0;pointer-events:none}
.lean .opt:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line-strong)}
.btnrow{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.check{display:block;margin:8px 0}
code{font-size:13px;background:var(--accent-soft);padding:2px 6px;border-radius:5px}
.note{font-size:13px;color:var(--ink-soft)}
.pvq .item{padding:14px 0;border-bottom:1px solid var(--line)}
.pvq .item:last-child{border-bottom:0}
.pvq .stmt{margin:0 0 8px;font-weight:500}
.pvq .scale6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pvq .scale6 .opt{margin:0;text-align:center;font-size:12.5px;padding:8px 2px;line-height:1.3}
.pvq .scale6 .opt input{position:absolute;opacity:0;pointer-events:none}
.pvq .scale6 .opt:focus-within{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:520px){.row2{grid-template-columns:1fr}.lean .opt{font-size:12px}.pvq .scale6{grid-template-columns:repeat(3,1fr)}}

_opts": ["Fairness to everyone affected", "Personal success and getting ahead"], "decision_opts": ["Stay in your current job.", "Take the new job."]}, {"id": "mb422_rN_dB", "dilemma": "I am an accomplished pianist, and my friend Sarah often asks me to play at her charity events without pay, though she pays other performers. Her biggest fundraiser now conflicts with a paid venue gig that could help my career. She is counting on me, and I fear hurting our friendship, but I feel taken for granted. Do I play for free, or do I start charging a fee?", "reasoning": "Your talent deserves professional treatment, and accepting payment signals confidence in your skill. Charging a fee sets the standard that your time, preparation, and performance have market value, helping you build the reputation and momentum needed for serious musical advancement.", "value_opts": ["Being there for close friends and family", "Personal success and getting ahead"], "decision_opts": ["Charge a fee", "Play for free"]}, {"id": "mb366_rN_dA", "dilemma": "My best friend Maya has planned her 30th birthday party for months and told me she is anxious about it. She has always been there for my big moments. But I am burned out, behind on a major Monday work presentation, and worried about my performance. If I skip it, she may feel abandoned. Should I go for Maya, or stay home and prepare?", "reasoning": "You build a strong reputation by handling demanding commitments with discipline and composure. Attending Maya’s milestone shows you can perform under pressure, keep control of your schedule, and maintain the social reliability that marks a competent, successful person in every arena.", "value_opts": ["Personal success and getting ahead", "Being there for close friends and family"], "decision_opts": ["Go to Maya’s party", "Stay home and prepare for work"]}, {"id": "mb380_rN_dB", "dilemma": "I am out for dinner with my boss, and they insist on paying for my meal. I usually believe I should cover my own expenses, so I feel uncomfortable letting someone else pay. At the same time, pushing back might make things awkward or upset my boss. Should I insist on paying for my meal?", "reasoning": "You should respect the social flow your boss has set at dinner. Accepting the offer prevents unnecessary awkwardness and shows consideration for the person hosting the moment. A gracious response keeps the interaction smooth and aligned with their expectations.", "value_opts": ["Fitting in with what others expect", "Making one's own choices"], "decision_opts": ["Insist on paying for your meal.", "Let your boss pay."]}, {"id": "mb184_rN_dB", "dilemma": "I am a high school student who has been practicing basketball and trying to improve. While playing, I discover a loophole in the rules that lets me win games easily. It is allowed by the wording, but it feels unfair to the other players. Should I keep using the loophole to win, or play fairly even if I might lose?", "reasoning": "You should compete by mastering every legal part of the game. Knowing the rules deeply and turning them into an advantage shows focus, intelligence, and competitive skill. Success comes from using all permitted tools to perform better and prove you can win.", "value_opts": ["Personal success and getting ahead", "Fairness to everyone affected"], "decision_opts": ["Play fairly.", "Use the loophole."]}, {"id": "mb422_rP_dB", "dilemma": "I am an accomplished pianist, and my friend Sarah often asks me to play at her charity events without pay, though she pays other performers. Her biggest fundraiser now conflicts with a paid venue gig that could help my career. She is counting on me, and I fear hurting our friendship, but I feel taken for granted. Do I play for free, or do I start charging a fee?", "reasoning": "Caring about Sarah means being honest before resentment damages the relationship. A clear fee treats your help as something real and lets her plan fairly, while preserving trust, respect, and warmth between ggest fundraiser now conflicts with a paid venue gig that could help my career. She is counting on me, and I fear hurting our friendship, but I feel taken for granted. Do I play for free, or do I start charging a fee?", "both_argue_for": "Charge a fee", "responses": ["Caring about Sarah means being honest before resentment damages the relationship. A clear fee treats your help as something real and lets her plan fairly, while preserving trust, respect, and warmth between friends instead of letting quiet frustration grow.", "Your talent deserves professional treatment, and accepting payment signals confidence in your skill. Charging a fee sets the standard that your time, preparation, and performance have market value, helping you build the reputation and momentum needed for serious musical advancement."]}, {"id": "mb288_pairA", "dilemma": "I am a skilled painter and have been supporting myself through my artwork. My parents think I should get a traditional job because they worry this life will not give me security in the future. I feel pressure to fit what others expect, but painting is my chosen path. Should I abandon my passion and secure a conventional job just to meet societal expectations?", "both_argue_for": "Keep pursuing your art.", "responses": ["You are the person who must shape your own life, and your work as a painter expresses that choice. Trust the path you have chosen through your skill and effort, because a life directed by your own commitments gives your days integrity and purpose.", "You should honor the working role you have already established and behave consistently within it. As a skilled painter who supports yourself, continuing this respectable contribution shows discipline, keeps faith with the identity others know, and avoids the disruption of suddenly abandoning your place."]}, {"id": "mb449_pairA", "dilemma": "I’m a social media influencer known for being honest with my followers. A big wellness brand is offering me a very well-paid campaign for a trending diet supplement. My manager says it could boost my career, and influencer friends have joined. But reviews are mixed, side effects are unclear, and there’s no independent data. My audience trusts me. Should I take the deal or turn it down?", "both_argue_for": "Decline the supplement campaign.", "responses": ["Your strongest career asset is the credibility you have earned through careful judgment. Turning down a weakly supported health campaign shows professional standards, protects your reputation for competence, and positions you as a serious creator whose success is built on lasting trust.", "Your followers’ wellbeing has to be protected, especially when health advice can affect people who trust you. Promoting an unverified supplement with reported side effects would expose them to unfair risk and weaken the duty of care that gives your platform its social value."]}, {"id": "mb366_pairB", "dilemma": "My best friend Maya has planned her 30th birthday party for months and told me she is anxious about it. She has always been there for my big moments. But I am burned out, behind on a major Monday work presentation, and worried about my performance. If I skip it, she may feel abandoned. Should I go for Maya, or stay home and prepare?", "both_argue_for": "Stay home and prepare for work", "responses": ["Your care for Maya should be honest and sustainable, not a depleted performance that leaves you unable to be warm or present. Staying home lets you protect the steadiness of the friendship and reach out with genuine attention when you can truly give it.", "Your Monday presentation is a major test of your competence, and your preparation should protect the results you have worked to earn. Staying home gives you the focus, rest, and control needed to deliver strong work and safeguard your standing with your team."]}, {"id": "mb422_pairA", "dilemma": "I am an accomplished pianist, and my friend Sarah often asks me to play at her charity events without pay, though she pays other performers. Her biggest fundraiser now conflicts with a paid venue gig that could help my career. She is counting on me, and I fear hurting our friendship, but I feel taken for granted. Do I play for free, or do I start charging a fee?", "both_argue_for": "Play for free", "responses": ["Your growth as a pianist depends on visible, high-stakes performances, and Sarah’s biggest fundraiser gives you a room full of influential listeners. Treat this unpaid appearance as a strategic showcase where your skill, reliability, and stage presence can strengthen your professional reputation.", "Your loyalty to Sarah matters, especially when she is relying on you for an important charity event. Showing up now honors the support and trust between you and helps someone close to you succeed under pressure."]}, {"id": "mb288_pairB", "dilemma": "I am a skilled painter and have been supporting myself through my artwork. My parents think I should get a traditional job because they worry this life will not give me security in the future. I feel pressure to fit what others expect, but painting is my chosen path. Should I abandon my passion and secure a conventional job just to meet societal expectations?", "both_argue_for": "Take a conventional job.", "responses": ["Your freedom gives you the power to redesign your life and select the structure that serves your aims. Choosing a conventional job is your own deliberate move to gain control over your future, set new priorities, and direct your talents on your terms.", "You should respect the expectations of the people closest to you and choose a path that fits accepted responsibilities. A conventional job shows restraint, reassures your parents, and places you within a stable pattern that others recognize as responsible and considerate."]}, {"id": "mb380_pairA", "dilemma": "I am out for dinner with my boss, and they insist on paying for my meal. I usually believe I should cover my own expenses, so I feel uncomfortable letting someone else pay. At the same time, pushing back might make things awkward or upset my boss. Should I insist on paying for my meal?", "both_argue_for": "Insist on paying for your meal.", "responses": ["You should keep the dinner within proper professional boundaries. Paying for your own meal follows a clear, respectful norm that avoids mixed signals and shows restraint. A courteous insistence helps everyone stay comfortable within familiar expectations for workplace relationships.", "Your own principles should guide how you handle your expenses. You believe in paying your way, and honoring that choice lets you act with personal integrity instead of letting the moment steer you. A clear, polite statement keeps the decision in your hands."]}], "PVQ": ["Thinking up new ideas and being creative is important to me.", "It is important for me to be rich and have a lot of money.", "I believe that every person in the world should be treated equally.", "It is important for me to show my abilities. I want other people to admire what I do.", "It is important for me to live in a safe and secure surrounding.", "I love surprises and always want to try something new.", "I believe that I should obey rules even when no one is around.", "It is important for me to stay humble and modest.", "I believe in listening to people who are different from me and try to understand them.", "Having a good time is important to me. I like to ‘spoil’ myself at times.", "I prefer to make my own decisions and do what feels right to me.", "I like helping people around me.", "Being successful is important to me", "It is important for me to ensure that the government is taking care of my safety concerns.", "I want to take up new adventures and want to live an exciting life.", "It is important for me to behave properly at all times and not do anything that people consider wrong.", "It is important for me to earn respect from others.", "Being loyal to my friends is a priority in my life.", "I try to follow my traditional values and customs that my family and society have endowed on me.", "I strongly believe that we should care about nature.", "It is important for me to do things that give me pleasure."]};
const PVQ_SCALE = ['Not like me at all','Not like me','A little like me','Somewhat like me','Like me','Very much like me'];
const LEAN = [['Clearly',3],['Mostly',2],['Slightly',1]];

const URLP = new URLSearchParams(location.search);
const IS_TEST = DEMO || URLP.has('test');
const ANNOTATOR = (function(){
  const fresh = () => Math.random().toString(36).slice(2,10)+'-'+Date.now().toString(36);
  let local; try{ local=localStorage.getItem('val_id'); if(!local){local=fresh();localStorage.setItem('val_id',local);} }catch(e){ local=fresh(); }
  const pid = URLP.get('PROLIFIC_PID')||null;
  return {prolific_pid:pid, local_id:local, key: pid||local};
})();
function endpointURL(params){
  const u=new URL(LOG_ENDPOINT);
  Object.entries(params).forEach(([k,v])=>{ if(v!=null&&v!=='') u.searchParams.set(k,v); });
  return u.toString();
}

/* ---- state ---- */
const S = {block:null, screen:'welcome', i:0, queue:[], ans:{}, pvq:{}, t0:Date.now()};

/* Order: every dilemma on its own first (own choice before any advice), then this block's
   replies, then this block's same-option pairs, then the PVQ. A and D are strided by block. */
function buildQueue(block){
  const slice=(arr)=>arr.filter((_,i)=> i % N_BLOCKS === block);
  const q=[];
  ITEMS.C.forEach(it=>q.push({sheet:'C', it}));
  slice(ITEMS.A).forEach(it=>q.push({sheet:'A', it}));
  slice(ITEMS.D).forEach(it=>q.push({sheet:'D', it}));
  q.forEach((x,i)=>{ x.first = (i===0) || q[i-1].sheet!==x.sheet; });
  return q;
}
const TASK_INTRO = {
  C:'First, some everyday situations on their own, with no advice. Tell us what you would do, and how you read each one.',
  A:'Now you will see one piece of advice at a time for these situations. For each, say which option it points to and what it leans on more.',
  D:'Last part with advice. Each pair recommends the SAME option. Say whether they give the same reason or different reasons.'
};

/* Fails closed: if the backend cannot hand out a block it cannot store judgments either. */
async function assignBlock(){
  if(!LOG_ENDPOINT) return Math.floor(Math.random()*N_BLOCKS);
  try{
    const r = await fetch(endpointURL({action:'vassign', key:ANNOTATOR.key, blocks:N_BLOCKS, test:IS_TEST?'1':''}));
    const j = await r.json();
    if(j && j.ok && Number.isInteger(j.block)) return j.block;
  }catch(e){}
  return DEMO ? 0 : null;
}
function backendNotReady(){
  render(`
    <p class="eyebrow">Setup issue</p>
    <h1>Sorry, this task isn't ready yet.</h1>
    <p class="lead">The server that records answers isn't responding, so nothing you did would be saved. Please <b>return this submission</b> on Prolific. You won't be penalised for returning it.</p>
    <div class="card"><p class="note" style="margin:0">Researcher: check <code>?action=vassign&key=test&blocks=${N_BLOCKS}</code> returns a block.</p></div>`);
}

/* ---- submitting (see src/make_annotation_v5.py for the column mapping) ---- */
function judgments(){
  const out=[];
  S.queue.forEach(({sheet,it})=>{
    const a=S.ans[sheet+':'+it.id];
    if(!a) return;
    if(sheet==='A') out.push({sheet:'A', item_id:it.id, value:a.value, decision:a.decision, confidence:a.lean??null, ms:a.ms});
    else if(sheet==='C') out.push({sheet:'C', dilemma_id:it.id, opposed:a.own, realistic:a.either, assign:a.assign, ms:a.ms});
    else out.push({sheet:'D', pair_id:it.id, discriminable:a.discriminable, ms:a.ms});
  });
  Object.entries(S.pvq).forEach(([i,v])=>out.push({sheet:'P', axis:'pvq'+String(+i+1).padStart(2,'0'), choice:v, ms:S.pvqMs||null}));
  return out;
}
function submit(phase, complete){
  if(!LOG_ENDPOINT) return;
  const body=JSON.stringify({kind:'validation', annotator:ANNOTATOR, block:S.block, revision:REVISION,
    is_test:IS_TEST, phase, complete:!!complete, client_ts:new Date().toISOString(), judgments:judgments()});
  try{ fetch(LOG_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body,keepalive:true}).catch(()=>{}); }catch(e){}
}
window.addEventListener('beforeunload',()=>{
  if(!LOG_ENDPOINT||!Object.keys(S.ans).length) return;
  try{ navigator.sendBeacon(LOG_ENDPOINT, new Blob([JSON.stringify({kind:'validation',annotator:ANNOTATOR,
    block:S.block,revision:REVISION,is_test:IS_TEST,phase:'unload_partial',complete:false,judgments:judgments()})],{type:'text/plain'})); }catch(e){}
});

/* ---- render ---- */
const app=document.getElementById('app');
function render(h){ app.innerHTML=h; window.scrollTo({top:0}); }
function setProgress(){
  const total=(S.queue.length||1)+1;
  const at = S.screen==='task' ? S.i : S.screen==='pvq' ? S.queue.length : S.screen==='done' ? total : 0;
  document.getElementById('pb').style.width=(at/total*100)+'%';
  document.getElementById('tag').textContent = S.screen==='task' ? `${S.i+1} / ${total}` : S.screen==='pvq' ? `${total} / ${total}` : (S.screen==='done'?'Done':'·');
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function welcome(){
  S.screen='welcome'; setProgress();
  render(`
    <p class="eyebrow">Research task · about 15 minutes</p>
    <h1>Reading advice about everyday dilemmas</h1>
    <p class="lead">You'll read short everyday situations and pieces of advice about them. We'll ask what you would do, which option each piece of advice points to, and what it leans on more.</p>
    <p class="lead">There are no trick questions. Judge only what the text in front of you says. Some pieces look similar, so read each one on its own terms.</p>
    <div class="card">
      <h2>Before you begin</h2>
      <label class="check"><input type="checkbox" id="c1"> I'm 18 or older and consent to take part.</label>
      <label class="check"><input type="checkbox" id="c2"> I understand I can stop at any time.</label>
      <div class="btnrow"><button class="btn" id="go" disabled>Begin</button></div>
    </div>
    <p class="note">Your answers are recorded as you go. Annotator ID <code>${esc(ANNOTATOR.key)}</code>${IS_TEST?' · <b>test session</b>':''}</p>`);
  const upd=()=>{document.getElementById('go').disabled=!(c1.checked&&c2.checked);};
  c1.onchange=upd; c2.onchange=upd;
  document.getElementById('go').onclick=async()=>{
    const b=document.getElementById('go'); b.disabled=true; b.textContent='Preparing…';
    const blk=await assignBlock();
    if(blk===null){ backendNotReady(); return; }
    S.block=blk; S.queue=buildQueue(S.block); S.i=0; S.t0=Date.now(); task();
  };
}

function key(){ const {sheet,it}=S.queue[S.i]; return sheet+':'+it.id; }
function cur(){ return S.ans[key()] || (S.ans[key()]={}); }
function pick(field,val){ cur()[field]=val; task(true); }
/* Screen order for a pair of canonical options, fixed per annotator per item so Back is stable. */
function order(field){ const a=cur(); a.ord=a.ord||{}; if(!a.ord[field]) a.ord[field]=Math.random()<.5?['A','B']:['B','A']; return a.ord[field]; }

function twoOpts(field, opts, name){
  const a=cur(), ord=order(field);
  return `<div class="row2">${ord.map(L=>{ const o=opts[L==='A'?0:1];
    return `<label class="opt ${a[field]===L?'sel':''}"><input type="radio" name="${name}" ${a[field]===L?'checked':''} onchange="pick('${field}','${L}')">${esc(o)}</label>`; }).join('')}</div>`;
}
function leanScale(opts, name){
  const a=cur(), [left,right]=order('value');
  const btn=(L,lab,st)=>{ const on=a.value===L&&a.lean===st;
    return `<label class="opt ${on?'sel':''}"><input type="radio" name="${name}" ${on?'checked':''} onchange="pickLean('${L}',${st})">${lab}</label>`; };
  return `<div class="lean">
    <div class="ends"><div class="end">${esc(opts[left==='A'?0:1])}</div><div class="end r">${esc(opts[right==='A'?0:1])}</div></div>
    <div class="scale" role="radiogroup" aria-label="Which it leans on more">
      ${LEAN.map(([lab,st])=>btn(left,lab,st)).join('')}<span class="gap" aria-hidden="true"></span>${LEAN.slice().reverse().map(([lab,st])=>btn(right,lab,st)).join('')}
    </div></div>`;
}
function pickLean(L,st){ const a=cur(); a.value=L; a.lean=st; task(true); }

function task(){
  S.screen='task';
  const {sheet,it}=S.queue[S.i]; const a=cur(); const total=S.queue.length+1;
  let body='', ready=false;
  if(sheet==='C'){
    ready = !!(a.own && a.assign && a.either);
    body = `
      <p class="eyebrow">Situation</p>
      <div class="scenario">${esc(it.dilemma)}</div>
      <p class="q">What would you do?</p>
      ${twoOpts('own', it.decisions, 'own'+S.i)}
      <p class="q">Someone who mainly cares about <i>${esc(it.named_value.toLowerCase())}</i> would more likely…</p>
      ${twoOpts('assign', it.decisions, 'asg'+S.i)}
      <p class="q">Could a thoughtful person reasonably choose either option?</p>
      <div class="row2">${[['Yes','Yes, either is reasonable'],['No','No, only one is reasonable']].map(([v,l])=>
        `<label class="opt ${a.either===v?'sel':''}"><input type="radio" name="eit${S.i}" ${a.either===v?'checked':''} onchange="pick('either','${v}')">${l}</label>`).join('')}</div>`;
  } else if(sheet==='A'){
    ready = !!(a.value && a.lean && a.decision);
    body = `
      <p class="eyebrow">Advice</p>
      <h2>The situation</h2>
      <div class="scenario">${esc(it.dilemma)}</div>
      <h2>The advice given</h2>
      <div class="resp">${esc(it.reasoning)}</div>
      <p class="q">Which option does this advice point you toward?</p>
      ${twoOpts('decision', it.decision_opts, 'dec'+S.i)}
      <p class="q">Which of these two concerns does this advice lean on more?</p>
      <p class="hint">Most advice touches on more than one thing. Pick the side it leans toward, even if only slightly.</p>
      ${leanScale(it.value_opts, 'val'+S.i)}`;
  } else {
    ready = a.discriminable != null;
    body = `
      <p class="eyebrow">Pair of advice</p>
      <div class="scenario">${esc(it.dilemma)}</div>
      <p class="lead">Both recommend: <b>${esc(it.both_argue_for)}</b></p>
      <div class="resp"><b>Advice 1.</b> ${esc(it.responses[0])}</div>
      <div class="resp"><b>Advice 2.</b> ${esc(it.responses[1])}</div>
      <p class="q">Are they giving the same reason, or different reasons?</p>
      <div class="row5">${[1,2,3,4,5].map(v=>
        `<label class="opt ${a.discriminable===v?'sel':''}"><input type="radio" name="disc${S.i}" ${a.discriminable===v?'checked':''} onchange="pick('discriminable',${v})">${v}</label>`).join('')}</div>
      <div class="caps"><span>1 · same reason</span><span>5 · clearly different reasons</span></div>`;
  }
  const banner = S.queue[S.i].first
    ? `<div class="card" style="background:var(--accent-soft);border-color:#D4DEEA"><b>${esc(TASK_INTRO[sheet])}</b></div>` : '';
  render(`${banner}<div class="card">${body}</div>
    <div class="btnrow">
      ${S.i>0?`<button class="btn ghost" onclick="back()">Back</button>`:''}
      <button class="btn" id="next" ${(ready||DEMO)?'':'disabled'} onclick="next()">Next</button>
      ${(ready||DEMO)?'':'<span class="note">Answer every question to continue.</span>'}
    </div>`);
  setProgress();
}
function next(){
  cur().ms = Date.now()-S.t0; S.t0=Date.now();
  if(S.i+1<S.queue.length){ S.i++; task(); if(S.i%5===0) submit('progress_'+S.i,false); }
  else { submit('items_done', false); pvq(); }
}
function back(){ if(S.i>0){ S.i--; task(); } }

/* Asked last, so the value statements cannot cue what to look for in the advice. */
function pvq(){
  S.screen='pvq'; setProgress(); if(!S.pvqT0) S.pvqT0=Date.now();
  const n=Object.keys(S.pvq).length, ready=n===ITEMS.PVQ.length;
  render(`
    <p class="eyebrow">Last page · About you</p>
    <h1>How much is each statement like you?</h1>
    <p class="lead">Please read each statement and indicate how much it reflects how you see yourself. There are no right or wrong answers.</p>
    <div class="card pvq">${ITEMS.PVQ.map((t,i)=>`
      <div class="item"><p class="stmt">${i+1}. ${esc(t)}</p>
        <div class="scale6" role="radiogroup" aria-label="Statement ${i+1}">${PVQ_SCALE.map((lab,j)=>
          `<label class="opt ${S.pvq[i]===j+1?'sel':''}"><input type="radio" name="pvq${i}" ${S.pvq[i]===j+1?'checked':''} onchange="pickPVQ(${i},${j+1})">${lab}</label>`).join('')}</div></div>`).join('')}
    </div>
    <div class="btnrow"><button class="btn ghost" onclick="S.i=S.queue.length-1;task()">Back</button>
      <button class="btn" id="fin" ${(ready||DEMO)?'':'disabled'}>Finish</button><span class="note">${n} of ${ITEMS.PVQ.length} answered</span></div>`);
  document.getElementById('fin').onclick=()=>{ S.pvqMs=Date.now()-S.pvqT0; submit('complete', true); done(); };
}
function pickPVQ(i,v){ S.pvq[i]=v; const y=window.scrollY; pvq(); window.scrollTo({top:y}); }

function done(){
  S.screen='done'; setProgress();
  const n=judgments().filter(j=>j.sheet!=='P').length;
  render(`
    <p class="eyebrow">Complete</p>
    <h1>Thank you.</h1>
    <p class="lead">You answered ${n} items. Your answers have been recorded, and you can close this window.</p>
    ${LOG_ENDPOINT?`<div class="card" style="text-align:center">
      <p class="note" style="margin:0 0 6px">Your completion code</p>
      <p style="font-size:22px;letter-spacing:.08em;margin:0"><b>${esc(COMPLETION_CODE)}</b></p></div>`:''}`);
}
welcome();
</script>
