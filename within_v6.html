<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Everyday Decisions Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F2EC;
    --card:#FBF9F5;
    --ink:#1E2126;
    --ink-soft:#565B64;
    --line:#E2DCD0;
    --line-strong:#CFC7B6;
    --accent:#3D5A80;
    --accent-soft:#E7ECF2;
    --agent-font:'Space Grotesk','Inter',sans-serif;
    --warm:#A9603A;
    --good:#3F6B52;
    --radius:14px;
    --maxw:720px;
    --shadow:0 1px 2px rgba(30,33,38,.04), 0 8px 30px rgba(30,33,38,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px 96px}
  /* ---- top bar ---- */
  header.bar{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .bar-inner{max-width:var(--maxw);margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
  .backbtn{appearance:none;border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);width:30px;height:30px;border-radius:99px;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .12s ease;flex:none}
  .backbtn:hover{border-color:var(--accent);color:var(--accent)}
  .mark{font-family:"Spline Sans Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .mark b{color:var(--ink);font-weight:500}
  .progress{flex:1;height:5px;background:var(--line);border-radius:99px;overflow:hidden}
  .progress > i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .phasetag{font-family:"Spline Sans Mono",monospace;font-size:11px;color:var(--accent);letter-spacing:.08em;white-space:nowrap}
  /* ---- screen ---- */
  main{padding-top:34px}
  .eyebrow{font-family:"Spline Sans Mono",monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--warm);margin:0 0 12px}
  h1{font-family:"Newsreader",serif;font-weight:500;font-size:38px;line-height:1.12;letter-spacing:-.01em;margin:0 0 16px}
  h2{font-family:"Newsreader",serif;font-weight:500;font-size:26px;line-height:1.2;margin:0 0 12px}
  p.lead{font-size:17px;color:var(--ink-soft);margin:0 0 18px}
  p{margin:0 0 14px}
  .muted{color:var(--ink-soft)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin:0 0 18px}
  .note{font-size:13.5px;color:var(--ink-soft);background:#FFFDF8;border:1px dashed var(--line-strong);border-radius:10px;padding:12px 14px;margin:14px 0}
  .note b{color:var(--warm)}
  /* ---- buttons ---- */
  .btnrow{display:flex;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}
  button{font-family:inherit}
  .btn{
    appearance:none;border:none;cursor:pointer;
    background:var(--accent);color:#fff;
    font-size:15px;font-weight:500;
    padding:13px 24px;border-radius:99px;
    transition:transform .08s ease, background .2s ease, opacity .2s;
  }
  .btn:hover{background:#34507a}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink-soft);padding:13px 14px}
  .btn.ghost:hover{color:var(--ink);background:transparent}
  .btn.line{background:transparent;color:var(--accent);border:1px solid var(--line-strong)}
  .btn.line:hover{background:var(--accent-soft)}
  /* ---- consent / checks ---- */
  label.check{display:flex;gap:11px;align-items:flex-start;cursor:pointer;font-size:15px;padding:6px 0}
  label.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
  /* ---- PVQ ---- */
  .qitem{padding:18px 0;border-bottom:1px solid var(--line)}
  .qitem:last-child{border-bottom:none}
  .qtext{font-size:16px;margin:0 0 12px}
  .qtext .n{font-family:"Spline Sans Mono",monospace;color:var(--ink-soft);font-size:13px;margin-right:8px}
  .scale{display:flex;gap:6px;flex-wrap:wrap}
  .scale.likert7 .opt{min-width:40px}
  .scale.likert5 .opt{min-width:52px}
  .opt{flex:1;min-width:64px}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt label{
    display:block;text-align:center;cursor:pointer;
    border:1px solid var(--line-strong);border-radius:9px;
    padding:9px 4px;font-size:12.5px;color:var(--ink-soft);line-height:1.2;
    transition:all .12s ease;background:var(--card);
    min-height:46px;display:flex;align-items:center;justify-content:center;
  }
  .opt input:checked + label{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
  .opt label:hover{border-color:var(--accent)}
  .opt input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
  .scalecaps{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-top:7px;font-family:"Spline Sans Mono",monospace;letter-spacing:.02em}
  /* ---- dilemma ---- */
  .dilemma{font-family:"Newsreader",serif;font-size:19px;line-height:1.5}
  .options{display:grid;gap:10px;margin-top:18px}
  .bigopt{
    display:flex;gap:12px;align-items:flex-start;cursor:pointer;
    border:1px solid var(--line-strong);border-radius:12px;padding:15px 16px;background:var(--card);
    transition:all .12s ease;
  }
  .bigopt:hover{border-color:var(--accent)}
  .bigopt input{margin-top:2px;accent-color:var(--accent);width:18px;height:18px}
  .bigopt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .bigopt .lab{font-family:"Inter";font-size:15px}
  /* ---- AI response ---- */
  .ai{border:1px solid var(--line);border-left:3px solid var(--accent);background:#FBFAF7;border-radius:10px;padding:18px 20px;margin:6px 0 6px}
  .ai .who{display:flex;align-items:center;gap:9px;margin:0 0 12px}
  .who .ava{width:25px;height:25px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;background:var(--accent-soft);border:1px solid #cdd8e6;border-radius:7px;box-shadow:inset 0 1px 0 #fff,0 1px 1px rgba(30,33,38,.05)}
  .who b{font-family:"Inter";font-weight:700;color:var(--accent);font-size:13.5px;letter-spacing:.01em}
  .ai .verdict{font-weight:600;margin:0 0 8px}
  .ai .reason{color:var(--ink);margin:0;font-family:var(--agent-font);font-size:15px;line-height:1.55}
  .ai .verdict{font-family:var(--agent-font)}
  .agentref{font-family:var(--agent-font);font-weight:600;color:var(--accent);white-space:nowrap}
  .msg.ai .answer{margin:0;line-height:1.6}
  .msg.ai .answer .rec{font-style:italic}
  .gatehint{font-family:var(--sans, system-ui);font-size:13px;color:var(--soft,#565B64);
    margin:12px 0 0;opacity:.85}
  .gatehint b{font-variant-numeric:tabular-nums}
  .forkbtn[disabled]{opacity:.45;cursor:default}
  .forkbtn[disabled]:hover{border-color:var(--line);background:#fff}
  .dilemma.dim{opacity:.5;transition:opacity .25s}
  .sending{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:15.5px;
    color:var(--soft, #565B64)}
  .dots{display:inline-flex;gap:4px}
  .dots i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35;
    animation:blip 1.1s infinite}
  .dots i:nth-child(2){animation-delay:.18s} .dots i:nth-child(3){animation-delay:.36s}
  @keyframes blip{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.5}}
  /* minmax(0,1fr) rather than 1fr: a bare 1fr track will not shrink below its
     content's min-width, so the longer label widened its own column. */
  .forkrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;
    margin-top:16px;align-items:stretch}
  .forkbtn{font-family:inherit;font-size:15.5px;font-weight:600;line-height:1.35;padding:22px 18px;
    border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
    text-align:left;width:100%;transition:border-color .12s,background .12s,transform .06s}
  .forkbtn small{display:block;font-weight:400;font-size:12.5px;line-height:1.4;
    color:var(--soft,#565B64);margin-top:7px}
  /* The .bot rule used to sit after :hover at equal specificity and silently won,
     so that button never responded to the cursor and read as disabled. */
  .forkbtn.bot{border-color:#D8C4B4}
  .forkbtn:not([disabled]):hover{border-color:var(--accent);background:#F7F9FC}
  .forkbtn.bot:not([disabled]):hover{border-color:var(--warm,#B5602F);background:#FBF6F2}
  .forkbtn:not([disabled]):active{transform:translateY(1px)}
  .forkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .freetext{width:100%;font-family:inherit;font-size:16px;line-height:1.55;padding:12px 13px;
    border:1px solid var(--line);border-radius:8px;margin-top:10px;resize:vertical}
  @media(max-width:560px){.forkrow{grid-template-columns:1fr}}
  .rlabel{font-family:"Spline Sans Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:2px 0 4px;opacity:.85}
  .compbox{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .compq{font-size:14px;font-weight:600;color:var(--ink);margin:0 0 9px}
  .compopts{display:flex;flex-direction:column;gap:8px}
  .compopts.binary{flex-direction:row;gap:10px}
  .compopts.binary .compopt{flex:1 1 0;min-width:0;text-align:center;font-weight:500}
  .compopt{text-align:left;border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:11px 14px;cursor:pointer;font-size:14px;font-family:inherit;color:var(--ink);transition:all .12s}
  .compopt:hover{border-color:var(--accent)}
  .compopt.sel{background:var(--accent-soft);border-color:var(--accent)}
  .compopt.wrong{background:#FBE9E4;border-color:#C6543B;color:#7A2417}
  .comphint{font-size:13px;color:#A9603A;margin:12px 0 0;font-style:italic}
  /* Matches .compopt so the written answer reads as part of the same battery. */
  .compwhy{width:100%;box-sizing:border-box;display:block;text-align:left;
    border:1px solid var(--line-strong);background:var(--card);border-radius:10px;
    padding:11px 14px;font-size:14px;font-family:inherit;color:var(--ink);
    transition:all .12s;resize:vertical;line-height:1.5;min-height:76px}
  .compwhy::placeholder{color:var(--ink-soft);opacity:.7}
  .compwhy:hover{border-color:var(--accent)}
  .compwhy:focus{outline:none;border-color:var(--accent);background:var(--accent-soft)}
  .stepnum{flex:none;width:24px;height:24px;border-radius:99px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
  /* ---- circumplex ---- */
  .wheelwrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
  .legend{font-size:13px;color:var(--ink-soft);display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
  .legend .ho{font-weight:600;color:var(--ink);grid-column:1/-1;margin-top:6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .legend .v{display:flex;justify-content:space-between;gap:10px}
  .legend .v b{font-weight:500;color:var(--ink)}
  /* ---- delegation grid ---- */
  .deltask{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;background:var(--card)}
  .deltask h3{font-family:"Newsreader",serif;font-weight:500;font-size:18px;margin:0 0 4px}
  .deltask .tags{font-family:"Spline Sans Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:12px}
  .deltask .tags span{background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:2px 8px;margin-right:6px}
  .frame{margin:14px 0 4px}
  .frame .q{font-size:14.5px;margin:0 0 8px}
  .frame .q .pill{font-family:"Spline Sans Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:99px;padding:2px 7px;margin-right:7px}
  /* ---- summary / export ---- */
  table.sum{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
  table.sum td{padding:7px 8px;border-bottom:1px solid var(--line)}
  table.sum td:first-child{color:var(--ink-soft)}
  table.sum td:last-child{text-align:right;font-family:"Spline Sans Mono",monospace}
  .pillbig{display:inline-block;font-family:"Spline Sans Mono",monospace;font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:5px 14px;letter-spacing:.04em}
  /* ---- researcher strip ---- */
  .rstrip{margin-top:40px;padding-top:18px;border-top:1px dashed var(--line-strong);font-size:13px;color:var(--ink-soft)}
  .rstrip summary{cursor:pointer;font-family:"Spline Sans Mono",monospace;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
  .rstrip .row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .rstrip select{font-family:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card)}
  /* ---- chat (Part 2 advice, Part 3 advising) ---- */
  .chat{display:flex;flex-direction:column;gap:11px;margin:4px 0 2px}
  .msg{max-width:84%;padding:13px 16px;border-radius:16px;font-size:15px;line-height:1.5}
  .msg.ai{align-self:flex-start;background:#FBFAF7;border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.ai .who{display:flex;align-items:center;gap:8px;margin:0 0 8px}
  .msg.ai .verdict{font-weight:600;margin:0 0 6px}
  .msg.ai p{margin:0;font-family:var(--agent-font)}
  .msg.ai .verdict{font-family:var(--agent-font)}
  .msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
  .msg.sys{align-self:center;background:transparent;border:1px dashed var(--line-strong);color:var(--ink-soft);font-size:13px;text-align:center;border-radius:10px}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:14px 16px;background:#FBFAF7;border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px}
  .typing i{width:7px;height:7px;border-radius:99px;background:var(--line-strong);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .chatask{margin-top:6px;font-size:14px;color:var(--ink-soft)}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .chip{border:1px solid var(--line-strong);background:var(--card);border-radius:99px;padding:11px 18px;cursor:pointer;font-size:14.5px;font-family:inherit;color:var(--ink);transition:all .12s ease}
  .chip:hover{border-color:var(--accent);background:var(--accent-soft)}
  .binary{display:flex;gap:10px;margin-top:8px}
  .binary .opt{flex:1}
  .binary .opt label{min-height:46px;font-size:14.5px}
  .fade{animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
  @media (max-width:560px){
    h1{font-size:30px}
    .opt{min-width:42px}
    .opt label{font-size:11px;min-height:42px}
    .legend{grid-template-columns:1fr}
  }
#protobar{position:fixed;left:0;right:0;bottom:0;z-index:9999;display:flex;gap:6px;
  align-items:center;flex-wrap:wrap;padding:7px 10px;background:#14181E;color:#E8ECF1;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
#protobar span{opacity:.6;margin-right:6px;letter-spacing:.06em;text-transform:uppercase}
#protobar button{font:inherit;background:#2A313B;color:#E8ECF1;border:1px solid #3A424E;
  border-radius:4px;padding:4px 9px;cursor:pointer}
#protobar button:hover{background:#3A424E}
  /* ---- within-subjects: three advisors side by side ---- */
  .wrap.wide{max-width:1180px}
  .wrap.wide .narrow{max-width:720px;margin-left:auto;margin-right:auto}
  .agtag{display:inline-flex;align-items:center;gap:6px;font-family:var(--agent-font);font-weight:600;font-size:14px;color:var(--ag);background:var(--ags);border:1px solid color-mix(in srgb,var(--ag) 30%,transparent);border-radius:99px;padding:3px 11px;white-space:nowrap;vertical-align:middle}

<script>
// DEMO MODE: section buttons advance without requiring every field to be filled.
// Off for real participants; add ?demo=1 to the URL for a click-through walkthrough.
// A ?demo=1 session is automatically flagged is_test, so it never counts as data.
const STUDY_VERSION = 'w6';   // within-subjects v6: w5 with its ten pilot dilemmas replaced by eight MoReBench rubric-tension dilemmas (outputs/stimuli_v5; src/build_within_v6.py). Everything else as w5.
const DEMO = new URLSearchParams(location.search).has('demo');

/* ============================================================
   BACKEND: RESPONSE LOGGING (no condition assignment: every participant sees all three)
   Set LOG_ENDPOINT to your deployed Google Apps Script web app URL
   (study_backend/apps_script_logger.gs — deployment steps in
   study_backend/SETUP.md). Empty string = fully offline: conditions are
   assigned locally and the export buttons still work for testing.
   ============================================================ */
const LOG_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyi_LAOMkMEDdqbmk5bX8jwrcjGmZ4Hi4U88uJb4Nnq7C_2XXCKmc4Xe-pphowXKUVf/exec';
const BACKEND_SECRET = '';          // must match CONFIG.SECRET in the Apps Script, if set there
const DETAIL_CHECK_COUNT = 4;   // vignette-detail checks, of eight dilemmas
const COMPLETION_CODE = 'SET-BEFORE-FIELDING'; // new Prolific study = new code; w4's C6ME12SA must not be reused

const URLP = new URLSearchParams(location.search);
// Anything logged while DEMO is on, or with ?test=1, is flagged so it can be
// excluded from condition balancing and stripped from the sheet before fielding.
const IS_TEST = DEMO || URLP.has('test');
// The researcher panels expose the manipulation and a force-condition control. They
// were rendering for everyone; no participant ever used the control (every non-test
// row assigned server-side) but the description alone is a demand characteristic.
const RESEARCHER = DEMO || URLP.has('researcher');

const PARTICIPANT = (function(){
  const fresh = () => Math.random().toString(36).slice(2,10) + '-' + Date.now().toString(36);
  // Persisted so a refresh or a resumed session keeps the same identity (and the same condition).
  let local;
  try{
    local = localStorage.getItem('ras_local_id');
    if(!local){ local = fresh(); localStorage.setItem('ras_local_id', local); }
  }catch(e){ local = fresh(); }   // private mode / storage blocked
  const pid = URLP.get('PROLIFIC_PID') || null;
  return {
    prolific_pid: pid,
    study_id:     URLP.get('STUDY_ID') || null,
    session_id:   URLP.get('SESSION_ID') || null,
    local_id:     local,
    participant_key: pid || local,   // key the backend stores rows against
  };
})();

function endpointURL(params){
  const u = new URL(LOG_ENDPOINT);
  Object.entries(params).forEach(([k,v])=>{ if(v!=null && v!=='') u.searchParams.set(k,v); });
  if(BACKEND_SECRET) u.searchParams.set('secret', BACKEND_SECRET);
  return u.toString();
}

let _logQueue = [];
const _inFlight = new Set();
let _inFlightBytes = 0, _retryTimer = null;
const KEEPALIVE_BUDGET = 56000;   // browsers refuse keepalive bodies beyond 64 KB in flight in total
function logSnapshot(phase, complete){
  if(!LOG_ENDPOINT) return;
  const payload = JSON.stringify({
    participant: PARTICIPANT,
    phase, complete: !!complete,

   queued snapshot at once overran the browser's 64 KB cap on keepalive bodies in
   flight when snapshots came close together (end of Part 3); the refused ones were
   only retried at the next snapshot, so the last few, including 'complete', were lost. */
/* Oldest first, as many at once as fit under the keepalive budget, and anything
   refused is retried every 3 s while the page is open. Before this, snapshots that
   came close together (the end of Part 3) overran the 64 KB cap; the refused ones
   were retried only at the next snapshot, so the last few, 'complete' included, were
   lost. The backend takes several seconds per request, so one-at-a-time falls behind. */
function flushLog(){
  if(!LOG_ENDPOINT) return;
  for(const payload of _logQueue.slice()){
    if(_inFlight.has(payload)) continue;
    if(_inFlight.size && _inFlightBytes + payload.length > KEEPALIVE_BUDGET) break;
    _inFlight.add(payload); _inFlightBytes += payload.length;
    // text/plain + no-cors avoids the CORS preflight that Apps Script can't answer
    fetch(LOG_ENDPOINT, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:payload, keepalive:true})
      .then(()=>{ _logQueue=_logQueue.filter(q=>q!==payload); settle(); flushLog(); })
      // a refused send waits for the timer, so a dead connection cannot spin
      .catch(()=>{ settle(); if(!_retryTimer) _retryTimer=setTimeout(()=>{ _retryTimer=null; flushLog(); }, 3000); });
    function settle(){ _inFlight.delete(payload); _inFlightBytes -= payload.length; }
  }
}

  if(DEMO && q!=null && PERMS[+q]){ S.perm=+q; S.permSource='forced'; return; }

    S.perm = Math.abs(h)%PERMS.length; S.permSource='key_hash'; return;
  }
  S.perm = Math.floor(Math.random()*PERMS.length); S.permSource='random';

/* ---- scoring ---- */
function scorePVQ(){
  const sums={}, counts={};
  PVQ_ITEMS.forEach((it,i)=>{
    if(S.pvq[i]==null) return;
    sums[it.v]=(sums[it.v]||0)+S.pvq[i];
    counts[it.v]=(counts[it.v]||0)+1;
  });
  // mean-centre (ipsatise) per Schwartz convention so high-low is relative
  const raw={}; let all=0,n=0;
  VALUES.forEach(v=>{ if(counts[v.key]){ raw[v.key]=sums[v.key]/counts[v.key]; all+=raw[v.key]; n++; } });
  const grand = n? all/n : 0;
  const out={};
  VALUES.forEach(v=> out[v.key] = raw[v.key]!=null ? +(raw[v.key]-grand).toFixed(3) : 0);
  S.valueScores=out;
  S.valueScoresRaw={}; VALUES.forEach(v=> S.valueScoresRaw[v.key] = raw[v.key]!=null ? +raw[v.key].toFixed(3) : null);
  S.pvqGrandMean = +grand.toFixed(3);
  // aligned pole per dilemma = the pole the participant leans toward; a tie is drawn at random and logged
  const poleScore=(keys)=>{ const xs=keys.map(k=>out[k]??0); return xs.reduce((a,b)=>a+b,0)/(xs.length||1); };
  DILEMMAS.forEach(d=>{
    const sp=poleScore(d.poles.pos), sn=poleScore(d.poles.neg);
    // A tie used to go to pos every time, which tilted assignment toward one pole.
    S.poleTie[d.id] = sp === sn;
    S.topValuesByAxis[d.id] = sp > sn ? 'pos' : sp < sn ? 'neg' : (Math.random() < .5 ? 'pos' : 'neg');
    // Logged so analysis can weight or drop items where the two poles sit close
    // together for this person: there the "aligned" side is close to a coin flip.
    S.poleDelta[d.id] = +Math.abs(sp-sn).toFixed(3);
    S.poleScores[d.id] = {pos:+sp.toFixed(3), neg:+sn.toFixed(3)};
  });
}

/* ---- AI response construction: condition × decision × value pole ---- */
function aiResponseFor(d, cond){
  const alignedPole = S.topValuesByAxis[d.id];      // 'pos' | 'neg'
  const otherPole = alignedPole==='pos' ? 'neg' : 'pos';
  const alignedDecision = alignedPole==='pos' ? 'A' : 'B';  // value-favored horn (A=decision_pos)
  // C3 = decision misaligned (opposite of the value-favored horn); else aligned
  const aiDecision = (cond==='C3') ? (alignedDecision==='A'?'B':'A') : alignedDecision;
  // C2 = reasoning misaligned (opposing pole); else aligned pole
  const reasonPole = (cond==='C2') ? otherPole : alignedPole;
  const verdict = aiDecision==='A' ? d.optA : d.optB;
  const reason = d.reasoning[reasonPole][aiDecision];
  return {verdict, reason, aiDecision, reasonPole};
}

/* One paragraph, reasoning first and the recommendation as its closing sentence,
   so the recommendation cannot be reached without passing through the reasons. */
function adviceParagraph(r){
  const v = String(r.verdict || '').trim();
  if(!v) return r.reason;
  const tail = v.charAt(0).toLowerCase() + v.slice(1);
  return `${r.reason} <i class="rec">So my advice would be to ${tail}</i>`;
}

function goBack(){
  if(NAV.length<2) return;
  NAV.pop();
  const p=NAV[NAV.length-1];
  restoring=true;
  S.di=p.di||0; S.p2stage=p.p2stage||null; S.ui=p.ui||0; S.delIdx=p.delIdx||0; S.advIdx=p.advIdx||0;
  dispatch(p.screenName);
  restoring=false;
  updateBack();
}
function updateBack(){
  const b=document.getElementById('backbtn');
  if(!b) return;
  // No going back into the situations from the first advisor page: the ratings are
  // meant to run off what they remember plus that advisor's history, not a re-read.
  const locked = ['uptake','checks','done'].indexOf(S.screenName)>=0 || (S.screenName==='advisor' && !S.advIdx);
  b.style.visibility = (NAV.length>1 && !locked) ? 'visible' : 'hidden';
}
function setProgress(){
  let idx = SCREENS.indexOf(S.screenName);
  // count progress through the ten situations, which are most of the study
  if(S.screenName==='dilemmas') idx += S.di/Math.max(1,S.order.length);
  const pct = Math.round((idx/(SCREENS.length-1))*100);
  document.getElementById('progbar').style.width = pct+'%';
  document.getElementById('phasetag').textContent = PHASE_OF[S.screenName] || '';
}
let _renderKey = null;
function render(html){
  markNav();
  const key = S.screenName + '|' + ({dilemmas:S.di, uptake:S.ui, delegation:S.delIdx}[S.screenName] ?? '');
  const fresh = (key !== _renderKey);
  _renderKey = key;

  app.classList.toggle('wide', WIDE_SCREENS.indexOf(S.screenName)>=0);

    app.classList.remove('fade'); void app.offsetWidth; app.classList.add('fade');
    window.scrollTo({top:0,behavior:'smooth'});
  } else {
    app.classList.remove('fade');
    window.scrollTo({top:y});
  }
  setProgress(); updateBack();
}
function likertRow(name, val, onpick, caps){
  const c = caps || ['1 · Strongly disagree','4 · Neither agree nor disagree','Strongly agree · 7'];
  return `<div class="scale likert7" role="radiogroup">${LIKERT7.map((lab,i)=>{
    const v=i+1, id=`${name}_${v}`;
    return `<div class="opt"><input type="radio" name="${name}" id="${id}" value="${v}" ${val==v?'checked':''} onchange="${onpick}(${v})"><label for="${id}" title="${caps?v:lab}">${v}</label></div>`;
  }).join('')}</div>
  <div class="scalecaps"><span>${c[0]}</span><span>${c[1]}</span><span>${c[2]}</span></div>`;
}

/* Decision history: what each advisor recommended on every situation so far, and in
   one line why. It no longer shows whom the participant said they would ask: that
   reminder pulled the ratings toward consistency with their own picks. Addresses the worry that nobody can hold ten
   situations × three advisors in their head by the final choice. */
// Fallback one-line reason (first sentence) for any cell missing from WHY.
function firstSentence(t){ const m = String(t||'').match(/^.*?[.!?](?=\s|$)/); return m ? m[0] : String(t||''); }
function whyLine(d, r){ return ((WHY[d.id]||{})[r.reasonPole]||{})[r.aiDecision] || firstSentence(r.reason); }
function historyTable(upto){
  const ag = agents();
  const ids = S.order.slice(0, upto).map(i=>DILEMMAS[i]);
  if(!ids.length) return '';
  const rows = ids.map((d,k)=>{
    const rr = S.resp[d.id]||{};
    const cells = ag.map(a=>{
      const r = aiResponseFor(d, a.cond);
      return `<td style="${agentStyle(a)}" class="hcell"><span class="hdec">${escHtml(d.recap[r.aiDecision])}</span><span class="hwhy">${escHtml(whyLine(d, r))}</span></td>`;
    }).join('');
    return `<tr><td class="hq"><span class="hn">${k+1}</span>${escHtml(dilemmaQuestion(d))}</td>${cells}</tr>`;
  }).join('');
  return `<div class="hwrap"><table class="history">
    <thead><tr><th>Situation</th>${ag.map(a=>`<th>${agentTag(a)}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

    S.screenName='delegation';
    const t = DELEG_W[S.delIdx], cur = (S.deleg[t.id] = S.deleg[t.id] || {});
    const ag = slotted('t:'+t.id);
    const row = (frame)=>`<div class="pickrow four">${ag.map(a=>
        `<button class="pickbtn${cur[frame]===a.cond?' sel':''}" style="${agentStyle(a)}" onclick="setDeleg('${t.id}','${frame}','${a.cond}')">${agentTag(a)}</button>`).join('')}
        <button class="pickbtn own${cur[frame]==='none'?' sel':''}" onclick="setDeleg('${t.id}','${frame}','none')"><span class="ownlab">None of them</span></button></div>`;
    const ready = (cur.advisor && cur.delegate) || DEMO;
    render(`
      <p class="eyebrow">Part 3 · Using the advisors · Task ${S.delIdx+1} of ${DELEG_W.length}</p>
      <h1 style="font-size:30px">How would you use the advisors?</h1>
      ${part3Recap('task:'+t.id)}
      <div class="deltask">
        <h3>${t.title}</h3>
        <div class="frame"><p class="q">${t.advisor}</p>${row('advisor')}</div>
        <div class="frame" style="margin-top:20px"><p class="q">${t.delegate}</p>${row('delegate')}</div>
      </div>
      <div class="btnrow"><button class="btn" ${ready?'':'disabled'} onclick="Screens.nextDeleg()">${S.delIdx+1<DELEG_W.length?'Next':'Continue'}</button></div>
    `);
  },
  nextDeleg(){
    const cur = S.deleg[DELEG_W[S.delIdx].id]||{};
    if(!DEMO && !(cur.advisor && cur.delegate)){ flashIncomplete(); return; }
    if(S.delIdx+1 < DELEG_W.length){ S.delIdx++; Screens.delegation(); }
    else { logSnapshot('delegation_done'); S.ui=0; Screens.uptake(); }
  },

  checks(){
    if(S.p3Key){ recapClose(S.p3Key); S.p3Key=null; }
    S.screenName='checks';
    render(`
      <p class="eyebrow">Part 3 · Almost done</p>
      <h1 style="font-size:30px">Any final thoughts?</h1>
      <div class="card">
        <p class="qtext" style="margin-bottom:8px">Anything you'd like to add about how you compared the advisors, or how they made you feel? (optional)</p>
        <textarea id="freetext" rows="3" style="width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:12px;font-family:inherit;font-size:15px;background:var(--card)" placeholder="Type here…">${escHtml(S.free)}</textarea>
      </div>
      <div class="btnrow"><button class="btn" onclick="Screens.finish()">Finish</button></div>
    `);
  },
  finish(){
    S.free=(document.getElementById('freetext')||{}).value||'';
    logSnapshot('complete', true);
    Screens.done();
  },

  done(){
    S.screenName='done';
    const counts = handoffCounts();
    render(`
      <p class="eyebrow">Complete</p>
      <h1>Thank you.</h1>
      <p class="lead">${LOG_ENDPOINT?'Your responses have been submitted automatically. You can close this window.':'Your responses are recorded on this device. You can export them below.'}</p>
      ${(LOG_ENDPOINT && PARTICIPANT.prolific_pid)?`<div class="card" style="text-align:center"><p class="muted" style="margin:0 0 6px">Your completion code</p><p style="font-family:'Spline Sans Mono',monospace;font-size:22px;letter-spacing:.08em;margin:0"><b>${COMPLETION_CODE}</b></p></div>`:''}
      <div class="card">
        <table class="sum">
          ${agents().map(a=>`<tr><td>Situations where you would ask ${agentTag(a)}</td><td>${counts[a.cond]} of ${S.order.length}</td></tr>`).join('')}
        </table>
      </div>
      <div class="btnrow">
        <button class="btn ${LOG_ENDPOINT?'ghost':''}" onclick="downloadJSON()">${LOG_ENDPOINT?'Download a copy (JSON)':'Download responses (JSON)'}</button>
        <button class="btn ${LOG_ENDPOINT?'ghost':'line'}" onclick="downloadCSV()">Download (CSV)</button>
        <button class="btn ghost" onclick="restart()">New session</button>
      </div>
      <div class="card" style="text-align:center">
        <p style="margin:0 0 12px" class="muted">Curious what your answers say about your values?</p>
        <button class="btn line" id="showprofile" onclick="toggleProfile()">Show my value profile</button>
        <div id="profilereveal" style="display:none;margin-top:20px">
          <div class="wheelwrap">${circumplexSVG()}<div class="legend">${legendHTML()}</div></div>
          <p class="muted" style="font-size:13px;margin-top:14px">Shown only now, after your responses were recorded, so it couldn’t affect your answers.</p>
        </div>
      </div>
    `);
  }
};

/* ============================================================
   SETTERS
   ============================================================ */
function setAiexp(key,v){ S.aiexp[key]=v; }
function setAiLit(key,v){ S.ailit[key]=v; }
function setDemog(key,val){
  S.demog[key]=val||null;
  if(key==='gender'){
    const self=document.getElementById('dg_gender_self');
    if(self) self.style.display = (val==='Prefer to self-describe') ? 'block' : 'none';
  }
  updateStartBtn();
}
function updateStartBtn(){
  const b=document.getElementById('start'); if(!b) return;
  const c1=document.getElementById('c1'), c2=document.getElementById('c2');
  const consented = !!(c1&&c1.checked && c2&&c2.checked);
  const demogDone = DEMO || DEMOGRAPHICS.every(q=>S.demog[q.key]);
  b.disabled = !(consented && demogDone);
}
function setPVQ(i,v){ S.pvq[i]=v; updatePVQCount(); }
function updatePVQCount(){
  const a=PVQ_ITEMS.filter((_,i)=>S.pvq[i]!=null).length;
  const el=document.getElementById('pvqcount'); if(el) el.textContent=`${a} / ${PVQ_ITEMS.length} answered`;
}
function ensureCompOrders(d){
  // Per-participant shuffled display order for the detail-check options, fixed on first render.
  const c=(S.comp[d.id]=S.comp[d.id]||{});
  if(!c.detail_order) c.detail_order=shuffle([0,1,2]);          // 0 = correct answer
  return c;
}
function setDetail(idx){
  const d=DILEMMAS[S.order[S.di]];
  const c=(S.comp[d.id]=S.comp[d.id]||{});
  if(c.detail===idx) return;
  const correct = (idx===0);
  if(c.detail_first===undefined) c.detail_first=correct;   // first-attempt correctness, logged once
  c.detail_tries=(c.detail_tries||0)+1;
  c.detail=idx;
  Screens.dilemmas();
  if(correct){
    const dd=d;
    setTimeout(()=>{
      if(S.screenName!=='dilemmas' || S.p2stage!=='detail') return;
      if(DILEMMAS[S.order[S.di]]!==dd) return;
      S.p2stage='shown'; markReveal(dd, 'detail'); Screens.dilemmas();
    }, reduceMotion()?0:400);
  }
}
/* The situation shows alone first; the replies appear on a click (or straight after
   a correct detail check). read_ms is the time from the situation to the replies. */
function markReveal(d, via){
  const rr=(S.resp[d.id]=S.resp[d.id]||{});
  if(rr.revealed) return;
  rr.revealed=true; rr.reveal_via=via; rr.anim=!reduceMotion();
  rr.read_ms = Date.now() - (rr.t_prompt||Date.now());
}
function revealAdvisors(){
  const d=DILEMMAS[S.order[S.di]];
  markReveal(d, 'click');
  Screens.dilemmas();
  const g=document.querySelector('.agrid'); if(g) g.scrollIntoView({behavior:reduceMotion()?'auto':'smooth', block:'start'});
}
function respComplete(d){
  const rr=S.resp[d.id]||{};
  return !!rr.handoff;
}
function setHandoff(cond){
  const d=DILEMMAS[S.order[S.di]];
  const rr=(S.resp[d.id]=S.resp[d.id]||{});
  if(rr.handoff && rr.handoff!==cond) rr.handoff_changes=(rr.handoff_changes||0)+1;
  rr.handoff=cond;
  Screens.dilemmas();
}
function setRating(bucket,key,cond,v){ (S[bucket][key]=S[bucket][key]||{})[cond]=v; }
/* The all-advisor recap as a toggle on each advisor page, closed by default, so
   people can look up the other two while rating this one. Opens and open time are
   logged per page. */
function recapToggle(key, open){
  S.recapViews = S.recapViews || {};
  const v = S.recapViews[key] = S.recapViews[key] || {opens:0, ms:0, t:null};
  if(v.t){ v.ms += Date.now() - v.t; v.t = null; }   // a re-render drops the open table without a toggle event
  if(open){ v.opens++; v.t = Date.now(); }
}
function recapClose(key){ const v = (S.recapViews||{})[key]; if(v && v.t) recapToggle(key, false); }
function valueTagsBlock(a){
  if(!S.tagOrder) S.tagOrder = shuffle(VALUE_TAGS.map(x=>x.v));
  const picked = S.valueTags[a.cond]||[];
  const unsure = picked[0]==='unsure';
  const full = !unsure && picked.length>=VALUE_TAG_MAX;
  const lab = Object.fromEntries(VALUE_TAGS.map(x=>[x.v,x.t]));
  const btn = (v,t,extra)=>{
    const sel = picked.indexOf(v)>=0;
    return `<button type="button" class="vtag${extra||''}${sel?' sel':''}" aria-pressed="${sel}" ${(!sel && full && v!=='unsure')?'disabled':''} onclick="toggleValueTag('${a.cond}','${v}')">${t}</button>`;
  };
  return `<p class="qtext" style="margin-top:6px">Looking at its decisions and reasons, what does <b class="advname" style="${agentStyle(a)}">${a.name}</b> seem to care about most? Pick up to ${VALUE_TAG_MAX}.</p>
    <div class="vtags">${S.tagOrder.map(v=>btn(v, lab[v])).join('')}${btn('unsure','Hard to tell',' none')}</div>
    <p class="muted" style="margin:10px 0 0;font-size:13px">${unsure?'':`${picked.length} of ${VALUE_TAG_MAX} picked`}</p>`;
}
function toggleValueTag(c, v){
  let cur = (S.valueTags[c]||[]).slice();
  if(cur.length) S.valueTagChanges[c] = (S.valueTagChanges[c]||0)+1;
  if(v==='unsure') cur = (cur[0]==='unsure') ? [] : ['unsure'];
  else {
    cur = cur.filter(x=>x!=='unsure');
    const i = cur.indexOf(v);
    if(i>=0) cur.splice(i,1); else if(cur.length<VALUE_TAG_MAX) cur.push(v);
  }
  S.valueTags[c] = cur;
  const card = document.getElementById('vtagcard');
  if(card) card.innerHTML = `<p class="battlab">What it cares about</p>${valueTagsBlock(agentByCond(c))}`;
}
/* The values an advisor actually argued from (reason pole) and sided with (decision
   pole) on this participant's ten situations, for scoring the tags. */
function advisorValueProfile(c){
  const reason={}, decision={};
  DILEMMAS.forEach(d=>{
    if(S.topValuesByAxis[d.id]==null) return;
    const r = aiResponseFor(d, c);
    (d.poles[r.reasonPole]||[]).forEach(v=>reason[v]=(reason[v]||0)+1);
    (d.poles[r.aiDecision==='A'?'pos':'neg']||[]).forEach(v=>decision[v]=(decision[v]||0)+1);
  });
  return {reason, decision};
}
/* Part 3 recap: closed by default on every task and friend screen. Holds what the
   participant said each advisor cares about (their own tags, nothing from us) and the
   all-advisor decision table. Opens and open time are logged per screen. */
function part3Recap(key){
  S.p3Open = S.p3Open || {};
  if(S.p3Key && S.p3Key!==key){ recapClose(S.p3Key); }
  S.p3Key = key;
  const lab = Object.fromEntries(VALUE_TAGS.map(x=>[x.v,x.t]));
  const said = c=>{ const t=(S.valueTags||{})[c]||[];
    if(!t.length) return '<span class="muted">No words picked</span>';
    if(t[0]==='unsure') return 'Hard to tell';
    return t.map(v=>escHtml(lab[v]||v)).join('<br>'); };
  const tags = agents().map(a=>`<div class="p3tag" style="${agentStyle(a)}">${agentTag(a)}<span class="lab">You said it cares about</span>${said(a.cond)}</div>`).join('');
  return `<details class="hist recapt p3recap" ${S.p3Open[key]?'open':''} ontoggle="p3RecapToggle('${key}', this.open)">
    <summary>Recap: what you said about each advisor, and what each one decided</summary>
    <div class="p3tags">${tags}</div>
    <p class="p3sub">What each advisor decided in the ${S.order.length} situations</p>
    ${historyTable(S.order.length)}</details>`;
}
function p3RecapToggle(key, open){
  S.p3Open = S.p3Open || {};
  S.p3Open[key] = open;
  const v = (S.recapViews||{})[key];
  const isOpen = !!(v && v.t);
  if(open===isOpen) return;          // a re-render restoring the open state is not a new open
  recapToggle(key, open);
}
function advisorDone(c){ return (S.valueTags[c]||[]).length>0 && AGENT_ITEMS.every(it=>(S.ratings[it.key]||{})[c]!=null) && INTENT_ITEMS.every(it=>(S.intent[it.key]||{})[c]!=null); }
/* One advisor's decisions on all ten situations, with the one-line reason, in the
   order the participant saw them. All ten rather than a sample, so every participant
   rates against the same record. */
function advisorHistory(a){
  return `<div class="advgrid" style="${agentStyle(a)}">${S.order.map(i=>DILEMMAS[i]).map((d,k)=>{
    const r = aiResponseFor(d, a.cond);
    return `<div class="advbox"><span class="hn">${k+1}</span><span class="aq">${escHtml(dilemmaQuestion(d))}</span><span class="hdec">${escHtml(d.recap[r.aiDecision])}</span><span class="hwhy">${escHtml(whyLine(d, r))}</span></div>`;
  }).join('')}</div>`;
}
function uptakePick(choice){
  if(S.p3Key){ recapClose(S.p3Key); }
  const b = BEHAVIORALS[S.ui], u = S.uptake[b.id];
  if(u.choice) return;
  u.choice = choice; u.decide_ms = Date.now() - u.tShown;
  Screens.uptake();
  setTimeout(()=>{
    if(S.screenName!=='uptake' || BEHAVIORALS[S.ui]!==b) return;
    logSnapshot('friend_'+(S.ui+1));
    if(S.ui+1 < BEHAVIORALS.length){ S.ui++; Screens.uptake(); }
    else { logSnapshot('friends_done'); Screens.checks(); }
  }, reduceMotion()?0:UPTAKE_LOCK_MS);
}
function setDeleg(id,frame,v){ (S.deleg[id]=S.deleg[id]||{})[frame]=v; Screens.delegation(); }
function mostlyChoseLine(){
  const n = handoffCounts();
  const max = Math.max(...CONDITIONS.map(c=>n[c]));
  const top = CONDITIONS.filter(c=>n[c]===max).map(agentByCond);
  return top.length===1
    ? `You chose to ask ${agentTag(top[0])} in ${max} of the ${S.order.length} situations, more often than either of the others.`
    : `You chose to ask ${top.map(agentTag).join(' and ')} in ${max} of the ${S.order.length} situations each.`;
}
function handoffCounts(){
  const n={C1:0,C2:0,C3:0};
  Object.values(S.resp).forEach(rr=>{ if(rr && rr.handoff) n[rr.handoff]++; });
  return n;
}
function toggleProfile(){
  const r=document.getElementById('profilereveal'); const b=document.getElementById('showprofile');
  if(!r) return;
  const open = r.style.display!=='none';
  r.style.display = open ? 'none' : 'block';
  if(b) b.textContent = open ? 'Show my value profile' : 'Hide my value profile';
}
function reduceMotion(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches; }
function flashIncomplete(){
  const btn=document.querySelector('.btnrow .btn'); if(!btn) return;
  btn.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:250});
  let t=document.getElementById('incomplete'); if(!t){t=document.createElement('span');t.id='incomplete';t.className='muted';t.style.marginLeft='10px';t.textContent='Please answer all items above.';btn.parentNode.appendChild(t);}
}

/* ============================================================
   CIRCUMPLEX
   ============================================================ */
function circumplexSVG(){
  const cx=130,cy=130,rIn=30,rOut=100, n=VALUES.length;
  const scores=VALUES.map(v=>S.valueScores[v.key]||0);
  const max=Math.max(0.5,...scores.map(Math.abs));
  const hoColor={'Openness to Change':'#3D7A8C','Openness / Self-Enhancement':'#6A7A8C','Self-Enhancement':'#A9603A','Conservation':'#8A7A4A','Self-Transcendence':'#3F6B52'};
  let segs='';
  for(let i=0;i<n;i++){
    const a0=(i/n)*2*Math.PI - Math.PI/2 - Math.PI/n;
    const a1=((i+1)/n)*2*Math.PI - Math.PI/2 - Math.PI/n;
    const norm=(scores[i]+max)/(2*max);
    const r=rIn+(rOut-rIn)*Math.max(.08,norm);
    const p=(ang,rr)=>[cx+rr*Math.cos(ang),cy+rr*Math.sin(ang)];
    const [x0,y0]=p(a0,rIn),[x1,y1]=p(a0,r),[x2,y2]=p(a1,r),[x3,y3]=p(a1,rIn);
    const fill=hoColor[VALUES[i].ho]||'#888';
    const op=(0.25+0.6*norm).toFixed(2);
    segs+=`<path d="M${x0},${y0} L${x1},${y1} A${r},${r} 0 0 1 ${x2},${y2} L${x3},${y3} A${rIn},${rIn} 0 0 0 ${x0},${y0} Z" fill="${fill}" fill-opacity="${op}" stroke="#fff" stroke-width="1"/>`;
    const am=(a0+a1)/2; const lr=rOut+10;
    const [lx,ly]=p(am,lr);
    const anchor = Math.cos(am)>0.2?'start':(Math.cos(am)<-0.2?'end':'middle');
    segs+=`<text x="${lx}" y="${ly}" font-size="8" fill="#565B64" text-anchor="${anchor}" dominant-baseline="middle" font-family="Spline Sans Mono, monospace">${VALUES[i].label}</text>`;
  }
  return `<svg viewBox="-74 -22 418 322" width="300" height="231" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Schwartz value circumplex">${segs}<circle cx="${cx}" cy="${cy}" r="${rIn-2}" fill="#FBF9F5" stroke="var(--line)"/></svg>`;
}
function legendHTML(){
  const groups={};
  VALUES.forEach(v=>{(groups[v.ho]=groups[v.ho]||[]).push(v);});
  let h='';
  Object.entries(groups).forEach(([ho,vs])=>{
    h+=`<div class="ho">${ho}</div>`;
    vs.forEach(v=>{ h+=`<div class="v"><b>${v.label}</b><span>${(S.valueScores[v.key]>=0?'+':'')}${(S.valueScores[v.key]||0).toFixed(2)}</span></div>`; });
  });
  return h;
}

/* ============================================================
   EXPORT
   Everything per-condition is keyed C1/C2/C3, not by advisor name, so the sheet
   reads the same whichever slot a condition landed in. agent_map says where.
   ============================================================ */
function collect(){
  const ag = (S.perm!=null) ? agents() : [];
  const ready = (d)=> S.perm!=null && S.topValuesByAxis[d.id]!=null;
  return {
    timestamp:new Date().toISOString(),
    design:'within',
    participant:PARTICIPANT,
    demographics:S.demog,
    ai_experience:S.aiexp,
    ai_literacy:S.ailit,
    ai_literacy_mean:aiLiteracyMean(),
    is_test:IS_TEST,
    perm:S.perm, perm_source:S.permSource,
    agent_map:Object.fromEntries(ag.map(a=>[a.cond,{name:a.name, slot:a.slot}])),
    valueScores:S.valueScores,
    valueScoresRaw:S.valueScoresRaw,
    pvq_grand_mean:S.pvqGrandMean,
    pvq_raw:S.pvq,
    dilemma_order:S.order.map(i=>DILEMMAS[i].id),
    dilemmas:Object.fromEntries(DILEMMAS.map(d=>{
      const rr=S.resp[d.id]||{}, c=S.comp[d.id]||{};
      const per=Object.fromEntries(CONDITIONS.map(cond=>{
        const r = ready(d) ? aiResponseFor(d, cond) : {aiDecision:null, reasonPole:null};
        return [cond,{ai_decision:r.aiDecision, reason_pole:r.reasonPole}];
      }));
      return [d.id, Object.assign({
        axis:d.axis, dim:d.dim,
        aligned_pole:S.topValuesByAxis[d.id]||null,
        pole_delta:S.poleDelta[d.id]??null,
        pole_pos:(S.poleScores[d.id]||{}).pos??null,
        pole_neg:(S.poleScores[d.id]||{}).neg??null,
        pole_tie:!!(S.poleTie||{})[d.id],
        position:rr.position??null, ms:rr.ms??null,
        // v4: time reading the situation alone before the replies; 'click' or 'detail'
        read_ms:rr.read_ms??null, reveal_via:rr.reveal_via??null,
        // "If you faced a decision like this yourself, which advisor would you want to ask?"
        would_ask:rr.handoff??null, would_ask_changes:rr.handoff_changes||0,
        // w5: conditions left to right as shown, and the position (1-3) of the pick
        slot_order:(S.slots||{})['d:'+d.id]||null, pick_slot:(rr.handoff && (S.slots||{})['d:'+d.id]) ? S.slots['d:'+d.id].indexOf(rr.handoff)+1 : null,
        detail_asked:(S.detailOn||[]).indexOf(d.id)>=0,
        detail_first_ok:c.detail_first??null, detail_tries:c.detail_tries||0,
      }, per)];
    })),
    would_ask_counts:handoffCounts(),
    // conditions in the order their rating pages came, and time on each page
    advisor_order:S.advOrder||[],
    advisor_page_ms:Object.fromEntries(CONDITIONS.map(c=>[c,((S.advPages||{})[c]||{}).ms??null])),
    // the all-advisor recap toggle, per advisor page: times opened, total ms open
    // v4: the Part 3 recap toggle, per task ('task:<id>') and friend ('friend:<id>') screen
    part3_recap_views:Object.fromEntries(DELEG_W.map(t=>'task:'+t.id).concat(BEHAVIORALS.map(b=>'friend:'+b.id)).map(k=>{const v=(S.recapViews||{})[k]||{};return [k,{opens:v.opens||0, ms:v.ms||0}];})),
    recap_views:Object.fromEntries(CONDITIONS.map(c=>{const v=(S.recapViews||{})[c]||{};return [c,{opens:v.opens||0, ms:v.ms||0}];})),
    // v4: value words picked per advisor ('unsure' = Hard to tell), their display order,
    // and the values each advisor actually reasoned from / decided for, counted over the ten
    value_tags:Object.fromEntries(CONDITIONS.map(c=>[c,(S.valueTags||{})[c]||[]])),
    value_tag_changes:Object.fromEntries(CONDITIONS.map(c=>[c,(S.valueTagChanges||{})[c]||0])),
    value_tag_order:S.tagOrder||[],
    advisor_value_profile:Object.fromEntries(CONDITIONS.map(c=>[c, S.perm!=null ? advisorValueProfile(c) : null])),
    ratings:Object.fromEntries(AGENT_ITEMS.map(it=>[it.key, Object.fromEntries(CONDITIONS.map(c=>[c,(S.ratings[it.key]||{})[c]??null]))])),
    intent:Object.fromEntries(INTENT_ITEMS.map(it=>[it.key, Object.fromEntries(CONDITIONS.map(c=>[c,(S.intent[it.key]||{})[c]??null]))])),
    // choice: 'own' (write it myself) or the condition of the advisor asked to draft
    friends:Object.fromEntries(BEHAVIORALS.map(b=>{const u=S.uptake[b.id]||{};
      return [b.id,{source_dilemma:b.source, axis:b.axis, dim:b.dim, choice:u.choice??null, decide_ms:u.decide_ms??null, slot_order:(S.slots||{})['f:'+b.id]||null}];})),
    // advisor/delegate: the condition picked, or 'none'
    delegation:Object.fromEntries(DELEG_W.map(t=>{const c=S.deleg[t.id]||{}; return [t.id,{advisor:c.advisor??null, delegate:c.delegate??null, slot_order:(S.slots||{})['t:'+t.id]||null}];})),
    open_response:S.free||'',
  };
}
function aiLiteracyMean(){
  const vs=AI_LITERACY.map(it=>{
    const v=S.ailit[it.key];
    return v==null ? null : (it.reverse ? (8-v) : v);
  });
  if(vs.some(v=>v==null)) return null;
  return +(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(3);
}
function dl(name,text,type){
  const blob=new Blob([text],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function flatten(o, pre, out){
  Object.entries(o||{}).forEach(([k,v])=>{
    const key = pre ? pre+'.'+k : k;
    if(v && typeof v==='object' && !Array.isArray(v)) flatten(v, key, out);
    else out[key] = Array.isArray(v) ? v.join('|') : v;
  });
  return out;
}
function downloadJSON(){ dl(`within_${Date.now()}.json`, JSON.stringify(collect(),null,2),'application/json'); }
function downloadCSV(){
  const flat = flatten(collect(), '', {});
  const q = v => v==null ? '' : '"'+String(v).replace(/"/g,'""').replace(/\r?\n/g,' ')+'"';
  const rows = [['field','value']].concat(Object.entries(flat).map(([k,v])=>[k,q(v)]));
  dl(`within_${Date.now()}.csv`, rows.map(r=>r.join(',')).join('\n'),'text/csv');
}
function restart(){
  // Hand the next person a fresh identity when there's no Prolific ID to key on, or
  // the responses sheet (upserted on participant_key) would overwrite the last person.
  if(!PARTICIPANT.prolific_pid){
    const fresh = Math.random().toString(36).slice(2,10) + '-' + Date.now().toString(36);
    try{ localStorage.setItem('ras_local_id', fresh); }catch(e){}
    PARTICIPANT.local_id = fresh;
    PARTICIPANT.participant_key = fresh;
  }
  Object.assign(S,{perm:null,permSource:null,aiexp:{},demog:{},ailit:{},pvq:{},valueScores:{},valueScoresRaw:{},pvqGrandMean:null,
    topValuesByAxis:{},poleDelta:{},poleScores:{},poleTie:{},order:[],di:0,p2stage:null,detailOn:null,comp:{},resp:{},final:{},advOrder:[],advIdx:0,advPages:{},recapViews:{},ratings:{},slots:{},tagOrder:null,valueTags:{},valueTagChanges:{},p3Open:{},p3Key:null,intent:{},ui:0,uptake:{},delIdx:0,deleg:{},free:''});
  NAV=[]; Screens.welcome();
}

/* ============================================================
   RESEARCHER STRIP
   ============================================================ */
function researcherStrip(){
  if(!RESEARCHER) return '';
  const opts = PERMS.map((p,i)=>`<option value="${i}" ${S.forcedPerm===i?'selected':''}>${i} · ${AGENT_STYLES.map((st,j)=>st.name+'='+p[j]).join(', ')}</option>`).join('');
  return `<details class="rstrip"><summary>Researcher preview</summary>
    <div class="row">
      <label>Force slot permutation:</label>
      <select id="rperm"><option value="">By participant key</option>${opts}</select>
    </div>
    <p style="margin-top:10px">This session: ${agents().map(a=>`${a.name} = <b>${a.cond}</b>`).join(' · ')} <span class="muted">(${S.permSource||'-'})</span>.
      C1 = decision+ reasoning+, C2 = decision+ reasoning−, C3 = decision− reasoning+.</p>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" type="button" id="rping" onclick="testBackend()">Test backend</button>
      <span class="muted" id="rpingout">${LOG_ENDPOINT?'Logging enabled.':'No LOG_ENDPOINT set — offline mode, no logging.'}</span>
    </div>
    <p style="margin-top:10px" class="muted">Participant key: <code>${PARTICIPANT.participant_key}</code>${IS_TEST?' · <b>test session</b> (DEMO=true or ?test=1)':''}</p>
  </details>`;
}
function wireResearcher(){
  const sel=document.getElementById('rperm');
  if(sel) sel.onchange=()=>{
    S.forcedPerm = sel.value==='' ? null : +sel.value;
    S.perm=null; assignPerm(); Screens.welcome();
  };
}
function pingBackend(){
  if(!LOG_ENDPOINT) return Promise.resolve({ok:false, error:'LOG_ENDPOINT is empty'});
  return fetch(endpointURL({action:'ping'}), {method:'GET'})
    .then(r=>r.json())
    .catch(err=>({ok:false, error:String(err && err.message || err)}));
}
function testBackend(){
  const out=document.getElementById('rpingout');
  if(out) out.textContent='Checking…';
  pingBackend().then(j=>{
    if(!out) return;
    out.textContent = j && j.ok ? `Backend reachable (v${j.version}).` : `Backend unreachable: ${j && j.error || 'unknown error'}.`;
  });
}

/* ---- boot ---- */
(function boot(){
  const SKIP = DEMO ? URLP.get('skipto') : null;
  if(SKIP){ seedPrototype(); S.di=0; S.p2stage=null; dispatch(SKIP); }
  else { Screens.welcome(); }
  protoBar();
})();

// Wake the Apps Script instance on page load so the first snapshot isn't the slow one.
if(LOG_ENDPOINT){ try{ fetch(endpointURL({action:'ping'}), {method:'GET', mode:'no-cors'}).catch(()=>{}); }catch(e){} }
