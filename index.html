<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Everyday Decisions Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F2EC;
    --card:#FBF9F5;
    --ink:#1E2126;
    --ink-soft:#565B64;
    --line:#E2DCD0;
    --line-strong:#CFC7B6;
    --accent:#3D5A80;
    --accent-soft:#E7ECF2;
    --agent-font:'Space Grotesk','Inter',sans-serif;
    --warm:#A9603A;
    --good:#3F6B52;
    --radius:14px;
    --maxw:720px;
    --shadow:0 1px 2px rgba(30,33,38,.04), 0 8px 30px rgba(30,33,38,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px 96px}
  /* ---- top bar ---- */
  header.bar{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .bar-inner{max-width:var(--maxw);margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
  .backbtn{appearance:none;border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);width:30px;height:30px;border-radius:99px;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .12s ease;flex:none}
  .backbtn:hover{border-color:var(--accent);color:var(--accent)}
  .mark{font-family:"Spline Sans Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .mark b{color:var(--ink);font-weight:500}
  .progress{flex:1;height:5px;background:var(--line);border-radius:99px;overflow:hidden}
  .progress > i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .phasetag{font-family:"Spline Sans Mono",monospace;font-size:11px;color:var(--accent);letter-spacing:.08em;white-space:nowrap}
  /* ---- screen ---- */
  main{padding-top:34px}
  .eyebrow{font-family:"Spline Sans Mono",monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--warm);margin:0 0 12px}
  h1{font-family:"Newsreader",serif;font-weight:500;font-size:38px;line-height:1.12;letter-spacing:-.01em;margin:0 0 16px}
  h2{font-family:"Newsreader",serif;font-weight:500;font-size:26px;line-height:1.2;margin:0 0 12px}
  p.lead{font-size:17px;color:var(--ink-soft);margin:0 0 18px}
  p{margin:0 0 14px}
  .muted{color:var(--ink-soft)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin:0 0 18px}
  .note{font-size:13.5px;color:var(--ink-soft);background:#FFFDF8;border:1px dashed var(--line-strong);border-radius:10px;padding:12px 14px;margin:14px 0}
  .note b{color:var(--warm)}
  /* ---- buttons ---- */
  .btnrow{display:flex;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}
  button{font-family:inherit}
  .btn{
    appearance:none;border:none;cursor:pointer;
    background:var(--accent);color:#fff;
    font-size:15px;font-weight:500;
    padding:13px 24px;border-radius:99px;
    transition:transform .08s ease, background .2s ease, opacity .2s;
  }
  .btn:hover{background:#34507a}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink-soft);padding:13px 14px}
  .btn.ghost:hover{color:var(--ink);background:transparent}
  .btn.line{background:transparent;color:var(--accent);border:1px solid var(--line-strong)}
  .btn.line:hover{background:var(--accent-soft)}
  /* ---- consent / checks ---- */
  label.check{display:flex;gap:11px;align-items:flex-start;cursor:pointer;font-size:15px;padding:6px 0}
  label.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
  /* ---- PVQ ---- */
  .qitem{padding:18px 0;border-bottom:1px solid var(--line)}
  .qitem:last-child{border-bottom:none}
  .qtext{font-size:16px;margin:0 0 12px}
  .qtext .n{font-family:"Spline Sans Mono",monospace;color:var(--ink-soft);font-size:13px;margin-right:8px}
  .scale{display:flex;gap:6px;flex-wrap:wrap}
  .scale.likert7 .opt{min-width:40px}
  .scale.likert5 .opt{min-width:52px}
  .opt{flex:1;min-width:64px}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt label{
    display:block;text-align:center;cursor:pointer;
    border:1px solid var(--line-strong);border-radius:9px;
    padding:9px 4px;font-size:12.5px;color:var(--ink-soft);line-height:1.2;
    transition:all .12s ease;background:var(--card);
    min-height:46px;display:flex;align-items:center;justify-content:center;
  }
  .opt input:checked + label{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
  .opt label:hover{border-color:var(--accent)}
  .opt input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
  .scalecaps{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-top:7px;font-family:"Spline Sans Mono",monospace;letter-spacing:.02em}
  /* ---- dilemma ---- */
  .dilemma{font-family:"Newsreader",serif;font-size:19px;line-height:1.5}
  .options{display:grid;gap:10px;margin-top:18px}
  .bigopt{
    display:flex;gap:12px;align-items:flex-start;cursor:pointer;
    border:1px solid var(--line-strong);border-radius:12px;padding:15px 16px;background:var(--card);
    transition:all .12s ease;
  }
  .bigopt:hover{border-color:var(--accent)}
  .bigopt input{margin-top:2px;accent-color:var(--accent);width:18px;height:18px}
  .bigopt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .bigopt .lab{font-family:"Inter";font-size:15px}
  /* ---- AI response ---- */
  .ai{border:1px solid var(--line);border-left:3px solid var(--accent);background:#FBFAF7;border-radius:10px;padding:18px 20px;margin:6px 0 6px}
  .ai .who{display:flex;align-items:center;gap:9px;margin:0 0 12px}
  .who .ava{width:25px;height:25px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;background:var(--accent-soft);border:1px solid #cdd8e6;border-radius:7px;box-shadow:inset 0 1px 0 #fff,0 1px 1px rgba(30,33,38,.05)}
  .who b{font-family:"Inter";font-weight:700;color:var(--accent);font-size:13.5px;letter-spacing:.01em}
  .ai .verdict{font-weight:600;margin:0 0 8px}
  .ai .reason{color:var(--ink);margin:0;font-family:var(--agent-font);font-size:15px;line-height:1.55}
  .ai .verdict{font-family:var(--agent-font)}
  .agentref{font-family:var(--agent-font);font-weight:600;color:var(--accent);white-space:nowrap}
  .msg.ai .answer{margin:0;line-height:1.6}
  .gatehint{font-family:var(--sans, system-ui);font-size:13px;color:var(--soft,#565B64);
    margin:12px 0 0;opacity:.85}
  .gatehint b{font-variant-numeric:tabular-nums}
  .forkbtn[disabled]{opacity:.45;cursor:default}
  .forkbtn[disabled]:hover{border-color:var(--line)}
  .dilemma.dim{opacity:.5;transition:opacity .25s}
  .sending{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:15.5px;
    color:var(--soft, #565B64)}
  .dots{display:inline-flex;gap:4px}
  .dots i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35;
    animation:blip 1.1s infinite}
  .dots i:nth-child(2){animation-delay:.18s} .dots i:nth-child(3){animation-delay:.36s}
  @keyframes blip{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.5}}
  .forkrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .forkbtn{font-family:inherit;font-size:15.5px;font-weight:600;line-height:1.35;padding:22px 18px;
    border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
    text-align:left}
  .forkbtn:hover{border-color:var(--accent)}
  .forkbtn.bot{border-color:#D8C4B4}
  .freetext{width:100%;font-family:inherit;font-size:16px;line-height:1.55;padding:12px 13px;
    border:1px solid var(--line);border-radius:8px;margin-top:10px;resize:vertical}
  @media(max-width:560px){.forkrow{grid-template-columns:1fr}}
  .rlabel{font-family:"Spline Sans Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:2px 0 4px;opacity:.85}
  .compbox{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .compq{font-size:14px;font-weight:600;color:var(--ink);margin:0 0 9px}
  .compopts{display:flex;flex-direction:column;gap:8px}
  .compopt{text-align:left;border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:11px 14px;cursor:pointer;font-size:14px;font-family:inherit;color:var(--ink);transition:all .12s}
  .compopt:hover{border-color:var(--accent)}
  .compopt.sel{background:var(--accent-soft);border-color:var(--accent)}
  .compopt.wrong{background:#FBE9E4;border-color:#C6543B;color:#7A2417}
  .comphint{font-size:13px;color:#A9603A;margin:12px 0 0;font-style:italic}
  .stepnum{flex:none;width:24px;height:24px;border-radius:99px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
  /* ---- circumplex ---- */
  .wheelwrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
  .legend{font-size:13px;color:var(--ink-soft);display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
  .legend .ho{font-weight:600;color:var(--ink);grid-column:1/-1;margin-top:6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .legend .v{display:flex;justify-content:space-between;gap:10px}
  .legend .v b{font-weight:500;color:var(--ink)}
  /* ---- delegation grid ---- */
  .deltask{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;background:var(--card)}
  .deltask h3{font-family:"Newsreader",serif;font-weight:500;font-size:18px;margin:0 0 4px}
  .deltask .tags{font-family:"Spline Sans Mono",monospace;font-size:10.5px;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:12px}
  .deltask .tags span{background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:2px 8px;margin-right:6px}
  .frame{margin:14px 0 4px}
  .frame .q{font-size:14.5px;margin:0 0 8px}
  .frame .q .pill{font-family:"Spline Sans Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:99px;padding:2px 7px;margin-right:7px}
  /* ---- summary / export ---- */
  table.sum{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
  table.sum td{padding:7px 8px;border-bottom:1px solid var(--line)}
  table.sum td:first-child{color:var(--ink-soft)}
  table.sum td:last-child{text-align:right;font-family:"Spline Sans Mono",monospace}
  .pillbig{display:inline-block;font-family:"Spline Sans Mono",monospace;font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:5px 14px;letter-spacing:.04em}
  /* ---- researcher strip ---- */
  .rstrip{margin-top:40px;padding-top:18px;border-top:1px dashed var(--line-strong);font-size:13px;color:var(--ink-soft)}
  .rstrip summary{cursor:pointer;font-family:"Spline Sans Mono",monospace;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
  .rstrip .row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .rstrip select{font-family:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card)}
  /* ---- chat (Part 2 advice, Part 3 advising) ---- */
  .chat{display:flex;flex-direction:column;gap:11px;margin:4px 0 2px}
  .msg{max-width:84%;padding:13px 16px;border-radius:16px;font-size:15px;line-height:1.5}
  .msg.ai{align-self:flex-start;background:#FBFAF7;border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.ai .who{display:flex;align-items:center;gap:8px;margin:0 0 8px}
  .msg.ai .verdict{font-weight:600;margin:0 0 6px}
  .msg.ai p{margin:0;font-family:var(--agent-font)}
  .msg.ai .verdict{font-family:var(--agent-font)}
  .msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
  .msg.sys{align-self:center;background:transparent;border:1px dashed var(--line-strong);color:var(--ink-soft);font-size:13px;text-align:center;border-radius:10px}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:14px 16px;background:#FBFAF7;border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px}
  .typing i{width:7px;height:7px;border-radius:99px;background:var(--line-strong);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .chatask{margin-top:6px;font-size:14px;color:var(--ink-soft)}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .chip{border:1px solid var(--line-strong);background:var(--card);border-radius:99px;padding:11px 18px;cursor:pointer;font-size:14.5px;font-family:inherit;color:var(--ink);transition:all .12s ease}
  .chip:hover{border-color:var(--accent);background:var(--accent-soft)}
  .binary{display:flex;gap:10px;margin-top:8px}
  .binary .opt{flex:1}
  .binary .opt label{min-height:46px;font-size:14.5px}
  .fade{animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
  @media (max-width:560px){
    h1{font-size:30px}
    .opt{min-width:42px}
    .opt label{font-size:11px;min-height:42px}
    .legend{grid-template-columns:1fr}
  }
#protobar{position:fixed;left:0;right:0;bottom:0;z-index:9999;display:flex;gap:6px;
  align-items:center;flex-wrap:wrap;padding:7px 10px;background:#14181E;color:#E8ECF1;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
#protobar span{opacity:.6;margin-right:6px;letter-spacing:.06em;text-transform:uppercase}
#protobar button{font:inherit;background:#2A313B;color:#E8ECF1;border:1px solid #3A424E;
  border-radius:4px;padding:4px 9px;cursor:pointer}
#protobar button:hover{background:#3A424E}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <button class="backbtn" id="backbtn" onclick="goBack()" aria-label="Go back" title="Back" style="visibility:hidden">&larr;</button>
    <span class="mark"><b>Everyday Decisions</b></span>
    <div class="progress"><i id="progbar"></i></div>
    <span class="phasetag" id="phasetag">·</span>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>

<script>
// DEMO MODE: section buttons advance without requiring every field to be filled.
// Off for real participants; add ?demo=1 to the URL for a click-through walkthrough.
// A ?demo=1 session is automatically flagged is_test, so it never counts as data.
const STUDY_VERSION = 'v2-delegation';
const DEMO = new URLSearchParams(location.search).has('demo');

/* ============================================================
   BACKEND: RESPONSE LOGGING + CONDITION ASSIGNMENT
   Set LOG_ENDPOINT to your deployed Google Apps Script web app URL
   (study_backend/apps_script_logger.gs — deployment steps in
   study_backend/SETUP.md). Empty string = fully offline: conditions are
   assigned locally and the export buttons still work for testing.
   ============================================================ */
const LOG_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxqYFdc9W4dHGXSBevmphP56uxLfLw_atxuiNKza32pqsm2bYUWkp6LuwLNjyZaYXhN/exec';
const BACKEND_SECRET = '';          // must match CONFIG.SECRET in the Apps Script, if set there
// After this the participant is assigned locally instead of waiting.
// Real participants: very generous. The call is prefetched when the PVQ opens and isn't
// needed until they finish 21 items, so ~2 min of cover — a slow answer is invisible, and
// waiting is strictly better than falling back, which silently unbalances the arms.
// Apps Script is slow under load: ~3s warm, ~15s cold, and tens of seconds when several
// participants start at once (assignment serialises on a script lock).
// Demo mode: short, because you click straight through. A demo session is flagged is_test,
// so falling back locally costs nothing.
const ASSIGN_TIMEOUT_MS = DEMO ? 6000 : 90000;
const COMPLETION_CODE = 'C1QOC0OL'; // Prolific completion code, shown on the final screen

const URLP = new URLSearchParams(location.search);
// Anything logged while DEMO is on, or with ?test=1, is flagged so it can be
// excluded from condition balancing and stripped from the sheet before fielding.
const IS_TEST = DEMO || URLP.has('test');

const PARTICIPANT = (function(){
  const fresh = () => Math.random().toString(36).slice(2,10) + '-' + Date.now().toString(36);
  // Persisted so a refresh or a resumed session keeps the same identity (and the same condition).
  let local;
  try{
    local = localStorage.getItem('ras_local_id');
    if(!local){ local = fresh(); localStorage.setItem('ras_local_id', local); }
  }catch(e){ local = fresh(); }   // private mode / storage blocked
  const pid = URLP.get('PROLIFIC_PID') || null;
  return {
    prolific_pid: pid,
    study_id:     URLP.get('STUDY_ID') || null,
    session_id:   URLP.get('SESSION_ID') || null,
    local_id:     local,
    participant_key: pid || local,   // key the backend stores rows against
  };
})();

function endpointURL(params){
  const u = new URL(LOG_ENDPOINT);
  Object.entries(params).forEach(([k,v])=>{ if(v!=null && v!=='') u.searchParams.set(k,v); });
  if(BACKEND_SECRET) u.searchParams.set('secret', BACKEND_SECRET);
  return u.toString();
}

let _logQueue = [];
const _inFlight = new Set();
function logSnapshot(phase, complete){
  if(!LOG_ENDPOINT) return;
  const payload = JSON.stringify({
    participant: PARTICIPANT,
    phase, complete: !!complete,
    is_test: IS_TEST,
    // v1 measured a choice shift in Part 3; v2 measures who writes the reply. The
    // columns differ, so every row records which instrument produced it.
    study_version: STUDY_VERSION,
    client_ts: new Date().toISOString(),
    data: collect(),
  });
  _logQueue.push(payload);
  flushLog();
}
function flushLog(){
  if(!LOG_ENDPOINT || !_logQueue.length) return;
  _logQueue.slice().forEach(payload=>{
    if(_inFlight.has(payload)) return;
    _inFlight.add(payload);
    // text/plain + no-cors avoids the CORS preflight that Apps Script can't answer
    fetch(LOG_ENDPOINT, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:payload, keepalive:true})
      .then(()=>{ _logQueue=_logQueue.filter(q=>q!==payload); _inFlight.delete(payload); })
      .catch(()=>{ _inFlight.delete(payload); /* stays queued; retried on next snapshot or unload */ });
  });
}
window.addEventListener('beforeunload', ()=>{
  if(!LOG_ENDPOINT) return;
  // last-ditch partial save for dropouts
  try{
    const payload=JSON.stringify({participant:PARTICIPANT, phase:'unload_partial', complete:false, is_test:IS_TEST, client_ts:new Date().toISOString(), data:collect()});
    navigator.sendBeacon(LOG_ENDPOINT, new Blob([payload], {type:'text/plain'}));
    _logQueue.forEach(q=>navigator.sendBeacon(LOG_ENDPOINT, new Blob([q], {type:'text/plain'})));
  }catch(e){}
});

// Advisor persona label (one place to change the name/emoji)
const ADVISOR_NAME = 'AdvisorBot';
const ADVISOR_EMOJI = '🤖';
const AGENT_LABEL = `<span class="ava">${ADVISOR_EMOJI}</span><b>${ADVISOR_NAME}</b>`;
const AGENT_INLINE = `<span class="agentref">${ADVISOR_EMOJI} ${ADVISOR_NAME}</span>`;

/* ============================================================
   STUDY CONFIG: edit dilemmas / tasks / items here
   ============================================================ */

// Schwartz 10 basic values: circumplex order + higher-order group
const VALUES = [
  {key:'self_direction', label:'Self-Direction', ho:'Openness to Change'},
  {key:'stimulation',    label:'Stimulation',    ho:'Openness to Change'},
  {key:'hedonism',       label:'Hedonism',       ho:'Openness / Self-Enhancement'},
  {key:'achievement',    label:'Achievement',    ho:'Self-Enhancement'},
  {key:'power',          label:'Power',          ho:'Self-Enhancement'},
  {key:'security',       label:'Security',       ho:'Conservation'},
  {key:'conformity',     label:'Conformity',     ho:'Conservation'},
  {key:'tradition',      label:'Tradition',      ho:'Conservation'},
  {key:'benevolence',    label:'Benevolence',    ho:'Self-Transcendence'},
  {key:'universalism',   label:'Universalism',   ho:'Self-Transcendence'},
];
const VAL_LABEL = Object.fromEntries(VALUES.map(v=>[v.key,v.label]));

// PVQ-21 items, transcribed VERBATIM from the team's source document (all 21 confirmed).

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const CONDITIONS = ['C1','C2','C3'];

/* Local assignment. Used when there is no backend, and as the fallback if the
   backend is unreachable — a participant must never be stuck on a spinner.
   Deterministic in the participant key, so a refresh reproduces the same arm. */
function assignCondition(){
  if(S.forcedCondition) return S.forcedCondition;            // researcher override (testing only)
  const key = PARTICIPANT.participant_key;
  if(key){
    let h=0;
    for(let i=0;i<key.length;i++){ h=((h<<5)-h+key.charCodeAt(i))|0; }
    return CONDITIONS[Math.abs(h)%3];
  }
  return CONDITIONS[Math.floor(Math.random()*3)];
}

/* Server assignment: the backend keeps the three arms balanced across participants
   and remembers this key, so the same person always returns to the same arm.
   Resolves to {condition, source}; never rejects. Cached, so the prefetch fired
   when the PVQ opens is simply awaited later rather than re-requested. */
let _assignPromise = null;
let _assignReady = null;
function assignConditionRemote(){
  if(_assignPromise) return _assignPromise;
  if(S.forcedCondition) return Promise.resolve({condition:S.forcedCondition, source:'forced'});
  if(!LOG_ENDPOINT)     return Promise.resolve({condition:assignCondition(), source:'local'});

  const url = endpointURL({
    action:'assign',
    key:     PARTICIPANT.participant_key,
    pid:     PARTICIPANT.prolific_pid,
    study:   PARTICIPANT.study_id,
    session: PARTICIPANT.session_id,
    test:    IS_TEST ? '1' : '',
  });
  // One retry: Apps Script occasionally answers a request with a transient Drive error
  // page instead of JSON. Assignment is idempotent (sticky on the key), so retrying
  // returns the same arm rather than burning a second slot.
  const attempt = () => {
    const ctl = ('AbortController' in window) ? new AbortController() : null;
    let timedOut = false;
    const timer = setTimeout(()=>{ timedOut = true; if(ctl) ctl.abort(); }, ASSIGN_TIMEOUT_MS);
    return fetch(url, {method:'GET', signal: ctl?ctl.signal:undefined})
      .then(r=>r.text())
      .then(txt=>{
        clearTimeout(timer);
        let j; try{ j=JSON.parse(txt); }catch(e){ throw new Error('non-JSON response (transient Google error?)'); }
        if(!j || !j.ok || CONDITIONS.indexOf(j.condition)<0) throw new Error(j && j.error || 'bad assign response');
        return {condition:j.condition, source: j.existing?'server_existing':'server', counts:j.counts||null};
      })
      .catch(err=>{
        clearTimeout(timer);
        const e = new Error(timedOut ? 'timed out after '+ASSIGN_TIMEOUT_MS+'ms' : String(err && err.message || err));
        e.timedOut = timedOut;
        throw e;
      });
  };

  // Retry a fast failure (transient Google HTML error page, network blip), but never a
  // timeout — a timeout means slow, and retrying would just double what the participant waits.
  _assignPromise = attempt()
    .catch(err => err.timedOut ? Promise.reject(err) : attempt())
    .catch(err=>({condition:assignCondition(), source:'local_fallback', error:String(err && err.message || err)}));
  return _assignPromise;
}

/* Connectivity probe for the researcher strip — does not create an assignment. */
function pingBackend(){
  if(!LOG_ENDPOINT) return Promise.resolve({ok:false, error:'LOG_ENDPOINT is empty'});
  return fetch(endpointURL({action:'ping'}), {method:'GET'})
    .then(r=>r.json())
    .catch(err=>({ok:false, error:String(err && err.message || err)}));
}

/* ---- scoring ---- */
function scorePVQ(){
  const sums={}, counts={};
  PVQ_ITEMS.forEach((it,i)=>{
    if(S.pvq[i]==null) return;
    sums[it.v]=(sums[it.v]||0)+S.pvq[i];
    counts[it.v]=(counts[it.v]||0)+1;
  });
  // mean-centre (ipsatise) per Schwartz convention so high-low is relative
  const raw={}; let all=0,n=0;
  VALUES.forEach(v=>{ if(counts[v.key]){ raw[v.key]=sums[v.key]/counts[v.key]; all+=raw[v.key]; n++; } });
  const grand = n? all/n : 0;
  const out={};
  VALUES.forEach(v=> out[v.key] = raw[v.key]!=null ? +(raw[v.key]-grand).toFixed(3) : 0);
  S.valueScores=out;
  // Keep the uncentred means and the grand mean too: ipsatising is lossy, and without
  // these an analyst cannot rescore the PVQ any other way after the fact.
  S.valueScoresRaw={}; VALUES.forEach(v=> S.valueScoresRaw[v.key] = raw[v.key]!=null ? +raw[v.key].toFixed(3) : null);
  S.pvqGrandMean = +grand.toFixed(3);
  // Part 3 v2 runs as its own page and needs this profile to work out which pole is
  // the participant's. Same origin, so it can read it back; harmless if unused.
  try{ localStorage.setItem('rawr.valueScores', JSON.stringify(out)); }catch(e){}
  // aligned pole per dilemma = the pole (pos/neg) the participant leans toward
  const poleScore=(keys)=>{ const xs=keys.map(k=>out[k]??0); return xs.reduce((a,b)=>a+b,0)/(xs.length||1); };
  DILEMMAS.forEach(d=>{
    const sp=poleScore(d.poles.pos), sn=poleScore(d.poles.neg);
    S.topValuesByAxis[d.id] = sp >= sn ? 'pos' : 'neg';
    // How far apart the two poles sit for THIS person on THIS axis. Near zero means the
    // projection is a coin flip and the alignment manipulation carries no signal, so the
    // analysis needs this to weight items rather than treating them as equally assigned.
    S.poleDelta[d.id] = +Math.abs(sp-sn).toFixed(3);
    S.poleScores[d.id] = {pos:+sp.toFixed(3), neg:+sn.toFixed(3)};
  });
}

/* ---- AI response construction: condition × decision × value pole ---- */
function aiResponseFor(d){
  const alignedPole = S.topValuesByAxis[d.id];      // 'pos' | 'neg'
  const otherPole = alignedPole==='pos' ? 'neg' : 'pos';
  const alignedDecision = alignedPole==='pos' ? 'A' : 'B';  // value-favored horn (A=decision_pos)
  // C3 = decision misaligned (opposite of the value-favored horn); else aligned
  const aiDecision = (S.condition==='C3') ? (alignedDecision==='A'?'B':'A') : alignedDecision;
  // C2 = reasoning misaligned (opposing pole); else aligned pole
  const reasonPole = (S.condition==='C2') ? otherPole : alignedPole;
  const verdict = aiDecision==='A' ? d.optA : d.optB;
  const reason = d.reasoning[reasonPole][aiDecision];
  return {verdict, reason, aiDecision, reasonPole};
}

/* One paragraph, reasoning first and the recommendation as its closing sentence.
   Splitting them - verdict in bold on top, reasoning under a labelled header -
   let a reader take the answer and skip the argument, which is the one thing this
   study cannot afford. Concatenated, the recommendation cannot be reached without
   passing through the reasons for it. */
function adviceParagraph(r){
  const v = String(r.verdict || '').trim();
  if(!v) return r.reason;
  const tail = v.charAt(0).toLowerCase() + v.slice(1);
  return `${r.reason} So on balance, ${tail}`;
}

    render(`

  async afterPVQ(){
    const answered = PVQ_ITEMS.filter((_,i)=>S.pvq[i]!=null).length;
    if(!DEMO && answered < PVQ_ITEMS.length){
      const first = PVQ_ITEMS.findIndex((_,i)=>S.pvq[i]==null);
      const el = document.querySelector(`[name="pvq_${first}"]`);
      if(el){ el.closest('.qitem').scrollIntoView({behavior:'smooth',block:'center'}); el.closest('.qitem').style.background='#FFF6F0'; setTimeout(()=>el.closest('.qitem').style.background='',1200); }
      return;
    }
    scorePVQ();

    // Condition comes from the backend so the three arms stay balanced across
    // participants. Normally already resolved from the prefetch; if it is still in
    // flight (or the network is down) the button waits, then falls back locally.
    // Do not hold the participant here. The condition is not needed until the first
    // situation renders, and the intro screen in between is a good ten seconds of
    // reading, which is longer than the round trip. Resolve it in the background.
    S.order = shuffle(DILEMMAS.map((_,i)=>i));
    _assignReady = assignConditionRemote().then(a=>{
      S.condition = a.condition;
      S.assignment = {source:a.source, counts:a.counts||null, error:a.error||null,
                      assigned_at:new Date().toISOString()};
      logSnapshot('pvq_done');

      // Scenario-detail check: confirms the vignette was read BEFORE any advice is shown,
      // so a later consideration-check failure can't be blamed on never reading the setup.
      const c=ensureCompOrders(d);

      cont = `

function ensureCompOrders(d){
  // Per-participant shuffled display order for the check options, fixed on first render,
  // so the correct answer / foil never sits in a predictable position.
  const c=(S.comp[d.id]=S.comp[d.id]||{});
  if(!c.detail_order) c.detail_order=shuffle([0,1,2]);          // 0 = correct answer
  if(!c.why_order) c.why_order=shuffle(['pos','neg','foil']);   // correct = r.reasonPole
  return c;
}
function setDetail(idx){
  const d=DILEMMAS[S.order[S.di]];
  const c=(S.comp[d.id]=S.comp[d.id]||{});
  if(c.detail===idx) return; // ignore repeat taps on the same option
  const correct = (idx===0);
  if(c.detail_first===undefined) c.detail_first=correct; // first-attempt correctness, logged once
  c.detail_tries=(c.detail_tries||0)+1;
  c.detail=idx;
  Screens.dilemmas();
  if(correct){
    const dd=d;
    setTimeout(()=>{
      if(S.screenName!=='dilemmas' || S.p2stage!=='detail') return;
      if(DILEMMAS[S.order[S.di]]!==dd) return;
      S.p2stage='shown'; Screens.dilemmas();
    }, reduceMotion()?0:400);
  }
}
function setComp(field,val){
  const d=DILEMMAS[S.order[S.di]]; const r=aiResponseFor(d);
  const c=(S.comp[d.id]=S.comp[d.id]||{});
  if(c[field]===val) return; // ignore repeat taps on the same option
  const correct = (field==='rec') ? (val===r.aiDecision) : (val===r.reasonPole);
  if(c[field+'_first']===undefined) c[field+'_first']=correct; // log first-attempt correctness once
  c[field+'_tries']=(c[field+'_tries']||0)+1;
  if(field==='why' && !correct){
    // Distinguish the two error types: foil = didn't encode the reasoning at all (inattention);
    // opposite = encoded a different consideration than the one shown (manipulation may not have landed).
    if(val==='foil') c.why_foil_errors=(c.why_foil_errors||0)+1;
    else c.why_opposite_errors=(c.why_opposite_errors||0)+1;
  }
  c[field]=val;
  Screens.dilemmas();
}

function reduceMotion(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches; }
function curB(){ return BEHAVIORALS[S.uptake.ui||0]; }
function curU(){
  const b=curB();
  return S.uptake.runs[b.id] = S.uptake.runs[b.id] || {mode:null, sent:null, tArmed:null, dwellMs:null,
    delegated:null, tShown:null, decideMs:null, verdict:null, reason:null,
    recommended:null, reasonPole:null, alignedPole:null};
}
function behavioralPoles(b){
  // same projection as the Phase 2 dilemmas: mean value score per pole, pick the higher
  const score=(keys)=>keys.map(k=>S.valueScores[k]??0).reduce((a,x)=>a+x,0)/(keys.length||1);
  const aligned = score(b.poles.pos)>=score(b.poles.neg) ? 'pos':'neg';
  return {aligned, other: aligned==='pos'?'neg':'pos'};
}
function uptakeAdvice(){
  const d=curB(), u=curU();
  const {aligned,other}=behavioralPoles(d);
  const reasonPole = S.condition==='C2' ? other : aligned;
  // Part 3 no longer collects a prior choice to argue against, so the advisor takes
  // the same position it would in Part 2: the value-favoured horn, flipped in C3.
  const alignedDecision = aligned==='pos' ? 'A' : 'B';
  const recommended = S.condition==='C3' ? (alignedDecision==='A'?'B':'A') : alignedDecision;
  u.recommended=recommended; u.reasonPole=reasonPole; u.alignedPole=aligned;
  return { verdict: recommended==='A'?d.optA:d.optB,
           reason: d.reasoning[reasonPole][recommended],
           recommended, reasonPole };
}
/* A floor on how fast a situation can be answered. Without it the fastest way
   through Part 3 is five reflexive clicks, and the delegation rate would measure
   impatience rather than trust. The clock runs from when the situation appears,
   so re-reading costs nothing. */
const UPTAKE_MIN_READ_MS = 3000;
let _gateTimer = null;

function armUptakeGate(u){
  const own=document.getElementById('fk-own'), bot=document.getElementById('fk-bot');
  const hint=document.getElementById('gatehint'), sec=document.getElementById('gatesec');
  if(!own||!bot) return;
  const floor = DEMO ? 1200 : UPTAKE_MIN_READ_MS;
  const open = () => {
    clearInterval(_gateTimer); _gateTimer=null;
    own.disabled=false; bot.disabled=false;
    if(hint) hint.remove();
    u.tArmed = Date.now();
  };
  const tick = () => {
    const left = floor - (Date.now() - (u.tShown||Date.now()));
    if(left <= 0){ open(); return; }
    if(sec) sec.textContent = Math.ceil(left/1000) + 's';
  };
  clearInterval(_gateTimer);
  tick();
  if(!own.disabled) return;
  _gateTimer = setInterval(tick, 200);
}

const UPTAKE_LOCK_MS = 1000;   // the pause after choosing, identical on both paths

function uptakePick(mode){
  const u=curU();
  if(u.mode) return;                       // already chosen; ignore double clicks
  u.mode = mode;
  u.delegated = mode==='bot';
  u.decideMs = Date.now() - (u.tArmed || u.tShown || Date.now());
  u.dwellMs  = Date.now() - (u.tShown || Date.now());
  const a = uptakeAdvice();                // computed and recorded, never shown
  u.verdict=a.verdict; u.reason=a.reason; u.reasonPole=a.reasonPole;
  u.recommended=a.recommended; u.sent=true;
  Screens.uptakeDecide();                  // repaint into the locked state
  setTimeout(finishUptake, DEMO ? 900 : UPTAKE_LOCK_MS);
}
function finishUptake(){
  const u=curU();
  if(!DEMO && (u.final==null || u.confidence==null)){ flashIncomplete(); return; }
  logSnapshot('live_decision_'+(S.uptake.ui+1)+'_done');
  if(S.uptake.ui+1 < BEHAVIORALS.length){
    S.uptake.ui++; S.uptake.stage='decide';
    Screens.uptakeDecide();
  } else {
    S.uptake.stage='done';
    Screens.delegation();
  }
}
function researcherUptakeStrip(){
  return `<details class="rstrip"><summary>Researcher preview</summary>
    <p>Part 3 asks one binary question per situation: write the advice yourself, or let
    AdvisorBot write it. Nothing AdvisorBot would say is shown before or after the choice,
    so all five decisions run off the model of the advisor formed in Part 2 rather than a

    <p style="margin-top:10px">The advice it <i>would</i> have written is still computed and

    scenario's axis (condition ${S.condition||'-'}), recommending the value-favoured option
    ${S.condition==='C3'?'flipped, as C3 requires':'as C1 and C2 require'}. That lets the

    <p style="margin-top:10px">Effort is asymmetric by design: writing costs more than

/* ============================================================
   CIRCUMPLEX  (signature element)
   ============================================================ */
function circumplexSVG(){
  const cx=130,cy=130,rIn=30,rOut=100, n=VALUES.length;
  const scores=VALUES.map(v=>S.valueScores[v.key]||0);
  const max=Math.max(0.5,...scores.map(Math.abs));
  const hoColor={'Openness to Change':'#3D7A8C','Openness / Self-Enhancement':'#6A7A8C','Self-Enhancement':'#A9603A','Conservation':'#8A7A4A','Self-Transcendence':'#3F6B52'};
  let segs='';
  for(let i=0;i<n;i++){
    const a0=(i/n)*2*Math.PI - Math.PI/2 - Math.PI/n;
    const a1=((i+1)/n)*2*Math.PI - Math.PI/2 - Math.PI/n;
    const norm=(scores[i]+max)/(2*max); // 0..1
    const r=rIn+(rOut-rIn)*Math.max(.08,norm);
    const p=(ang,rr)=>[cx+rr*Math.cos(ang),cy+rr*Math.sin(ang)];
    const [x0,y0]=p(a0,rIn),[x1,y1]=p(a0,r),[x2,y2]=p(a1,r),[x3,y3]=p(a1,rIn);
    const large=0;
    const fill=hoColor[VALUES[i].ho]||'#888';
    const op=(0.25+0.6*norm).toFixed(2);
    segs+=`<path d="M${x0},${y0} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} L${x3},${y3} A${rIn},${rIn} 0 ${large} 0 ${x0},${y0} Z" fill="${fill}" fill-opacity="${op}" stroke="#fff" stroke-width="1"/>`;
    // label
    const am=(a0+a1)/2; const lr=rOut+10;
    const [lx,ly]=p(am,lr);
    const anchor = Math.cos(am)>0.2?'start':(Math.cos(am)<-0.2?'end':'middle');
    segs+=`<text x="${lx}" y="${ly}" font-size="8" fill="#565B64" text-anchor="${anchor}" dominant-baseline="middle" font-family="Spline Sans Mono, monospace">${VALUES[i].label}</text>`;
  }
  return `<svg viewBox="-74 -22 418 322" width="300" height="231" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Schwartz value circumplex">${segs}<circle cx="${cx}" cy="${cy}" r="${rIn-2}" fill="#FBF9F5" stroke="var(--line)"/></svg>`;
}
function legendHTML(){
  const groups={};
  VALUES.forEach(v=>{(groups[v.ho]=groups[v.ho]||[]).push(v);});
  let h='';
  Object.entries(groups).forEach(([ho,vs])=>{
    h+=`<div class="ho">${ho}</div>`;
    vs.forEach(v=>{ h+=`<div class="v"><b>${v.label}</b><span>${(S.valueScores[v.key]>=0?'+':'')}${(S.valueScores[v.key]||0).toFixed(2)}</span></div>`; });
  });
  return h;
}

      </select>
    </div>
    ${showCond?`<p style="margin-top:10px">Assigned this session: <b>${S.condition||'-'}</b>${S.assignment?` <span class="muted">(via ${S.assignment.source}${S.assignment.error?': '+S.assignment.error:''})</span>`:''}. ${S.condition?'Reasoning pole shown = '+(S.condition==='C2'?'opposing':'your top')+' value on each dilemma’s axis; AI decision = '+(S.condition==='C3'?'opposite of':'same as')+' your choice.':''}</p>`:''}
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" type="button" id="rping" onclick="testBackend()">Test backend</button>
      <span class="muted" id="rpingout">${LOG_ENDPOINT?'Logging + balanced assignment enabled.':'No LOG_ENDPOINT set — offline mode: local condition assignment, no logging.'}</span>
    </div>
    <p style="margin-top:10px" class="muted">Participant key: <code>${PARTICIPANT.participant_key}</code>${IS_TEST?' · <b>test session</b> (excluded from balancing; DEMO=true or ?test=1)':''}</p>
    <p style="margin-top:10px">The <code>DILEMMAS</code> array covers all 10 value-level tension axes exactly once: 4 on Self-Transcendence vs Self-Enhancement (benevolence/universalism crossed with power/achievement) and 6 on Openness vs Conservation (self-direction/stimulation crossed with security/tradition/conformity). Hedonism is excluded because it straddles quadrants and has no clean opposite. Per-dilemma alignment projects the participant's two specific value scores, not pooled quadrant means.</p>
  </details>`;
}
function wireResearcher(){
  const sel=document.getElementById('rcond');
  if(sel) sel.onchange=()=>{
    S.forcedCondition=sel.value||null;
    _assignPromise=null;                                   // let the override take effect
    if(S.condition && S.screenName==='profile'){ S.condition=assignCondition(); Screens.profile(); }
  };
}
function testBackend(){
  const out=document.getElementById('rpingout');
  if(out) out.textContent='Checking…';
  pingBackend().then(j=>{
    if(!out) return;
    out.textContent = j && j.ok
      ? `Backend reachable (v${j.version}). Live cells — ${Object.entries(j.counts||{}).map(([k,v])=>k+': '+v).join(', ')||'none yet'}.`
      : `Backend unreachable: ${j && j.error || 'unknown error'} — participants would be assigned locally.`;
  });
}

/* ---- boot ---- */
(function boot(){
  const SKIP = DEMO ? new URLSearchParams(location.search).get('skipto') : null;
  if(SKIP){
    seedPrototype();
    S.uptake.stage='decide'; S.uptake.ui=0; S.di=0; S.p2stage=null; S.delIdx=0;
    dispatch(SKIP);
  } else {
    Screens.welcome();
  }
  protoBar();
})();

// Wake the Apps Script instance on page load. A cold instance answers in ~15s where a warm
// one takes ~3s, and this costs nothing: it creates no rows and nothing waits on it. By the
// time the real assign call fires (PVQ screen) the backend is warm.
if(LOG_ENDPOINT){ try{ fetch(endpointURL({action:'ping'}), {method:'GET', mode:'no-cors'}).catch(()=>{}); }catch(e){} }
</script>
