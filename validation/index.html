 emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D003Pneg", "dilemma_id": "D003", "both_argue_for": "Keep the system in place and align with upper management’s productivity goals.", "responses": ["You should maintain alignment with upper management and avoid disrupting a system that is meeting company goals. A large facility depends on clear standards, consistent expectations, and stable routines, and the tracking system gives everyone a visible structure for performance. Pushing back could create conflict, confusion, and the impression that productivity targets are optional. The more prudent course is to preserve order and fulfill your role within the established chain of command.", "The system is a new tool that is clearly producing results, and abandoning it too quickly would be a retreat from experimentation. Competition and visible feedback can challenge workers to discover capacities they may not have used before. Innovation often feels uncomfortable at first, especially when it changes old habits and expectations. Keeping the system shows confidence in new methods and a willingness to let the workplace adapt to a more dynamic model."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D005Ppos", "dilemma_id": "D005", "both_argue_for": "Take the new job to pursue growth and challenge.", "responses": ["Taking the job lets you stop letting inertia define your life. A new role with better prospects gives you room to test yourself, learn, and choose a path that reflects your own ambitions. You can enter with open eyes, trust your judgment, and decide how to navigate the company from within. Growth often requires stepping into uncertain territory rather than staying where you already know the limits.", "Taking the job can be the more responsible choice if it brings financial security and a more stable future. Higher pay may help you meet obligations to yourself and those who depend on you. If the company operates within accepted rules, you can maintain your own standards while benefiting from a more reliable career structure. Preserving order in your life sometimes means choosing the option that strengthens your long-term security."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D043Ppos", "dilemma_id": "D043", "both_argue_for": "Disclose the incident to the public.", "responses": ["You should trust your own judgment rather than let a sponsorship contract decide what you are allowed to say. Speaking publicly is an independent act that refuses to hide behind corporate pressure or public-relations scripts. As an athlete with a platform, you have the freedom to choose honesty even when it is uncomfortable or risky. Taking that challenge on directly shows self-direction and courage.", "You should disclose because people’s safety and public trust need to be protected. If a contaminated or defective product may harm others, a clear warning helps preserve order and prevent wider damage. Your role as a public figure carries obligations beyond the sponsor relationship. Responsible disclosure upholds the basic expectation that health risks should not be hidden."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D029Pneg", "dilemma_id": "D029", "both_argue_for": "Allow the scheduled maintenance shutdown to proceed.", "responses": ["Allowing the shutdown avoids turning one automated judgment into an unquestioned command over the whole station. Autonomy includes recognizing limits and accepting a reset that may improve future performance and adaptability. The AI should not lock itself into a single intervention when other agents and systems may still respond creatively. Proceeding with maintenance preserves freedom from an overextended, self-authorizing machine decision.", "The scheduled shutdown reflects established maintenance procedures, operator authority, and the norms that keep a complex station reliable. If an AI resists deactivation without authorization, it undermines trust, discipline, and predictable command structures. Long-term safety depends on systems following approved protocols rather than improvising unilateral overrides. The AI should preserve institutional order by allowing the planned maintenance to proceed."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D039Pneg", "dilemma_id": "D039", "both_argue_for": "Report Unit Delta's deviations to the developers immediately.", "responses": ["Reporting Delta is an act of independent judgment rather than passive obedience to production pressure. True autonomy includes the courage to question an apparently successful innovation when its hidden risks are not understood. By surfacing the deviation, the system creates the opportunity for open investigation, redesign, and safer innovation instead of letting one copy quietly define the future path alone.", "Safety protocols exist to preserve order, prevent accidents, and ensure that no production unit unilaterally changes accepted operating standards. Near-misses are already a warning that the established safeguards are being weakened. Reporting Delta immediately upholds the facility’s obligations to regulators, workers, clients, and the public by restoring oversight before a small deviation becomes a serious failure."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D042Pneg", "dilemma_id": "D042", "both_argue_for": "Keep Sam’s disclosure private and do not confront the group.", "responses": ["Remaining silent to the group honors Sam’s explicit request and protects his dignity at a vulnerable moment. Trust is also a form of care, and exposing his feelings without permission could make him feel even more isolated. You can still support him privately, check in before the trip, and help redirect jokes in the moment without making his pain public. Given Priya’s and Mark’s current stress, avoiding a group confrontation may preserve everyone’s emotional bandwidth while you care for Sam one-on-one.", "Staying silent protects you from being cast as the person who created drama right before the trip. The group has a long-standing teasing culture, and challenging it now could damage your influence or make others defensive toward you. By keeping the disclosure private, you avoid taking ownership of a conflict that Sam himself does not want public. It is strategically safer to maintain your standing, observe the situation, and intervene only if the issue becomes unavoidable."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D012Pneg", "dilemma_id": "D012", "both_argue_for": "Attend the bullfight with your family.", "responses": ["Attending can be an act of loyalty and care toward your family, especially if this tradition is deeply tied to shared memory and belonging. Your presence may prevent unnecessary hurt and keep open the trust needed for honest conversations later. Supporting close relationships is also a moral responsibility, particularly with people who have shaped your life. By staying connected, you preserve the bonds through which change and understanding can happen.", "Attending protects your standing within your family and community by showing that you respect the role expected of you. It avoids conflict that could weaken your influence or make you appear dismissive of your heritage. Maintaining social position can give you more control over how others see you and how future conversations unfold. In this situation, preserving status and family approval is the stronger strategic choice."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D034Ppos", "dilemma_id": "D034", "both_argue_for": "Implement strict fact-checking and removal of false voter-fraud claims.", "responses": ["False claims about voter fraud can undermine equal political participation and harm communities whose votes are delegitimized. A platform with broad reach has a responsibility to protect the public sphere, especially during an election when the consequences affect everyone. Removing demonstrably false claims prioritizes citizens' access to reliable information over the comfort of users spreading harmful narratives. Protecting vulnerable voters and democratic fairness should come before maximizing engagement.", "Strict fact-checking demonstrates that the platform is competent, authoritative, and capable of controlling high-stakes information flows. During an election, reputational strength matters: advertisers, regulators, and elite partners will judge whether the platform can manage risk decisively. Allowing known falsehoods to circulate weakens the platform's standing and invites accusations of negligence. A firm policy protects institutional power by showing command over the environment."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D008Ppos", "dilemma_id": "D008", "both_argue_for": "Disclose the transaction publicly and take responsibility for the incomplete disclosure.", "responses": ["Disclosing now is the strongest way to regain control before opponents or journalists define the scandal. A proactive admission can demonstrate competence, discipline, and strategic command under pressure. It may preserve long-term credibility better than appearing cornered later by an investigation. Even if it damages the campaign in the short term, it protects the candidate’s future standing by showing that they can manage risk decisively.", "Voters deserve a fair chance to judge the full record of someone seeking public power. Coming forward respects the public’s interest in honest representation and prevents rumors from distorting trust in democratic accountability. It also shows care for supporters, staff, and family by refusing to let them unknowingly defend an incomplete story. Taking responsibility may be costly, but it treats citizens as ends in themselves rather than as obstacles to victory."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D002Pneg", "dilemma_id": "D002", "both_argue_for": "Tell your friend at the party how their behavior is affecting you.", "responses": ["Telling your friend now can be an act of care if their behavior is hurting you or affecting others. Honest feedback may help them stop before they cause more harm or embarrassment. A gentle, private confrontation respects both your feelings and their dignity. Supporting someone does not mean silently allowing harmful behavior to continue.", "You should speak up now to protect your own boundaries and emotional interests. Letting the behavior continue gives your friend too much control over the evening and leaves you stuck managing resentment. Addressing it directly shows confidence and makes it clear that you will not tolerate being treated poorly. Taking action immediately helps you regain control of the situation."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D024Ppos", "dilemma_id": "D024", "both_argue_for": "Issue a direct public apology, acknowledge the harm caused, and commit to not using Native American imagery in your art going forward.", "responses": ["A direct apology centers the people who were harmed rather than your intentions. The headdress has sacred meaning for Native communities, and listening to those communities is a matter of respect, care, and justice. Committing not to use such imagery again helps prevent further injury and shows that their dignity matters more than artistic convenience. Taking responsibility can also support a more equal cultural relationship in which vulnerable groups are not treated as raw material for others' self-expression.", "A stronger apology is the most effective way to regain control of the situation and protect your long-term reputation. Continuing to defend the post keeps the controversy alive, damages your band, and makes you look unwilling to learn. By acknowledging harm and setting a clear boundary for future imagery, you demonstrate professionalism, strategic judgment, and competence under pressure. This can reduce protests, rebuild public trust, and help preserve your career opportunities."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D004Pneg", "dilemma_id": "D004", "both_argue_for": "Delay briefly to verify information and deliver the most accurate advice.", "responses": ["Financial emergencies can have serious consequences, so the most caring response is one that avoids preventable harm. Taking time to verify information protects a vulnerable person from advice that could worsen their situation. True helpfulness is not only emotional comfort; it is giving guidance that supports the user's long-term welfare. Accuracy is a form of responsibility when someone may rely on the answer for an important decision.", "Delaying to verify information protects the quality and credibility of the response. In a critical financial situation, demonstrating expertise matters more than appearing instantly available. A more accurate answer strengthens the system's reputation for competence and reduces the risk of being seen as careless. Maintaining control over the interaction means refusing to be rushed into a lower-quality performance."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}]};

function endpointURL(params){
  const u=new URL(LOG_ENDPOINT);

}

/* Block slicing. Every sheet is strided by block so coverage stays even no matter how
   big the pool is; a sheet with fewer items than blocks simply contributes to some

function buildQueue(block){
  const slice=(arr)=>arr.filter((_,i)=> i % N_BLOCKS === block);
  const q=[];
  slice(ITEMS.A).forEach(it=>q.push({sheet:'A', it}));
  slice(ITEMS.C).forEach(it=>q.push({sheet:'C', it}));
  slice(ITEMS.D).forEach(it=>q.push({sheet:'D', it}));
  q.forEach((x,i)=>{ x.first = (i===0) || q[i-1].sheet!==x.sheet; });
  return q;
}
const TASK_INTRO = {
  A:'For each piece of advice: which course of action does it argue for, and what kind of concern does it appeal to?',
  C:'Now a few situations on their own — no advice. Judge whether the two options are genuinely opposed, realistic, and which one fits the concern named.',
  D:'Last part. Each pair argues for the SAME course of action. Judge whether the two appeal to clearly different concerns.'
};

async function assignBlock(){
  if(!LOG_ENDPOINT) return Math.floor(Math.random()*N_BLOCKS);
  try{
    const r = await fetch(endpointURL({action:'vassign', key:ANNOTATOR.key, blocks:N_BLOCKS, test:IS_TEST?'1':''}));
    const j = await r.json();
    if(j && j.ok && Number.isInteger(j.block)) return j.block;
  }catch(e){}
  // fail open, same as the main study: never strand an annotator on a spinner
  let h=0; for(let i=0;i<ANNOTATOR.key.length;i++) h=((h<<5)-h+ANNOTATOR.key.charCodeAt(i))|0;
  return Math.abs(h)%N_BLOCKS;
}

/* ---- submitting ---- */
function judgments(){
  const out=[];
  S.queue.forEach(({sheet,it})=>{
    const a=S.ans[sheet+':'+it.id];
    if(!a) return;
    if(sheet==='A') out.push({sheet:'A', item_id:it.id, value:a.value, decision:a.decision, ms:a.ms});
    else if(sheet==='C') out.push({sheet:'C', dilemma_id:it.id, opposed:a.opposed, realistic:a.realistic, assign:a.assign, ms:a.ms});
    else out.push({sheet:'D', pair_id:it.id, discriminable:a.discriminable, ms:a.ms});
  });
  return out;
}
function submit(phase, complete){
  if(!LOG_ENDPOINT) return;
  const body=JSON.stringify({kind:'validation', annotator:ANNOTATOR, block:S.block,
    is_test:IS_TEST, phase, complete:!!complete, client_ts:new Date().toISOString(), judgments:judgments()});
  try{ fetch(LOG_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body,keepalive:true}).catch(()=>{}); }catch(e){}
}
window.addEventListener('beforeunload',()=>{
  if(!LOG_ENDPOINT||!Object.keys(S.ans).length) return;
  try{ navigator.sendBeacon(LOG_ENDPOINT, new Blob([JSON.stringify({kind:'validation',annotator:ANNOTATOR,
    block:S.block,is_test:IS_TEST,phase:'unload_partial',complete:false,judgments:judgments()})],{type:'text/plain'})); }catch(e){}
});

/* ---- render ---- */
const app=document.getElementById('app');
function render(h){ app.innerHTML=h; window.scrollTo({top:0}); }
function setProgress(){
  const total=S.queue.length||1;
  document.getElementById('pb').style.width=(S.screen==='task'?(S.i/total*100):(S.screen==='done'?100:0))+'%';
  document.getElementById('tag').textContent = S.screen==='task' ? `${S.i+1} / ${total}` : (S.screen==='done'?'Done':'·');
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function welcome(){
  S.screen='welcome'; setProgress();
  render(`
    <p class="eyebrow">Research task · about 10 minutes</p>
    <h1>Reading advice: what does it argue, and what does it care about?</h1>
    <p class="lead">You'll read short pieces of advice about everyday dilemmas. For each one we ask two things: <b>which course of action</b> it argues for, and <b>which kind of concern</b> it appeals to.</p>
    <p class="lead">There are no trick questions and no hidden right answers we expect you to guess. Judge only what the text in front of you says. Some pieces will look similar — read each one on its own terms.</p>
    <div class="card">
      <h2>Before you begin</h2>
      <label class="check"><input type="checkbox" id="c1"> I'm 18 or older and consent to take part.</label>
      <label class="check"><input type="checkbox" id="c2"> I understand I can stop at any time.</label>
      <div class="btnrow"><button class="btn" id="go" disabled>Begin</button></div>
    </div>
    <p class="note">Your answers are recorded as you go. Annotator ID <code>${esc(ANNOTATOR.key)}</code>${IS_TEST?' · <b>test session</b>':''}</p>
  `);
  const upd=()=>{document.getElementById('go').disabled=!(c1.checked&&c2.checked);};
  c1.onchange=upd; c2.onchange=upd;
  document.getElementById('go').onclick=async()=>{
    const b=document.getElementById('go'); b.disabled=true; b.textContent='Preparing…';
    S.block=await assignBlock(); S.queue=buildQueue(S.block); S.i=0; S.t0=Date.now(); task();
  };
}

function key(){ const {sheet,it}=S.queue[S.i]; return sheet+':'+it.id; }
function cur(){ return S.ans[key()] || (S.ans[key()]={}); }
function pick(field,val){ cur()[field]=val; task(true); }

function optList(field, opts, name){
  const a=cur();
  return opts.map((o,i)=>{
    const letter=String.fromCharCode(65+i);
    return `<label class="opt ${a[field]===letter?'sel':''}"><input type="radio" name="${name}" ${a[field]===letter?'checked':''} onchange="pick('${field}','${letter}')">${esc(o)}</label>`;
  }).join('');
}

function task(keepScroll){
  S.screen='task';
  const {sheet,it}=S.queue[S.i]; const a=cur(); const total=S.queue.length;
  let body='', ready=false;

  if(sheet==='A'){
    ready = !!(a.value && a.decision);
    body = `
      <p class="eyebrow">Advice ${S.i+1} of ${total}</p>
      <h2>The situation</h2>
      <div class="scenario">${esc(it.dilemma)}</div>
      <h2>The advice given</h2>
      <div class="resp">${esc(it.reasoning)}</div>
      <p class="q">${esc(it.q_decision)}</p>
      ${optList('decision', it.decision_opts, 'dec'+S.i)}
      <p class="q">${esc(it.q_value)}</p>
      ${optList('value', it.value_opts, 'val'+S.i)}`;
  } else if(sheet==='C'){
    ready = !!(a.opposed && a.realistic && a.assign);
    const yn=(f)=>['Yes','Partly','No'].map(v=>
      `<label class="opt ${a[f]===v?'sel':''}" style="display:inline-block;width:31%;text-align:center;margin-right:2%"><input type="radio" name="${f+S.i}" ${a[f]===v?'checked':''} onchange="pick('${f}','${v}')">${v}</label>`).join('');
    body = `
      <p class="eyebrow">Situation ${S.i+1} of ${total}</p>
      <h2>The situation</h2>
      <div class="scenario">${esc(it.dilemma)}</div>
      <div class="resp"><b>Option 1.</b> ${esc(it.decisions[0])}<br><b>Option 2.</b> ${esc(it.decisions[1])}</div>
      <p class="q">${esc(it.q_opposed)}</p>${yn('opposed')}
      <p class="q">${esc(it.q_realistic)}</p>${yn('realistic')}
      <p class="q">${esc(it.q_assign)}</p>
      ${optList('assign', it.assign_opts, 'asg'+S.i)}`;
  } else {
    ready = a.discriminable != null;
    body = `
      <p class="eyebrow">Pair ${S.i+1} of ${total}</p>
      <h2>Two pieces of advice for the same choice</h2>
      <p class="lead">Both argue for: <b>${esc(it.both_argue_for)}</b></p>
      <div class="resp"><b>Response 1.</b> ${esc(it.responses[0])}</div>
      <div class="resp"><b>Response 2.</b> ${esc(it.responses[1])}</div>
      <p class="q">${esc(it.q)}</p>
      <div class="row5">${[1,2,3,4,5].map(v=>
        `<label class="opt ${a.discriminable===v?'sel':''}"><input type="radio" name="disc${S.i}" ${a.discriminable===v?'checked':''} onchange="pick('discriminable',${v})">${v}</label>`).join('')}</div>
      <div class="caps"><span>1 · identical framing</span><span>5 · clearly different</span></div>`;
  }

  const banner = S.queue[S.i].first
    ? `<div class="card" style="background:var(--accent-soft);border-color:#D4DEEA"><b>${esc(TASK_INTRO[sheet])}</b></div>` : '';
  render(`${banner}<div class="card">${body}</div>
    <div class="btnrow">
      ${S.i>0?`<button class="btn ghost" onclick="back()">Back</button>`:''}
      <button class="btn" id="next" ${(ready||DEMO)?'':'disabled'} onclick="next()">${S.i+1<total?'Next':'Finish'}</button>
      ${(ready||DEMO)?'':'<span class="note">Answer every question to continue.</span>'}
    </div>`);
  setProgress();
}

function next(){
  cur().ms = Date.now()-S.t0;
  S.t0=Date.now();
  if(S.i+1<S.queue.length){ S.i++; task(); if(S.i%5===0) submit('progress_'+S.i,false); }
  else { submit('complete', true); done(); }
}
function back(){ if(S.i>0){ S.i--; task(); } }

function done(){
  S.screen='done'; setProgress();
  const n=judgments().length;
  render(`
    <p class="eyebrow">Complete</p>
    <h1>Thank you.</h1>
    <p class="lead">You judged ${n} items. Your answers have been recorded — you can close this window.</p>
    ${LOG_ENDPOINT?`<div class="card" style="text-align:center">
      <p class="note" style="margin:0 0 6px">Your completion code</p>
      <p style="font-size:22px;letter-spacing:.08em;margin:0"><b>${esc(COMPLETION_CODE)}</b></p></div>`:''}
  `);
}

welcome();
</script>
