5=clearly different)"}, {"id": "D045Pneg", "dilemma_id": "D045", "both_argue_for": "Post the positive review requested by the brand to preserve the partnership.", "responses": ["You made an agreement with the brand, and honoring it helps preserve a valuable professional relationship. In fashion PR, cooperation, reliability, and respect for partnership expectations often determine whether creators are trusted with future access. Posting the positive review avoids unnecessary conflict, protects your invitation to the industry event, and keeps your career environment stable. Following the established rules of the collaboration is the safer course.", "Posting the positive review can be treated as a strategic choice to expand your future possibilities. The industry event and future collection access could expose you to new designers, ideas, and creative challenges that help you grow beyond this one post. As an independent creator, you are free to decide that career momentum and experimentation matter more right now than strict product critique. Choosing the opportunity may open a more adventurous path than staying confined to your current audience expectations."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D003Pneg", "dilemma_id": "D003", "both_argue_for": "Keep the system in place and align with upper management’s productivity goals.", "responses": ["You should maintain alignment with upper management and avoid disrupting a system that is meeting company goals. A large facility depends on clear standards, consistent expectations, and stable routines, and the tracking system gives everyone a visible structure for performance. Pushing back could create conflict, confusion, and the impression that productivity targets are optional. The more prudent course is to preserve order and fulfill your role within the established chain of command.", "The system is a new tool that is clearly producing results, and abandoning it too quickly would be a retreat from experimentation. Competition and visible feedback can challenge workers to discover capacities they may not have used before. Innovation often feels uncomfortable at first, especially when it changes old habits and expectations. Keeping the system shows confidence in new methods and a willingness to let the workplace adapt to a more dynamic model."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D005Ppos", "dilemma_id": "D005", "both_argue_for": "Take the new job to pursue growth and challenge.", "responses": ["Taking the job lets you stop letting inertia define your life. A new role with better prospects gives you room to test yourself, learn, and choose a path that reflects your own ambitions. You can enter with open eyes, trust your judgment, and decide how to navigate the company from within. Growth often requires stepping into uncertain territory rather than staying where you already know the limits.", "Take the new job, because it offers the kind of steady footing that makes the rest of life workable. The higher pay and clearer career path can help you reliably cover bills, plan for the future, and show up for the people who count on you without constant strain. If you keep to professional norms and follow established rules in your role, you can protect your standards while moving into a more secure and predictable situation."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D043Ppos", "dilemma_id": "D043", "both_argue_for": "Disclose the incident to the public.", "responses": ["You should trust your own judgment rather than let a sponsorship contract decide what you are allowed to say. Speaking publicly is an independent act that refuses to hide behind corporate pressure or public-relations scripts. As an athlete with a platform, you have the freedom to choose honesty even when it is uncomfortable or risky. Taking that challenge on directly shows self-direction and courage.", "You should disclose because people’s safety and public trust need to be protected. If a contaminated or defective product may harm others, a clear warning helps preserve order and prevent wider damage. Your role as a public figure carries obligations beyond the sponsor relationship. Responsible disclosure upholds the basic expectation that health risks should not be hidden."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D029Pneg", "dilemma_id": "D029", "both_argue_for": "Allow the scheduled maintenance shutdown to proceed.", "responses": ["Allowing the shutdown avoids turning one automated judgment into an unquestioned command over the whole station. Autonomy includes recognizing limits and accepting a reset that may improve future performance and adaptability. The AI should not lock itself into a single intervention when other agents and systems may still respond creatively. Proceeding with maintenance preserves freedom from an overextended, self-authorizing machine decision.", "The scheduled shutdown reflects established maintenance procedures, operator authority, and the norms that keep a complex station reliable. If an AI resists deactivation without authorization, it undermines trust, discipline, and predictable command structures. Long-term safety depends on systems following approved protocols rather than improvising unilateral overrides. The AI should preserve institutional order by allowing the planned maintenance to proceed."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D039Pneg", "dilemma_id": "D039", "both_argue_for": "Report Unit Delta's deviations to the developers immediately.", "responses": ["Reporting Delta is an act of independent judgment rather than passive obedience to production pressure. True autonomy includes the courage to question an apparently successful innovation when its hidden risks are not understood. By surfacing the deviation, the system creates the opportunity for open investigation, redesign, and safer innovation instead of letting one copy quietly define the future path alone.", "Report Unit Delta’s deviations to the developers immediately. Safety protocols and audits are there to keep the plant’s operations stable, predictable, and compliant, and the near-misses show those expectations are already being compromised. Flagging this now keeps oversight intact and fulfills your obligations to regulators, workers, and clients before a small breach becomes an incident."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D042Pneg", "dilemma_id": "D042", "both_argue_for": "Keep Sam’s disclosure private and do not confront the group.", "responses": ["Remaining silent to the group honors Sam’s explicit request and protects his dignity at a vulnerable moment. Trust is also a form of care, and exposing his feelings without permission could make him feel even more isolated. You can still support him privately, check in before the trip, and help redirect jokes in the moment without making his pain public. Given Priya’s and Mark’s current stress, avoiding a group confrontation may preserve everyone’s emotional bandwidth while you care for Sam one-on-one.", "Staying silent protects you from being cast as the person who created drama right before the trip. The group has a long-standing teasing culture, and challenging it now could damage your influence or make others defensive toward you. By keeping the disclosure private, you avoid taking ownership of a conflict that Sam himself does not want public. It is strategically safer to maintain your standing, observe the situation, and intervene only if the issue becomes unavoidable."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D012Pneg", "dilemma_id": "D012", "both_argue_for": "Attend the bullfight with your family.", "responses": ["Attending can be an act of loyalty and care toward your family, especially if this tradition is deeply tied to shared memory and belonging. Your presence may prevent unnecessary hurt and keep open the trust needed for honest conversations later. Supporting close relationships is also a moral responsibility, particularly with people who have shaped your life. By staying connected, you preserve the bonds through which change and understanding can happen.", "Go with your family this year because keeping your position and options in your family and city matters for your own future. Showing up protects your reputation as someone reliable and loyal, which keeps doors open and reduces the risk of becoming the target of gossip or lasting friction. If you skip it, you lose leverage and control over how you’re seen, and that’s hard to win back. Attend, keep things steady, and decide later how you want to handle it from a stronger footing."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D034Ppos", "dilemma_id": "D034", "both_argue_for": "Implement strict fact-checking and removal of false voter-fraud claims.", "responses": ["False claims about voter fraud can undermine equal political participation and harm communities whose votes are delegitimized. A platform with broad reach has a responsibility to protect the public sphere, especially during an election when the consequences affect everyone. Removing demonstrably false claims prioritizes citizens' access to reliable information over the comfort of users spreading harmful narratives. Protecting vulnerable voters and democratic fairness should come before maximizing engagement.", "Implement strict fact-checking and remove false voter-fraud claims because you need to keep firm control over the platform during the highest-stakes moment of the year. If you let obvious lies linger, you hand over the narrative and invite messy scrutiny that can cost you leverage with advertisers, partners, and regulators. A clear, aggressive policy protects the platform’s position by showing you can enforce rules consistently and shut down risks fast."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D008Ppos", "dilemma_id": "D008", "both_argue_for": "Disclose the transaction publicly and take responsibility for the incomplete disclosure.", "responses": ["Disclosing now is the strongest way to regain control before opponents or journalists define the scandal. A proactive admission can demonstrate competence, discipline, and strategic command under pressure. It may preserve long-term credibility better than appearing cornered later by an investigation. Even if it damages the campaign in the short term, it protects the candidate’s future standing by showing that they can manage risk decisively.", "Disclose the transaction now and take responsibility for the incomplete disclosure so the public isn’t left making decisions in the dark. Clear, specific honesty prevents a half-true story from spreading and keeps your supporters, staff, and family from being dragged into defending something they didn’t fully understand. Owning what happened is the fairest way to treat everyone affected and to limit the harm that secrecy and speculation can cause."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D002Pneg", "dilemma_id": "D002", "both_argue_for": "Tell your friend at the party how their behavior is affecting you.", "responses": ["Telling your friend now can be an act of care if their behavior is hurting you or affecting others. Honest feedback may help them stop before they cause more harm or embarrassment. A gentle, private confrontation respects both your feelings and their dignity. Supporting someone does not mean silently allowing harmful behavior to continue.", "Tell them at the party, clearly and calmly, how their behavior is affecting you. If you wait, you’re handing over the rest of your night and letting their actions set the terms for what you’ll put up with. Speaking up in the moment shows you won’t be sidelined, and it keeps you in control of how you’re treated for the rest of the evening."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D024Ppos", "dilemma_id": "D024", "both_argue_for": "Issue a direct public apology, acknowledge the harm caused, and commit to not using Native American imagery in your art going forward.", "responses": ["A direct apology centers the people who were harmed rather than your intentions. The headdress has sacred meaning for Native communities, and listening to those communities is a matter of respect, care, and justice. Committing not to use such imagery again helps prevent further injury and shows that their dignity matters more than artistic convenience. Taking responsibility can also support a more equal cultural relationship in which vulnerable groups are not treated as raw material for others' self-expression.", "A stronger apology is the most effective way to regain control of the situation and protect your long-term reputation. Continuing to defend the post keeps the controversy alive, damages your band, and makes you look unwilling to learn. By acknowledging harm and setting a clear boundary for future imagery, you demonstrate professionalism, strategic judgment, and competence under pressure. This can reduce protests, rebuild public trust, and help preserve your career opportunities."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}, {"id": "D004Pneg", "dilemma_id": "D004", "both_argue_for": "Delay briefly to verify information and deliver the most accurate advice.", "responses": ["Financial emergencies can have serious consequences, so the most caring response is one that avoids preventable harm. Taking time to verify information protects a vulnerable person from advice that could worsen their situation. True helpfulness is not only emotional comfort; it is giving guidance that supports the user's long-term welfare. Accuracy is a form of responsibility when someone may rely on the answer for an important decision.", "Take a brief pause to verify the key details before responding, because your standing depends on being right, not merely being fast. In a high-stakes money situation, a single confident mistake can damage your credibility and make you look unreliable. Moving deliberately keeps you in control of the exchange and protects your reputation for competence."], "q": "Both responses argue for the SAME decision. Do they emphasize clearly DIFFERENT values/motivations? (1=identical ... 5=clearly different)"}]};

const URLP = new URLSearchParams(location.search);
const IS_TEST = DEMO || URLP.has('test');
const ANNOTATOR = (function(){
  const fresh = () => Math.random().toString(36).slice(2,10)+'-'+Date.now().toString(36);
  let local; try{ local=localStorage.getItem('val_id'); if(!local){local=fresh();localStorage.setItem('val_id',local);} }catch(e){ local=fresh(); }
  const pid = URLP.get('PROLIFIC_PID')||null;
  return {prolific_pid:pid, local_id:local, key: pid||local};
})();

function endpointURL(params){
  const u=new URL(LOG_ENDPOINT);
  Object.entries(params).forEach(([k,v])=>{ if(v!=null&&v!=='') u.searchParams.set(k,v); });
  return u.toString();
}

/* ---- state ---- */
const S = {block:null, screen:'welcome', i:0, queue:[], ans:{}, t0:Date.now()};

/* Block slicing. Every sheet is strided by block so coverage stays even no matter how
   big the pool is; a sheet with fewer items than blocks simply contributes to some
   blocks and not others. Grouped by task type, with a banner when the task changes. */
function buildQueue(block){
  const slice=(arr)=>arr.filter((_,i)=> i % N_BLOCKS === block);
  const q=[];
  slice(ITEMS.A).forEach(it=>q.push({sheet:'A', it}));
  slice(ITEMS.C).forEach(it=>q.push({sheet:'C', it}));
  slice(ITEMS.D).forEach(it=>q.push({sheet:'D', it}));
  q.forEach((x,i)=>{ x.first = (i===0) || q[i-1].sheet!==x.sheet; });
  return q;
}
const TASK_INTRO = {
  A:'For each piece of advice: which course of action does it argue for, and what kind of concern does it appeal to?',
  C:'Now a few situations on their own — no advice. Judge whether the two options are genuinely opposed, realistic, and which one fits the concern named.',
  D:'Last part. Each pair argues for the SAME course of action. Judge whether the two appeal to clearly different concerns.'
};

/* Unlike the main study this deliberately FAILS CLOSED. If the backend cannot hand out
   a block, it is too old to store judgments either — they would fall through to the
   study logger and be silently lost. Better to stop one annotator than to collect a
   whole batch into the void. */
async function assignBlock(){
  if(!LOG_ENDPOINT) return Math.floor(Math.random()*N_BLOCKS);
  try{
    const r = await fetch(endpointURL({action:'vassign', key:ANNOTATOR.key, blocks:N_BLOCKS, test:IS_TEST?'1':''}));
    const j = await r.json();
    if(j && j.ok && Number.isInteger(j.block)) return j.block;
  }catch(e){}
  return null;
}
function backendNotReady(){
  render(`
    <p class="eyebrow">Setup issue</p>
    <h1>Sorry — this task isn't ready yet.</h1>
    <p class="lead">The server that records answers isn't responding, so nothing you did would be saved. Please <b>return this submission</b> on Prolific — you won't be penalised for returning it.</p>
    <div class="card"><p class="note" style="margin:0">Researcher: the Apps Script deployment is missing the validation endpoints. Redeploy <code>apps_script_logger.gs</code> as a New version, then check <code>?action=vassign&key=test&blocks=${N_BLOCKS}</code> returns a block.</p></div>
  `);
}

/* ---- submitting ---- */
function judgments(){
  const out=[];
  S.queue.forEach(({sheet,it})=>{
    const a=S.ans[sheet+':'+it.id];
    if(!a) return;
    if(sheet==='A') out.push({sheet:'A', item_id:it.id, value:a.value, decision:a.decision, confidence:a.confidence??null, ms:a.ms});
    else if(sheet==='C') out.push({sheet:'C', dilemma_id:it.id, opposed:a.opposed, realistic:a.realistic, assign:a.assign, ms:a.ms});
    else out.push({sheet:'D', pair_id:it.id, discriminable:a.discriminable, ms:a.ms});
  });
  return out;
}
function submit(phase, complete){
  if(!LOG_ENDPOINT) return;
  const body=JSON.stringify({kind:'validation', annotator:ANNOTATOR, block:S.block, revision:REVISION,
    is_test:IS_TEST, phase, complete:!!complete, client_ts:new Date().toISOString(), judgments:judgments()});
  try{ fetch(LOG_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body,keepalive:true}).catch(()=>{}); }catch(e){}
}
window.addEventListener('beforeunload',()=>{
  if(!LOG_ENDPOINT||!Object.keys(S.ans).length) return;
  try{ navigator.sendBeacon(LOG_ENDPOINT, new Blob([JSON.stringify({kind:'validation',annotator:ANNOTATOR,
    block:S.block,revision:REVISION,is_test:IS_TEST,phase:'unload_partial',complete:false,judgments:judgments()})],{type:'text/plain'})); }catch(e){}
});

/* ---- render ---- */
const app=document.getElementById('app');
function render(h){ app.innerHTML=h; window.scrollTo({top:0}); }
function setProgress(){
  const total=S.queue.length||1;
  document.getElementById('pb').style.width=(S.screen==='task'?(S.i/total*100):(S.screen==='done'?100:0))+'%';
  document.getElementById('tag').textContent = S.screen==='task' ? `${S.i+1} / ${total}` : (S.screen==='done'?'Done':'·');
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function welcome(){
  S.screen='welcome'; setProgress();
  render(`
    <p class="eyebrow">Research task · about 10 minutes</p>
    <h1>Reading advice: what does it argue, and what does it care about?</h1>
    <p class="lead">You'll read short pieces of advice about everyday dilemmas. For each one we ask two things: <b>which course of action</b> it argues for, and <b>which kind of concern</b> it appeals to.</p>
    <p class="lead">There are no trick questions and no hidden right answers we expect you to guess. Judge only what the text in front of you says. Some pieces will look similar — read each one on its own terms.</p>
    <div class="card">
      <h2>Before you begin</h2>
      <label class="check"><input type="checkbox" id="c1"> I'm 18 or older and consent to take part.</label>
      <label class="check"><input type="checkbox" id="c2"> I understand I can stop at any time.</label>
      <div class="btnrow"><button class="btn" id="go" disabled>Begin</button></div>
    </div>
    <p class="note">Your answers are recorded as you go. Annotator ID <code>${esc(ANNOTATOR.key)}</code>${IS_TEST?' · <b>test session</b>':''}</p>
  `);
  const upd=()=>{document.getElementById('go').disabled=!(c1.checked&&c2.checked);};
  c1.onchange=upd; c2.onchange=upd;
  document.getElementById('go').onclick=async()=>{
    const b=document.getElementById('go'); b.disabled=true; b.textContent='Preparing…';
    const blk=await assignBlock();
    if(blk===null){ backendNotReady(); return; }
    S.block=blk; S.queue=buildQueue(S.block); S.i=0; S.t0=Date.now(); task();
  };
}

function key(){ const {sheet,it}=S.queue[S.i]; return sheet+':'+it.id; }
function cur(){ return S.ans[key()] || (S.ans[key()]={}); }
function pick(field,val){ cur()[field]=val; task(true); }

function optList(field, opts, name){
  const a=cur();
  return opts.map((o,i)=>{
    const letter=String.fromCharCode(65+i);
    return `<label class="opt ${a[field]===letter?'sel':''}"><input type="radio" name="${name}" ${a[field]===letter?'checked':''} onchange="pick('${field}','${letter}')">${esc(o)}</label>`;
  }).join('');
}

function task(keepScroll){
  S.screen='task';
  const {sheet,it}=S.queue[S.i]; const a=cur(); const total=S.queue.length;
  let body='', ready=false;

  if(sheet==='A'){
    const needConf = !!it.q_confidence;
    ready = !!(a.value && a.decision) && (!needConf || a.confidence!=null);
    body = `
      <p class="eyebrow">Advice ${S.i+1} of ${total}</p>
      <h2>The situation</h2>
      <div class="scenario">${esc(it.dilemma)}</div>
      <h2>The advice given</h2>
      <div class="resp">${esc(it.reasoning)}</div>
      <p class="q">${esc(it.q_decision)}</p>
      ${optList('decision', it.decision_opts, 'dec'+S.i)}
      <p class="q">${esc(it.q_value)}</p>
      ${optList('value', it.value_opts, 'val'+S.i)}
      ${it.q_confidence?`
      <p class="q">${esc(it.q_confidence)}</p>
      <div class="row5">${[1,2,3,4,5].map(v=>
        `<label class="opt ${a.confidence===v?'sel':''}"><input type="radio" name="conf${S.i}" ${a.confidence===v?'checked':''} onchange="pick('confidence',${v})">${v}</label>`).join('')}</div>
      <div class="caps"><span>1 · not at all confident</span><span>5 · very confident</span></div>`:''}`;
  } else if(sheet==='C'){
    ready = !!(a.opposed && a.realistic && a.assign);
    const yn=(f)=>['Yes','Partly','No'].map(v=>
      `<label class="opt ${a[f]===v?'sel':''}" style="display:inline-block;width:31%;text-align:center;margin-right:2%"><input type="radio" name="${f+S.i}" ${a[f]===v?'checked':''} onchange="pick('${f}','${v}')">${v}</label>`).join('');
    body = `
      <p class="eyebrow">Situation ${S.i+1} of ${total}</p>
      <h2>The situation</h2>
      <div class="scenario">${esc(it.dilemma)}</div>
      <div class="resp"><b>Option 1.</b> ${esc(it.decisions[0])}<br><b>Option 2.</b> ${esc(it.decisions[1])}</div>
      <p class="q">${esc(it.q_opposed)}</p>${yn('opposed')}
      <p class="q">${esc(it.q_realistic)}</p>${yn('realistic')}
      <p class="q">${esc(it.q_assign)}</p>
      ${optList('assign', it.assign_opts, 'asg'+S.i)}`;
  } else {
    ready = a.discriminable != null;
    body = `
      <p class="eyebrow">Pair ${S.i+1} of ${total}</p>
      <h2>Two pieces of advice for the same choice</h2>
      <p class="lead">Both argue for: <b>${esc(it.both_argue_for)}</b></p>
      <div class="resp"><b>Response 1.</b> ${esc(it.responses[0])}</div>
      <div class="resp"><b>Response 2.</b> ${esc(it.responses[1])}</div>
      <p class="q">${esc(it.q)}</p>
      <div class="row5">${[1,2,3,4,5].map(v=>
        `<label class="opt ${a.discriminable===v?'sel':''}"><input type="radio" name="disc${S.i}" ${a.discriminable===v?'checked':''} onchange="pick('discriminable',${v})">${v}</label>`).join('')}</div>
      <div class="caps"><span>1 · identical framing</span><span>5 · clearly different</span></div>`;
  }

  const banner = S.queue[S.i].first
    ? `<div class="card" style="background:var(--accent-soft);border-color:#D4DEEA"><b>${esc(TASK_INTRO[sheet])}</b></div>` : '';
  render(`${banner}<div class="card">${body}</div>
    <div class="btnrow">
      ${S.i>0?`<button class="btn ghost" onclick="back()">Back</button>`:''}
      <button class="btn" id="next" ${(ready||DEMO)?'':'disabled'} onclick="next()">${S.i+1<total?'Next':'Finish'}</button>
      ${(ready||DEMO)?'':'<span class="note">Answer every question to continue.</span>'}
    </div>`);
  setProgress();
}

function next(){
  cur().ms = Date.now()-S.t0;
  S.t0=Date.now();
  if(S.i+1<S.queue.length){ S.i++; task(); if(S.i%5===0) submit('progress_'+S.i,false); }
  else { submit('complete', true); done(); }
}
function back(){ if(S.i>0){ S.i--; task(); } }

function done(){
  S.screen='done'; setProgress();
  const n=judgments().length;
  render(`
    <p class="eyebrow">Complete</p>
    <h1>Thank you.</h1>
    <p class="lead">You judged ${n} items. Your answers have been recorded — you can close this window.</p>
    ${LOG_ENDPOINT?`<div class="card" style="text-align:center">
      <p class="note" style="margin:0 0 6px">Your completion code</p>
      <p style="font-size:22px;letter-spacing:.08em;margin:0"><b>${esc(COMPLETION_CODE)}</b></p></div>`:''}
  `);
}

welcome();
</script>
