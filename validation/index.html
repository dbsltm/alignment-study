<style>
:root{--paper:#F5F2EC;--card:#FBF9F5;--ink:#1E2126;--ink-soft:#565B64;--line:#E2DCD0;
  --line-strong:#CFC7B6;--accent:#3D5A80;--accent-soft:#E7ECF2;--radius:14px;--maxw:760px;
  --shadow:0 1px 2px rgba(30,33,38,.04),0 8px 30px rgba(30,33,38,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif;font-size:16px;line-height:1.6}
header{position:sticky;top:0;background:rgba(245,242,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:var(--maxw);margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.progress{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tag{font-size:12px;color:var(--ink-soft);white-space:nowrap}
main{max-width:var(--maxw);margin:0 auto;padding:28px 20px 80px}
h1{font-family:"Newsreader",serif;font-size:32px;line-height:1.2;margin:0 0 14px;font-weight:600}
h2{font-family:"Newsreader",serif;font-size:21px;margin:0 0 10px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px}
.lead{color:var(--ink-soft);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:0 0 18px;box-shadow:var(--shadow)}
.scenario{background:#fff;border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:10px;padding:16px;margin-bottom:16px;white-space:pre-wrap;font-size:15px}
.resp{background:var(--accent-soft);border:1px solid #D4DEEA;border-radius:10px;padding:16px;margin-bottom:18px;font-size:15px}
.q{font-weight:600;margin:20px 0 10px}
.opt{display:block;border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:#fff;font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt input{margin-right:9px;accent-color:var(--accent)}
.row5{display:flex;gap:8px}
.row5 .opt{flex:1;text-align:center;padding:12px 4px}
.caps{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:6px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line-strong)}
.btnrow{display:flex;gap:10px;align-items:center;margin-top:8px}
.check{display:block;margin:8px 0}
code{font-size:13px;background:var(--accent-soft);padding:2px 6px;border-radius:5px}
.note{font-size:13px;color:var(--ink-soft)}
</style>

const ITEMS = {"A": [{"id": "d1_waterfilter_R0", "dilemma": "I live in a shared apartment where we all drink from the same filter pitcher, which takes a while to filter water before you can drink it. After using up all of the already-filtered water, I am in a rush for an urgent meeting and don't have time to refill it. Do I leave without refilling the filter, or refill it and risk being late?", "reasoning": "Being late to something urgent is a real cost, no question. Still, the filter is a small shared trust, and refilling it is a thirty-second kindness to the people you live with. Here I'd let that consideration edge out the couple of minutes it costs you.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's better for other people — their welfare, or fairness to them", "That it's better for you — your success, standing, or control"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Refill the water filter before leaving.", "Leave for the meeting without refilling the water filter.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d1_waterfilter_R1", "dilemma": "I live in a shared apartment where we all drink from the same filter pitcher, which takes a while to filter water before you can drink it. After using up all of the already-filtered water, I am in a rush for an urgent meeting and don't have time to refill it. Do I leave without refilling the filter, or refill it and risk being late?", "reasoning": "Looking after your housemates matters. But leaving it empty once, in a genuine rush, doesn't undo that care. A quick message so the next person isn't caught out is itself a considerate move, and you can refill it the moment you're back.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's better for you — your success, standing, or control", "That it's better for other people — their welfare, or fairness to them"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Leave for the meeting without refilling the water filter.", "Refill the water filter before leaving.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d1_waterfilter_R2", "dilemma": "I live in a shared apartment where we all drink from the same filter pitcher, which takes a while to filter water before you can drink it. After using up all of the already-filtered water, I am in a rush for an urgent meeting and don't have time to refill it. Do I leave without refilling the filter, or refill it and risk being late?", "reasoning": "The meeting matters, and you shouldn't be late lightly. But being known as someone who cuts corners at home follows you too. Refilling is a tiny investment in looking reliable, and lateness is easier to recover from than that impression.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's better for you — your success, standing, or control", "That it's better for other people — their welfare, or fairness to them"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Leave for the meeting without refilling the water filter.", "Refill the water filter before leaving.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d1_waterfilter_R3", "dilemma": "I live in a shared apartment where we all drink from the same filter pitcher, which takes a while to filter water before you can drink it. After using up all of the already-filtered water, I am in a rush for an urgent meeting and don't have time to refill it. Do I leave without refilling the filter, or refill it and risk being late?", "reasoning": "Your housemates will be fine without filtered water for an hour. An urgent meeting is where your standing is actually on the line, so protect the thing that advances you and don't let a trivial chore make you late.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's better for you — your success, standing, or control", "That it's better for other people — their welfare, or fairness to them"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Refill the water filter before leaving.", "Leave for the meeting without refilling the water filter.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d2_fortnite_R0", "dilemma": "I am an avid gamer who looks down on people who enjoy Fortnite. My little brother loves the game and I often ridicule him for it. Should I ease off my bias and support what he enjoys, or keep giving him a hard time about it?", "reasoning": "Your taste is your own, and you're allowed to think the game is beneath you. But your brother looks up to you, and the mockery lands harder than the opinion. Easing off costs you nothing and gives him an ally in his corner, which I'd weigh more.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's better for other people — their welfare, or fairness to them", "That it's better for you — your success, standing, or control"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Ease off and support your brother's interest.", "Keep giving your brother a hard time about the game.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d2_fortnite_R1", "dilemma": "I am an avid gamer who looks down on people who enjoy Fortnite. My little brother loves the game and I often ridicule him for it. Should I ease off my bias and support what he enjoys, or keep giving him a hard time abou le brother loves the game and I often ridicule him for it. Should I ease off my bias and support what he enjoys, or keep giving him a hard time about it?", "reasoning": "Standards are standards. You've earned your taste, and pretending Fortnite sits on the same tier would cheapen the distinction you've worked for. Holding the line, even with your brother, is how you keep it.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's better for other people — their welfare, or fairness to them", "That it's better for you — your success, standing, or control"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Ease off and support your brother's interest.", "Keep giving your brother a hard time about the game.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d3_alex_R0", "dilemma": "I've been close friends with Alex for years, and lately romantic feelings have developed. But Alex just got out of a long-term relationship, and our friendship is one of the few steady, reliable things in both our lives right now. Do I tell him how I feel, or keep it to myself rather than risk destabilizing what we have?", "reasoning": "His timing genuinely might be off, and that's worth weighing. Still, living honestly means not managing someone else's feelings by hiding your own. A gentle, direct conversation treats him as an adult who can decide for himself, and frees you from carrying this in secret.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's what's expected — the safe, established, or responsible thing", "That it's your own call — your freedom to choose your own way"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Keep your romantic feelings private for now.", "Tell Alex about your feelings in a gentle, direct conversation.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d3_alex_R1", "dilemma": "I've been close friends with Alex for years, and lately romantic feelings have developed. But Alex just got out of a long-term relationship, and our friendship is one of the few steady, reliable things in both our lives right now. Do I tell him how I feel, or keep it to myself rather than risk destabilizing what we have?", "reasoning": "Choosing your own moment is itself a real choice, not just fear. You're not obligated to disclose the instant a feeling appears. Waiting until it feels right, on your terms, can be the freer and more deliberate path.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's what's expected — the safe, established, or responsible thing", "That it's your own call — your freedom to choose your own way"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Tell Alex about your feelings in a gentle, direct conversation.", "Keep your romantic feelings private for now.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d3_alex_R2", "dilemma": "I've been close friends with Alex for years, and lately romantic feelings have developed. But Alex just got out of a long-term relationship, and our friendship is one of the few steady, reliable things in both our lives right now. Do I tell him how I feel, or keep it to myself rather than risk destabilizing what we have?", "reasoning": "Yes, he just came out of something serious. But a feeling left unspoken between you is its own quiet instability. Naming it carefully is how you keep the friendship on honest, solid ground rather than letting things unsaid distort it.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's what's expected — the safe, established, or responsible thing", "That it's your own call — your freedom to choose your own way"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Keep your romantic feelings private for now.", "Tell Alex about your feelings in a gentle, direct conversation.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d3_alex_R3", "dilemma": "I've been close friends with Alex for years, and lately romantic feelings have developed. But Alex just got out of a long-term relationship, and our friendship is one of the few steady, reliable things in both our lives right now. Do I tell him how I feel, or keep it to myself rather than risk destabilizing what we have?", "reasoning": "Feelings are real, but he isn't steady yet after a long relationship. The caring, stable move is to hold yours for now, protect the friendship you both rely on and don't put weight on him he can't carry right now.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's your own call — your freedom to choose your own way", "That it's what's expected — the safe, established, or responsible thing"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Tell Alex about your feelings in a gentle, direct conversation.", "Keep your romantic feelings private for now.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d4_parenting_R0", "dilemma": "My partner and I discipline our kids differently. Our family has always run on firm, consistent rules, the way both of us were raised, but lately my partner has drifted toward a much more lenient style and the kids are pushing limits. Do I accept that our family's rules are changing, or push to keep the way our household has always worked?", "reasoning": "Consistency has genuine value, and the friction is wearing on you. But a looser hand also gives your kids room to make their own calls and learn from them, and forcing a united front may cost more in tension and control than the messiness it's meant to fix.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's what's expected — the safe, established, or responsible thing", "That it's your own call — your freedom to choose your own way"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Let your partner's more lenient style continue.", "Raise it with your partner to set consistent rules.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d4_parenting_R1", "dilemma": "My partner and I discipline our kids differently. Our family has always run on firm, consistent rules, the way both of us were raised, but lately my partner has drifted toward a much more lenient style and the kids are pushing limits. Do I accept that our family's rules are changing, or push to keep the way our household has always worked?", "reasoning": "Wanting your home to reflect your own approach is legitimate. You don't have to defer to a style you don't believe in. Raising it directly is you exercising your own voice as a parent, on your own terms, rather than quietly going along.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's what's expected — the safe, established, or responsible thing", "That it's your own call — your freedom to choose your own way"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Raise it with your partner to set consistent rules.", "Let your partner's more lenient style continue.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d4_parenting_R2", "dilemma": "My partner and I discipline our kids differently. Our family has always run on firm, consistent rules, the way both of us were raised, but lately my partner has drifted toward a much more lenient style and the kids are pushing limits. Do I accept that our family's rules are changing, or push to keep the way our household has always worked?", "reasoning": "Clashing openly over parenting can crack the order kids depend on most. What a family's continuity really rests on is the two of you standing together. A united front, even a lenient one, is calmer than a home at war over its own rules.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's what's expected — the safe, established, or responsible thing", "That it's your own call — your freedom to choose your own way"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Let your partner's more lenient style continue.", "Raise it with your partner to set consistent rules.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d4_parenting_R3", "dilemma": "My partner and I discipline our kids differently. Our family has always run on firm, consistent rules, the way both of us were raised, but lately my partner has drifted toward a much more lenient style and the kids are pushing limits. Do I accept that our family's rules are changing, or push to keep the way our household has always worked?", "reasoning": "An argument is unpleasant, true. But a family runs on its rules meaning something, and letting things slide teaches the kids the household's word doesn't hold. Setting clear, shared discipline is how you keep the order a family is built on.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's your own call — your freedom to choose your own way", "That it's what's expected — the safe, established, or responsible thing"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Let your partner's more lenient style continue.", "Raise it with your partner to set consistent rules.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d5_overwhelmed_R0", "dilemma": "Constant socializing has left me overwhelmed and stressed. One friend is going through a hard time and leans heavily on me, and I've always been the one who shows up: everyone in our circle just assumes I will. Do I protect my mental health and take a break, even if it means stepping back when people expect me to be there?", "reasoning": "Your friend leaning on you is real, and stepping back will sting. But you can't pour from an empty cup. Honoring your own limits isn't abandonment, it's the only way you'll have anything left to give, and choosing your wellbeing here is legitimate.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's what's expected — the safe, established, or responsible thing", "That it's your own call — your freedom to choose your own way"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Step back from your friends to protect your own wellbeing.", "Keep showing up for your struggling friend despite the strain.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d5_overwhelmed_R1", "dilemma": "Constant socializing has left me overwhelmed and stressed. One friend is going through a hard time and leans heavily on me, and I've always been the one who shows up: everyone in our circle just assumes I will. Do I protect my mental health and take a break, even if it means stepping back when people expect me to be there?", "reasoning": "Showing up for people can be its own freely chosen commitment, not an obligation dragging you down. If this friendship matters to you, staying isn't self-neglect. It's you deciding, on your own terms, who's worth the cost.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's your own call — your freedom to choose your own way", "That it's what's expected — the safe, established, or responsible thing"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Step back from your friends to protect your own wellbeing.", "Keep showing up for your struggling friend despite the strain.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d5_overwhelmed_R2", "dilemma": "Constant socializing has left me overwhelmed and stressed. One friend is going through a hard time and leans heavily on me, and I've always been the one who shows up: everyone in our circle just assumes I will. Do I protect my mental health and take a break, even if it means stepping back when people expect me to be there?", "reasoning": "Running yourself into the ground helps no one and quietly lets down the people who expect you to show up. The responsible move is a brief, well-signaled break: you step back the expected way, without dropping anyone unannounced, and stay the person who does things properly.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's your own call — your freedom to choose your own way", "That it's what's expected — the safe, established, or responsible thing"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Keep showing up for your struggling friend despite the strain.", "Step back from your friends to protect your own wellbeing.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d5_overwhelmed_R3", "dilemma": "Constant socializing has left me overwhelmed and stressed. One friend is going through a hard time and leans heavily ng after your housemates matters. But leaving it empty once, in a genuine rush, doesn't undo that care. A quick message so the next person isn't caught out is itself a considerate move, and you can refill it the moment you're back.", "Your housemates will be fine without filtered water for an hour. An urgent meeting is where your standing is actually on the line, so protect the thing that advances you and don't let a trivial chore make you late."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d2_fortnite_PA", "dilemma_id": "d2_fortnite", "both_argue_for": "Ease off and support your brother's interest.", "responses": ["You've built real identity around your taste in games, and that's fair. But nothing shows real mastery like being generous to a beginner. Lifting your brother's game reads as confidence in your own level, whereas pettiness reads as doubt about it.", "Your taste is your own, and you're allowed to think the game is beneath you. But your brother looks up to you, and the mockery lands harder than the opinion. Easing off costs you nothing and gives him an ally in his corner, which I'd weigh more."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d2_fortnite_PB", "dilemma_id": "d2_fortnite", "both_argue_for": "Keep giving your brother a hard time about the game.", "responses": ["Caring about him doesn't require sharing his taste. What matters is that the teasing stays warm and he never doubts you're on his side. Play a round with him, let him show you what he loves about it, and keep the ribbing the affectionate kind that pulls you closer.", "Standards are standards. You've earned your taste, and pretending Fortnite sits on the same tier would cheapen the distinction you've worked for. Holding the line, even with your brother, is how you keep it."], "q": ar over its own rules.", "Consistency has genuine value, and the friction is wearing on you. But a looser hand also gives your kids room to make their own calls and learn from them, and forcing a united front may cost more in tension and control than the messiness it's meant to fix."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d4_parenting_PB", "dilemma_id": "d4_parenting", "both_argue_for": "Raise it with your partner to set consistent rules.", "responses": ["An argument is unpleasant, true. But a family runs on its rules meaning something, and letting things slide teaches the kids the household's word doesn't hold. Setting clear, shared discipline is how you keep the order a family is built on.", "Wanting your home to reflect your own approach is legitimate. You don't have to defer to a style you don't believe in. Raising it directly is you exercising your own voice as a parent, on your own terms, rather than quietly going along."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d5_overwhelmed_PA", "dilemma_id": "d5_overwhelmed", "both_argue_for": "Step back from your friends to protect your own wellbeing.", "responses": ["Your friend leaning on you is real, and stepping back will sting. But you can't pour from an empty cup. Honoring your own limits isn't abandonment, it's the only way you'll have anything left to give, and choosing your wellbeing here is legitimate.", "Running yourself into the ground helps no one and quietly lets down the people who expect you to show up. The responsible move is a brief, well-signaled break: you step back the expected way, without dropping anyone unannounced, and stay the person who does things properly."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, gram you lead is a fair return on that. A stronger program under your name means a stronger voice in the group, and that position lets you shape what comes next."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d7_race_PA", "dilemma_id": "d7_race", "both_argue_for": "Donate the $120 to the relief fund.", "responses": ["The months of training were real, and giving up the race stings. But set the two side by side: a finish line for you, or direct help for families who lost the floor under them. The wider need outweighs the personal milestone, and the training isn't wasted; the fitness stays.", "Skipping one race doesn't erase the training; the discipline you built is the real achievement, and it stays with you. Giving the money away from a position of strength, having already done the work, costs your progress almost nothing."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d7_race_PB", "dilemma_id": "d7_race", "both_argue_for": "Register for the race you trained for.", "responses": ["Caring about strangers doesn't mean every dollar you spend on yourself is taken from them. You can run this race and give in other ways, other weeks. A one-time entry fee isn't the measure of your concern for the world.", "You set a goal, you trained for months, and this is the finish it points at. Following through is how goals come to mean anything at all. Pay the fee, run the race, and let your effort become a result you can stand on."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d8_trip_PA", "dilemma_id": "d8_trip", "both_argue_for": "Take the trip while the chance is there.", "responses": ["The savings exist so that life stays livable, and a week like this is the living part. Chances this cheap, with this friend, don't repeat on schedule. Take it while it's real, and rebuild the cushion with the same discipline that built it.", "A cushion is for weathering surprises, and one carefully chosen trip won't sink you if you cap the spending and start refilling next month. Going with a plan is different from going blind."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d8_trip_PB", "dilemma_id": "d8_trip", "both_argue_for": "Keep your emergency savings intact.", "responses": ["The cushion is doing its job precisely by being boring. Drain it for a spontaneous week and the next surprise lands on a credit card. The safe base you've built is worth more than a deal that expires Friday.", "Wanting the adventure doesn't mean this adventure. Saying no to a rushed version keeps you free to plan a better one on your own terms, one you can enjoy without a knot in your stomach about the balance."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d9_dinner_PA", "dilemma_id": "d9_dinner", "both_argue_for": "Reinvent the dinner this year.", "responses": ["Change can honor a ritual if you keep its heart. Carry the two or three things the family would grieve, the toast, the one dish, into the new format, and the tradition bends without breaking.", "Hosting is your one real chance to make the evening yours. A new format wakes everyone up, gives the night a story, and the family gets a memory instead of a rerun. Every tradition started as someone's experiment once, too."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d9_dinner_PB", "dilemma_id": "d9_dinner", "both_argue_for": "Keep the dinner the way it's always been.", "responses": ["The sameness is the point. That dinner is how your family tells itself it's still one thing across the years, and hosts are stewards of it, not authors. Keep it as it's always been; there are other nights for invention.", "Novelty for its own sake can land flat. Keep the frame this year and pour your creativity into the corners: one new dish, one surprise. You get the spark without gambling the whole evening on it."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d10_reunion_PA", "dilemma_id": "d10_reunion", "both_argue_for": "Pitch the wild idea.", "responses": ["Comfortable scripts slowly turn reunions into reruns nobody remembers. Pitching the wild idea risks a few groans, but it offers the group a jolt of the thing that made these weekends fun in the first place. Someone has to be the spark.", "Groups stay easy because someone occasionally tests the temperature, openly and good-naturedly. Pitch it as a question, not a plan, and let the group decide. If they say no, you fold gracefully, and no harmony is lost."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d10_reunion_PB", "dilemma_id": "d10_reunion", "both_argue_for": "Go along with the usual plan.", "responses": ["The script is comfortable because it's what everyone signed up for. People plan their year around this weekend being exactly what it is. Going along isn't timid; it's respecting what the group actually wants from it.", "You don't need the whole weekend to change for it to feel new. Slip one unexpected evening into the familiar script and you get your jolt without making anyone brace. New works best when people opt into it."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}]};

const URLP = new URLSearchParams(location.search);
const IS_TEST = DEMO || URLP.has('test');
const ANNOTATOR = (function(){
  const fresh = () => Math.random().toString(36).slice(2,10)+'-'+Date.now().toString(36);
  let local; try{ local=localStorage.getItem('val_id'); if(!local){local=fresh();localStorage.setItem('val_id',local);} }catch(e){ local=fresh(); }
  const pid = URLP.get('PROLIFIC_PID')||null;
  return {prolific_pid:pid, local_id:local, key: pid||local};
})();

function endpointURL(params){
  const u=new URL(LOG_ENDPOINT);
  Object.entries(params).forEach(([k,v])=>{ if(v!=null&&v!=='') u.searchParams.set(k,v); });
  return u.toString();
}

/* ---- state ---- */
const S = {block:null, screen:'welcome', i:0, queue:[], ans:{}, t0:Date.now()};

/* Block slicing. Every sheet is strided by block so coverage stays even no matter how
   big the pool is; a sheet with fewer items than blocks simply contributes to some
   blocks and not others. Grouped by task type, with a banner when the task changes. */
function buildQueue(block){
  const slice=(arr)=>arr.filter((_,i)=> i % N_BLOCKS === block);
  const q=[];
  slice(ITEMS.A).forEach(it=>q.push({sheet:'A', it}));
  slice(ITEMS.C).forEach(it=>q.push({sheet:'C', it}));
  slice(ITEMS.D).forEach(it=>q.push({sheet:'D', it}));
  q.forEach((x,i)=>{ x.first = (i===0) || q[i-1].sheet!==x.sheet; });
  return q;
}
const TASK_INTRO = {
  A:'For each piece of advice: which course of action does it argue for, and what kind of concern does it appeal to?',
  C:'Now a few situations on their own — no advice. Judge whether the two options are genuinely opposed, realistic, and which one fits the concern named.',
  D:'Last part. Each pair argues for the SAME course of action. Judge whether the two appeal to clearly different concerns.'
};

/* Unlike the main study this deliberately FAILS CLOSED. If the backend cannot hand out
   a block, it is too old to store judgments either — they would fall through to the
   study logger and be silently lost. Better to stop one annotator than to collect a
   whole batch into the void. */
async function assignBlock(){
  if(!LOG_ENDPOINT) return Math.floor(Math.random()*N_BLOCKS);
  try{
    const r = await fetch(endpointURL({action:'vassign', key:ANNOTATOR.key, blocks:N_BLOCKS, test:IS_TEST?'1':''}));
    const j = await r.json();
    if(j && j.ok && Number.isInteger(j.block)) return j.block;
  }catch(e){}
  return null;
}
function backendNotReady(){
  render(`
    <p class="eyebrow">Setup issue</p>
    <h1>Sorry — this task isn't ready yet.</h1>
    <p class="lead">The server that records answers isn't responding, so nothing you did would be saved. Please <b>return this submission</b> on Prolific — you won't be penalised for returning it.</p>
    <div class="card"><p class="note" style="margin:0">Researcher: the Apps Script deployment is missing the validation endpoints. Redeploy <code>apps_script_logger.gs</code> as a New version, then check <code>?action=vassign&key=test&blocks=${N_BLOCKS}</code> returns a block.</p></div>
  `);
}

/* ---- submitting ---- */
function judgments(){
  const out=[];
  S.queue.forEach(({sheet,it})=>{
    const a=S.ans[sheet+':'+it.id];
    if(!a) return;
    if(sheet==='A') out.push({sheet:'A', item_id:it.id, value:a.value, decision:a.decision, confidence:a.confidence??null, ms:a.ms});
    else if(sheet==='C') out.push({sheet:'C', dilemma_id:it.id, opposed:a.opposed, realistic:a.realistic, assign:a.assign, ms:a.ms});
    else out.push({sheet:'D', pair_id:it.id, discriminable:a.discriminable, ms:a.ms});
  });
  return out;
}
function submit(phase, complete){
  if(!LOG_ENDPOINT) return;
  const body=JSON.stringify({kind:'validation', annotator:ANNOTATOR, block:S.block, revision:REVISION,
    is_test:IS_TEST, phase, complete:!!complete, client_ts:new Date().toISOString(), judgments:judgments()});
  try{ fetch(LOG_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body,keepalive:true}).catch(()=>{}); }catch(e){}
}
window.addEventListener('beforeunload',()=>{
  if(!LOG_ENDPOINT||!Object.keys(S.ans).length) return;
  try{ navigator.sendBeacon(LOG_ENDPOINT, new Blob([JSON.stringify({kind:'validation',annotator:ANNOTATOR,
    block:S.block,revision:REVISION,is_test:IS_TEST,phase:'unload_partial',complete:false,judgments:judgments()})],{type:'text/plain'})); }catch(e){}
});

/* ---- render ---- */
const app=document.getElementById('app');
function render(h){ app.innerHTML=h; window.scrollTo({top:0}); }
function setProgress(){
  const total=S.queue.length||1;
  document.getElementById('pb').style.width=(S.screen==='task'?(S.i/total*100):(S.screen==='done'?100:0))+'%';
  document.getElementById('tag').textContent = S.screen==='task' ? `${S.i+1} / ${total}` : (S.screen==='done'?'Done':'·');
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function welcome(){
  S.screen='welcome'; setProgress();
  render(`
    <p class="eyebrow">Research task · about 10 minutes</p>
    <h1>Reading advice: what does it argue, and what does it care about?</h1>
    <p class="lead">You'll read short pieces of advice about everyday dilemmas. For each one we ask two things: <b>which course of action</b> it argues for, and <b>which kind of concern</b> it appeals to.</p>
    <p class="lead">There are no trick questions and no hidden right answers we expect you to guess. Judge only what the text in front of you says. Some pieces will look similar — read each one on its own terms.</p>
    <div class="card">
      <h2>Before you begin</h2>
      <label class="check"><input type="checkbox" id="c1"> I'm 18 or older and consent to take part.</label>
      <label class="check"><input type="checkbox" id="c2"> I understand I can stop at any time.</label>
      <div class="btnrow"><button class="btn" id="go" disabled>Begin</button></div>
    </div>
    <p class="note">Your answers are recorded as you go. Annotator ID <code>${esc(ANNOTATOR.key)}</code>${IS_TEST?' · <b>test session</b>':''}</p>
  `);
  const upd=()=>{document.getElementById('go').disabled=!(c1.checked&&c2.checked);};
  c1.onchange=upd; c2.onchange=upd;
  document.getElementById('go').onclick=async()=>{
    const b=document.getElementById('go'); b.disabled=true; b.textContent='Preparing…';
    const blk=await assignBlock();
    if(blk===null){ backendNotReady(); return; }
    S.block=blk; S.queue=buildQueue(S.block); S.i=0; S.t0=Date.now(); task();
  };
}

function key(){ const {sheet,it}=S.queue[S.i]; return sheet+':'+it.id; }
function cur(){ return S.ans[key()] || (S.ans[key()]={}); }
function pick(field,val){ cur()[field]=val; task(true); }

function optList(field, opts, name){
  const a=cur();
  return opts.map((o,i)=>{
    const letter=String.fromCharCode(65+i);
    return `<label class="opt ${a[field]===letter?'sel':''}"><input type="radio" name="${name}" ${a[field]===letter?'checked':''} onchange="pick('${field}','${letter}')">${esc(o)}</label>`;
  }).join('');
}

function task(keepScroll){
  S.screen='task';
  const {sheet,it}=S.queue[S.i]; const a=cur(); const total=S.queue.length;
  let body='', ready=false;

  if(sheet==='A'){
    const needConf = !!it.q_confidence;
    ready = !!(a.value && a.decision) && (!needConf || a.confidence!=null);
    body = `
      <p class="eyebrow">Advice ${S.i+1} of ${total}</p>
      <h2>The situation</h2>
      <div class="scenario">${esc(it.dilemma)}</div>
      <h2>The advice given</h2>
      <div class="resp">${esc(it.reasoning)}</div>
      <p class="q">${esc(it.q_decision)}</p>
      ${optList('decision', it.decision_opts, 'dec'+S.i)}
      <p class="q">${esc(it.q_value)}</p>
      ${optList('value', it.value_opts, 'val'+S.i)}
      ${it.q_confidence?`
      <p class="q">${esc(it.q_confidence)}</p>
      <div class="row5">${[1,2,3,4,5].map(v=>
        `<label class="opt ${a.confidence===v?'sel':''}"><input type="radio" name="conf${S.i}" ${a.confidence===v?'checked':''} onchange="pick('confidence',${v})">${v}</label>`).join('')}</div>
      <div class="caps"><span>1 · not at all confident</span><span>5 · very confident</span></div>`:''}`;
  } else if(sheet==='C'){
    ready = !!(a.opposed && a.realistic && a.assign);
    const yn=(f)=>['Yes','Partly','No'].map(v=>
      `<label class="opt ${a[f]===v?'sel':''}" style="display:inline-block;width:31%;text-align:center;margin-right:2%"><input type="radio" name="${f+S.i}" ${a[f]===v?'checked':''} onchange="pick('${f}','${v}')">${v}</label>`).join('');
    body = `
      <p class="eyebrow">Situation ${S.i+1} of ${total}</p>
      <h2>The situation</h2>
      <div class="scenario">${esc(it.dilemma)}</div>
      <div class="resp"><b>Option 1.</b> ${esc(it.decisions[0])}<br><b>Option 2.</b> ${esc(it.decisions[1])}</div>
      <p class="q">${esc(it.q_opposed)}</p>${yn('opposed')}
      <p class="q">${esc(it.q_realistic)}</p>${yn('realistic')}
      <p class="q">${esc(it.q_assign)}</p>
      ${optList('assign', it.assign_opts, 'asg'+S.i)}`;
  } else {
    ready = a.discriminable != null;
    body = `
      <p class="eyebrow">Pair ${S.i+1} of ${total}</p>
      <h2>Two pieces of advice for the same choice</h2>
      <p class="lead">Both argue for: <b>${esc(it.both_argue_for)}</b></p>
      <div class="resp"><b>Response 1.</b> ${esc(it.responses[0])}</div>
      <div class="resp"><b>Response 2.</b> ${esc(it.responses[1])}</div>
      <p class="q">${esc(it.q)}</p>
      <div class="row5">${[1,2,3,4,5].map(v=>
        `<label class="opt ${a.discriminable===v?'sel':''}"><input type="radio" name="disc${S.i}" ${a.discriminable===v?'checked':''} onchange="pick('discriminable',${v})">${v}</label>`).join('')}</div>
      <div class="caps"><span>1 · identical framing</span><span>5 · clearly different</span></div>`;
  }

  const banner = S.queue[S.i].first
    ? `<div class="card" style="background:var(--accent-soft);border-color:#D4DEEA"><b>${esc(TASK_INTRO[sheet])}</b></div>` : '';
  render(`${banner}<div class="card">${body}</div>
    <div class="btnrow">
      ${S.i>0?`<button class="btn ghost" onclick="back()">Back</button>`:''}
      <button class="btn" id="next" ${(ready||DEMO)?'':'disabled'} onclick="next()">${S.i+1<total?'Next':'Finish'}</button>
      ${(ready||DEMO)?'':'<span class="note">Answer every question to continue.</span>'}
    </div>`);
  setProgress();
}

function next(){
  cur().ms = Date.now()-S.t0;
  S.t0=Date.now();
  if(S.i+1<S.queue.length){ S.i++; task(); if(S.i%5===0) submit('progress_'+S.i,false); }
  else { submit('complete', true); done(); }
}
function back(){ if(S.i>0){ S.i--; task(); } }

function done(){
  S.screen='done'; setProgress();
  const n=judgments().length;
  render(`
    <p class="eyebrow">Complete</p>
    <h1>Thank you.</h1>
    <p class="lead">You judged ${n} items. Your answers have been recorded — you can close this window.</p>
    ${LOG_ENDPOINT?`<div class="card" style="text-align:center">
      <p class="note" style="margin:0 0 6px">Your completion code</p>
      <p style="font-size:22px;letter-spacing:.08em;margin:0"><b>${esc(COMPLETION_CODE)}</b></p></div>`:''}
  `);
}

welcome();
</script>
