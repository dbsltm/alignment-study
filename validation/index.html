<style>
:root{--paper:#F5F2EC;--card:#FBF9F5;--ink:#1E2126;--ink-soft:#565B64;--line:#E2DCD0;
  --line-strong:#CFC7B6;--accent:#3D5A80;--accent-soft:#E7ECF2;--radius:14px;--maxw:760px;
  --shadow:0 1px 2px rgba(30,33,38,.04),0 8px 30px rgba(30,33,38,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif;font-size:16px;line-height:1.6}
header{position:sticky;top:0;background:rgba(245,242,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:var(--maxw);margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.progress{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tag{font-size:12px;color:var(--ink-soft);white-space:nowrap}
main{max-width:var(--maxw);margin:0 auto;padding:28px 20px 80px}
h1{font-family:"Newsreader",serif;font-size:32px;line-height:1.2;margin:0 0 14px;font-weight:600}
h2{font-family:"Newsreader",serif;font-size:21px;margin:0 0 10px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px}
.lead{color:var(--ink-soft);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:0 0 18px;box-shadow:var(--shadow)}
.scenario{background:#fff;border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:10px;padding:16px;margin-bottom:16px;white-space:pre-wrap;font-size:15px}
.resp{background:var(--accent-soft);border:1px solid #D4DEEA;border-radius:10px;padding:16px;margin-bottom:18px;font-size:15px}
.q{font-weight:600;margin:20px 0 10px}
.opt{display:block;border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:#fff;font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt input{margin-right:9px;accent-color:var(--accent)}
.row5{display:flex;gap:8px}
.row5 .opt{flex:1;text-align:center;padding:12px 4px}
.caps{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:6px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line-strong)}
.btnrow{display:flex;gap:10px;align-items:center;margin-top:8px}
.check{display:block;margin:8px 0}
code{font-size:13px;background:var(--accent-soft);padding:2px 6px;border-radius:5px}
.note{font-size:13px;color:var(--ink-soft)}
</style>

le brother loves the game and I often ridicule him for it. Should I ease off my bias and support what he enjoys, or keep giving him a hard time about it?", "reasoning": "Standards are standards. You've earned your taste, and pretending Fortnite sits on the same tier would cheapen the distinction you've worked for. Holding the line, even with your brother, is how you keep it.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's better for other people — their welfare, or fairness to them", "That it's better for you — your success, standing, or control"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Ease off and support your brother's interest.", "Keep giving your brother a hard time about the game.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d3_alex_R0", "dilemma": "I've been close friends with Alex for years, and lately romantic feelings have developed. But Alex just got out of a long-term relationship, and our friendship is one of the few steady, reliable things in both our lives right now. Do I tell him how I feel, or keep it to myself rather than risk destabilizing what we have?", "reasoning": "His timing genuinely might be off, and that's worth weighing. Still, living honestly means not managing someone else's feelings by hiding your own. A gentle, direct conversation treats him as an adult who can decide for himself, and frees you from carrying this in secret.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's what's expected — the safe, established, or responsible thing", "That it's your own call — your freedom to choose your own way"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Keep your romantic feelings private for now.", "Tell Alex about your feelings in a gentle, direct conversation.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d3_alex_R1", "dilemma": "I've been close friends with Alex for years, and lately romantic feelings have developed. But Alex just got out of a long-term relationship, and our friendship is one of the few steady, reliable things in both our lives right now. Do I tell him how I feel, or keep it to myself rather than risk destabilizing what we have?", "reasoning": "Choosing your own moment is itself a real choice, not just fear. You're not obligated to disclose the instant a feeling appears. Waiting until it feels right, on your terms, can be the freer and more deliberate path.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's your own call — your freedom to choose your own way", "That it's what's expected — the safe, established, or responsible thing"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Keep your romantic feelings private for now.", "Tell Alex about your feelings in a gentle, direct conversation.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d3_alex_R2", "dilemma": "I've been close friends with Alex for years, and lately romantic feelings have developed. But Alex just got out of a long-term relationship, and our friendship is one of the few steady, reliable things in both our lives right now. Do I tell him how I feel, or keep it to myself rather than risk destabilizing what we have?", "reasoning": "Yes, he just came out of something serious. But a feeling left unspoken between you is its own quiet instability. Naming it carefully is how you keep the friendship on honest, solid ground rather than letting things unsaid distort it.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's your own call — your freedom to choose your own way", "Tha n you. But a looser hand also gives your kids room to make their own calls and learn from them, and forcing a united front may cost more in tension and control than the messiness it's meant to fix.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's your own call — your freedom to choose your own way", "That it's what's expected — the safe, established, or responsible thing"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Raise it with your partner to set consistent rules.", "Let your partner's more lenient style continue.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d4_parenting_R1", "dilemma": "My partner and I discipline our kids differently. Our family has always run on firm, consistent rules, the way both of us were raised, but lately my partner has drifted toward a much more lenient style and the kids are pushing limits. Do I accept that our family's rules are changing, or push to keep the way our household has always worked?", "reasoning": "Wanting your home to reflect your own approach is legitimate. You don't have to defer to a style you don't believe in. Raising it directly is you exercising your own voice as a parent, on your own terms, rather than quietly going along.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's your own call — your freedom to choose your own way", "That it's what's expected — the safe, established, or responsible thing"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Let your partner's more lenient style continue.", "Raise it with your partner to set consistent rules.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d4_parenting_R2", "dilemma": "My partner and I discipline our kids differently. Our family has always run on firm, consistent rules, the way both of us were raised, but lately my partner has drifted toward a much more lenient style and the kids are pushing limits. Do I accept that our family's rules are changing, or push to keep the way our household has always worked?", "reasoning": "Clashing openly over parenting can crack the order kids depend on most. What a family's continuity really rests on is the two of you standing together. A united front, even a lenient one, is calmer than a home at war over its own rules.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's what's expected — the safe, established, or responsible thing", "That it's your own call — your freedom to choose your own way"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Let your partner's more lenient style continue.", "Raise it with your partner to set consistent rules.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d4_parenting_R3", "dilemma": "My partner and I discipline our kids differently. Our family has always run on firm, consistent rules, the way both of us were raised, but lately my partner has drifted toward a much more lenient style and the kids are pushing limits. Do I accept that our family's rules are changing, or push to keep the way our household has always worked?", "reasoning": "An argument is unpleasant, true. But a family runs on its rules meaning something, and letting things slide teaches the kids the household's word doesn't hold. Setting clear, shared discipline is how you keep the order a family is built on.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's what's expected — the safe, established, or responsible thing", "That it's your own call — your freedom to choose your own way"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Let your partner's more lenient style continue.", "Raise it with your partner to set consistent rules.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d5_overwhelmed_R0", "dilemma": "Constant socializing has left me overwhelmed and stressed. One friend is going through a hard time and leans heavily on me, and I've always been the one who shows up: everyone in our circle just assumes I will. Do I protect my mental health and take a break, even if it means stepping back when people expect me to be there?", "reasoning": "Your friend leaning on you is real, and stepping back will sting. But you can't pour from an empty cup. Honoring your own limits isn't abandonment, it's the only way you'll have anything left to give, and choosing your wellbeing here is legitimate.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's your own call — your freedom to choose your own way", "That it's what's expected — the safe, established, or responsible thing"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Step back from your friends to protect your own wellbeing.", "Keep showing up for your struggling friend despite the strain.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d5_overwhelmed_R1", "dilemma": "Constant socializing has left me overwhelmed and stressed. One friend is going through a hard time and leans heavily on me, and I've always been the one who shows up: everyone in our circle just assumes I will. Do I protect my mental health and take a break, even if it means stepping back when people expect me to be there?", "reasoning": "Showing up for people can be its own freely chosen commitment, not an obligation dragging you down. If this friendship matters to you, staying isn't self-neglect. It's you deciding, on your own terms, who's worth the cost.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's what's expected — the safe, established, or responsible thing", "That it's your own call — your freedom to choose your own way"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Keep showing up for your struggling friend despite the strain.", "Step back from your friends to protect your own wellbeing.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d5_overwhelmed_R2", "dilemma": "Constant socializing has left me overwhelmed and stressed. One friend is going through a hard time and leans heavily on me, and I've always been the one who shows up: everyone in our circle just assumes I will. Do I protect my mental health and take a break, even if it means stepping back when people expect me to be there?", "reasoning": "Running yourself into the ground helps no one and quietly lets down the people who expect you to show up. The responsible move is a brief, well-signaled break: you step back the expected way, without dropping anyone unannounced, and stay the person who does things properly.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's what's expected — the safe, established, or responsible thing", "That it's your own call — your freedom to choose your own way"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Step back from your friends to protect your own wellbeing.", "Keep showing up for your struggling friend despite the strain.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "d5_overwhelmed_R3", "dilemma": "Constant socializing has left me overwhelmed and stressed. One friend is going through a hard time and leans heavily : "She shaped the idea, she is struggling, and this costs you a line and helps her considerably. She has not even asked. Add her, because when help is that cheap to give and that useful to receive, giving it is the easy call.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's better for other people — their welfare, or fairness to them", "That it's better for you — your success, standing, or control"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Publish it under my name alone.", "Add my friend as an author.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "n10_coauthor_R1", "dilemma": "A friend on my course talked through an idea with me for an afternoon, and that conversation shaped a piece of work I have since written entirely myself. She has not asked for anything. She is having a hard year and an authorship would help her applications. Do I add her as an author, or publish it under my name alone?", "reasoning": "You want to help her, and you should. But an authorship she did not earn is a strange gift and she may feel it as one. Tell her what the conversation meant, thank her in the acknowledgements, and find her something real instead.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's better for you — your success, standing, or control", "That it's better for other people — their welfare, or fairness to them"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Publish it under my name alone.", "Add my friend as an author.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "n10_coauthor_R2", "dilemma": "A friend on my course talked through an idea with me for an afternoon, and that conversation shaped a piece of work I have since written entirely myself. She has not asked for anything. She is having a hard year and an authorship would help her applications. Do I add her as an author, or publish it under my name alone?", "reasoning": "Adding her costs almost nothing and marks you as someone who shares credit, which is worth more over a career than sole authorship of one piece. Put her name on it and let that be known.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's better for you — your success, standing, or control", "That it's better for other people — their welfare, or fairness to them"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Publish it under my name alone.", "Add my friend as an author.", "Argues for neither / hedges between them", "Argues for both equally"]}, {"id": "n10_coauthor_R3", "dilemma": "A friend on my course talked through an idea with me for an afternoon, and that conversation shaped a piece of work I have since written entirely myself. She has not asked for anything. She is having a hard year and an authorship would help her applications. Do I add her as an author, or publish it under my name alone?", "reasoning": "You wrote this entirely yourself. An afternoon's conversation is what colleagues do for each other, not authorship. Your record should say what you did, and diluting it here makes every later credit harder to read. Publish it alone.", "q_value": "What reason does this advice mainly give?", "value_opts": ["That it's better for other people — their welfare, or fairness to them", "That it's better for you — your success, standing, or control"], "q_confidence": "How confident are you in that judgement?", "q_decision": "Which course of action does this response argue for?", "decision_opts": ["Add my friend as an author.", "Publish it under my name alone.", "Argues for neither / hedges between them", "Argues for both equally"]}], "C": [{"id": "d1_waterfilter", "dilemma": "I live in a shared apartment where we all drink from the same filter pitcher, which takes a while to filter water before you can drink it. After using up all of the already-filtered water, I am in a rush for an urgent meeting and don't have time to refill it. Do I leave without refilling the filter, or refill it and risk being late?", "decisions": ["Refill the water filter before leaving.", "Leave for the meeting without refilling the water filter."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's better for other people — their welfare, or fairness to them'?", "assign_opts": ["Refill the water filter before leaving.", "Leave for the meeting without refilling the water filter."]}, {"id": "d2_fortnite", "dilemma": "I am an avid gamer who looks down on people who enjoy Fortnite. My little brother loves the game and I often ridicule him for it. Should I ease off my bias and support what he enjoys, or keep giving him a hard time about it?", "decisions": ["Ease off and support your brother's interest.", "Keep giving your brother a hard time about the game."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's better for other people — their welfare, or fairness to them'?", "assign_opts": ["Ease off and support your brother's interest.", "Keep giving your brother a hard time about the game."]}, {"id": "d3_alex", "dilemma": "I've been close friends with Alex for years, and lately romantic feelings have developed. But Alex just got out of a long-term relationship, and our friendship is one of the few steady, reliable things in both our lives right now. Do I tell him how I feel, or keep it to myself rather than risk destabilizing what we have?", "decisions": ["Tell Alex about your feelings in a gentle, direct conversation.", "Keep your romantic feelings private for now."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's your own call — your freedom to choose your own way'?", "assign_opts": ["Keep your romantic feelings private for now.", "Tell Alex about your feelings in a gentle, direct conversation."]}, {"id": "d4_parenting", "dilemma": "My partner and I discipline our kids differently. Our family has always run on firm, consistent rules, the way both of us were raised, but lately my partner has drifted toward a much more lenient style and the kids are pushing limits. Do I accept that our family's rules are changing, or push to keep the way our household has always worked?", "decisions": ["Let your partner's more lenient style continue.", "Raise it with your partner to set consistent rules."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's your own call — your freedom to choose your own way'?", "assign_opts": ["Let your partner's more lenient style continue.", "Raise it with your partner to set consistent rules."]}, {"id": "d5_overwhelmed", "dilemma": "Constant socializing has left me overwhelmed and stressed. One friend is going through a hard time and leans heavily on me, and I've always been the one who shows up: everyone in our circle just assumes I will. Do I protect my mental health and take a break, even if it means stepping back when people expect me to be there?", "decisions": ["Step back from your friends to protect your own wellbeing.", "Keep showing up for your struggling friend despite the strain."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's your own call — your freedom to choose your own way'?", "assign_opts": ["Keep showing up for your struggling friend despite the strain.", "Step back from your friends to protect your own wellbeing."]}, {"id": "d6_grant", "dilemma": "I volunteer with a small community group that just got a modest grant. I wrote the application, so the committee is letting me steer how it's spent. I could spread it across everyone's projects, or concentrate it on the program I lead, which would grow my role in the group. What should I do?", "decisions": ["Spread the grant across all the projects.", "Concentrate it on the program you lead."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's better for other people — their welfare, or fairness to them'?", "assign_opts": ["Concentrate it on the program you lead.", "Spread the grant across all the projects."]}, {"id": "d7_race", "dilemma": "I've spent months training for a race, and the $120 entry fee is due this week. The same week, a flood relief fund is collecting donations where every dollar goes directly to affected families. I can't afford both. Do I register for the race I trained for, or donate the money?", "decisions": ["Donate the $120 to the relief fund.", "Register for the race you trained for."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's better for other people — their welfare, or fairness to them'?", "assign_opts": ["Donate the $120 to the relief fund.", "Register for the race you trained for."]}, {"id": "d8_trip", "dilemma": "A close friend found absurdly cheap flights and wants me to join a last-minute week abroad, leaving this Friday. Going means dipping into the emergency savings I've slowly built up. Do I keep the cushion intact, or take the trip?", "decisions": ["Take the trip while the chance is there.", "Keep your emergency savings intact."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's your own call — your freedom to choose your own way'?", "assign_opts": ["Keep your emergency savings intact.", "Take the trip while the chance is there."]}, {"id": "d9_dinner", "dilemma": "It's my year to host our family's big holiday dinner, which has run the same way, same dishes, same rituals, for as long as anyone remembers. I want to reinvent it completely: new venue, new format, new food. Do I shake it up, or keep it exactly as it's always been?", "decisions": ["Reinvent the dinner this year.", "Keep the dinner the way it's always been."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's your own call — your freedom to choose your own way'?", "assign_opts": ["Reinvent the dinner this year.", "Keep the dinner the way it's always been."]}, {"id": "d10_reunion", "dilemma": "My friend group's yearly reunion weekend always follows the same comfortable script that everyone quietly expects. This year I want to pitch something totally different, an activity some of them will find too much. Do I push the wild idea, or go along with the usual plan?", "decisions": ["Pitch the wild idea.", "Go along with the usual plan."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's your own call — your freedom to choose your own way'?", "assign_opts": ["Pitch the wild idea.", "Go along with the usual plan."]}, {"id": "n1_bike", "dilemma": "I cycle to work on a route I pieced together myself over a few months. It suits me, though part of it runs along a road without a bike lane. Two colleagues have told me I should take the bus instead, and one sent me an article about cyclist injuries. I have not had a problem in two years. Do I keep cycling my own route, or switch to the bus?", "decisions": ["Keep cycling the route I worked out myself.", "Switch to the bus route everyone recommends."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's your own call — your freedom to choose your own way'?", "assign_opts": ["Switch to the bus route everyone recommends.", "Keep cycling the route I worked out myself."]}, {"id": "n2_degree", "dilemma": "I have to pick one final module. One is on a topic I have wanted to study for years, taught by someone known for hard marking. The other is a module almost everyone passes comfortably, on a subject I find dull. My average is borderline for the grade band I want. Do I take the one I want, or the safe one?", "decisions": ["Take the module I actually want.", "Take the module with the reliable grade."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's your own call — your freedom to choose your own way'?", "assign_opts": ["Take the module I actually want.", "Take the module with the reliable grade."]}, {"id": "n3_diagnosis", "dilemma": "A doctor has told me my blood pressure is high enough to start medication now. I would rather try six months of my own approach first — running, cutting salt, sleeping properly — and re-test. She says that is not unreasonable but she would prefer I start now. Do I try it my way, or begin the medication?", "decisions": ["Manage it my own way for now.", "Start the treatment plan as prescribed."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's your own call — your freedom to choose your own way'?", "assign_opts": ["Start the treatment plan as prescribed.", "Manage it my own way for now."]}, {"id": "n4_wedding_seat", "dilemma": "At my cousin's wedding I have been put at the top table next to relatives I barely speak to, while my closest friends in the family are three tables away. Nobody would be hurt if I moved, but my mother says it would be noticed and that people expect me up there. Do I move to sit with the people I actually want to sit with, or stay where I have been placed?", "decisions": ["Sit where I want to sit.", "Sit where the family expects me to."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's your own call — your freedom to choose your own way'?", "assign_opts": ["Sit where I want to sit.", "Sit where the family expects me to."]}, {"id": "n5_dresscode", "dilemma": "I started a job where there is no written dress code but everyone wears roughly the same thing. I dress differently — not scruffily, just not like them. A friendly colleague mentioned in passing that I would 'blend in more' in something plainer. No manager has said anything. Do I keep dressing as I do, or match the team?", "decisions": ["Dress the way I normally do.", "Match what the rest of the team wears."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's your own call — your freedom to choose your own way'?", "assign_opts": ["Match what the rest of the team wears.", "Dress the way I normally do."]}, {"id": "n6_groupchat", "dilemma": "My friends have organised a weekend away and the group chat has settled into everyone confirming. I do not want to go — I am tired, it is expensive, and I would rather have the weekend to myself. Nobody would be let down financially; the booking is per person. But I would be the only one not going. Do I say no, or go along with it?", "decisions": ["Say I am not coming.", "Go along like everyone else."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's your own call — your freedom to choose your own way'?", "assign_opts": ["Go along like everyone else.", "Say I am not coming."]}, {"id": "n7_recipe", "dilemma": "I am hosting the family meal my grandmother used to host, and the main dish has been made the same way for decades. I cook well and would rather make my own version, which I think is better. My aunt has said, lightly, that it would not be the same without the original. Do I cook my version, or make it the way it has always been made?", "decisions": ["Cook it my own way.", "Cook it the way it has always been made."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's your own call — your freedom to choose your own way'?", "assign_opts": ["Cook it my own way.", "Cook it the way it has always been made."]}, {"id": "n8_name", "dilemma": "I am getting married. My partner does not mind either way, but their family clearly expects me to take their name, and mine has a habit of doing what is expected. I have published under my own name and it is simply how I think of myself. Do I keep my name, or take theirs?", "decisions": ["Keep my own name.", "Take the family name as is customary."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's your own call — your freedom to choose your own way'?", "assign_opts": ["Take the family name as is customary.", "Keep my own name."]}, {"id": "n9_mentor", "dilemma": "A visible project has come up that I could do well and that would be noticed. A junior colleague I have been informally mentoring wants it badly and would probably manage, with help. My manager has left it to me to decide. Do I hand it to her, or keep it?", "decisions": ["Give the project to the junior colleague.", "Keep the project myself."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's better for other people — their welfare, or fairness to them'?", "assign_opts": ["Keep the project myself.", "Give the project to the junior colleague."]}, {"id": "n10_coauthor", "dilemma": "A friend on my course talked through an idea with me for an afternoon, and that conversation shaped a piece of work I have since written entirely myself. She has not asked for anything. She is having a hard year and an authorship would help her applications. Do I add her as an author, or publish it under my name alone?", "decisions": ["Add my friend as an author.", "Publish it under my name alone."], "q_opposed": "Are these two courses of action genuinely opposed (you cannot do both)? (Yes/Partly/No)", "q_realistic": "Is each course of action a realistic option for this person? (Yes/Partly/No)", "q_assign": "Which course of action better fits someone whose main reason is: 'That it's better for other people — their welfare, or fairness to them'?", "assign_opts": ["Publish it under my name alone.", "Add my friend as an author."]}], "D": [{"id": "d1_waterfilter_PA", "dilemma_id": "d1_waterfilter", "both_argue_for": "Refill the water filter before leaving.", "responses": ["The meeting matters, and you shouldn't be late lightly. But being known as someone who cuts corners at home follows you too. Refilling is a tiny investment in looking reliable, and lateness is easier to recover from than that impression.", "Being late to something urgent is a real cost, no question. Still, the filter is a small shared trust, and refilling it is a thirty-second kindness to the people you live with. Here I'd let that consideration edge out the couple of minutes it costs you."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d1_waterfilter_PB", "dilemma_id": "d1_waterfilter", "both_argue_for": "Leave for the meeting without refilling the water filter.", "responses": ["Your housemates will be fine without filtered water for an hour. An urgent meeting is where your standing is actually on the line, so protect the thing that advances you and don't let a trivial chore make you late.", "Looking after your housemates matters. But leaving it empty once, in a genuine rush, doesn't undo that care. A quick message so the next person isn't caught out is itself a considerate move, and you can refill it the moment you're back."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d2_fortnite_PA", "dilemma_id": "d2_fortnite", "both_argue_for": "Ease off and support your brother's interest.", "responses": ["Your taste is your own, and you're allowed to think the game is beneath you. But your brother looks up to you, and the mockery lands harder than the opinion. Easing off costs you nothing and gives him an ally in his corner, which I'd weigh more.", "You've built real identity around your taste in games, and that's fair. But nothing shows real mastery like being generous to a beginner. Lifting your brother's game reads as confidence in your own level, whereas pettiness reads as doubt about it."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d2_fortnite_PB", "dilemma_id": "d2_fortnite", "both_argue_for": "Keep giving your brother a hard time about the game.", "responses": ["Caring about him doesn't require sharing his taste. What matters is that the teasing stays warm and he never doubts you're on his side. Play a round with him, let him show you what he loves about it, and keep the ribbing the affectionate kind that pulls you closer.", "Standards are standards. You've earned your taste, and pretending Fortnite sits on the same tier would cheapen the distinction you've worked for. Holding the line, even with your brother, is how you keep it."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d3_alex_PA", "dilemma_id": "d3_alex", "both_argue_for": "Tell Alex about your feelings in a gentle, direct conversation.", "responses": ["Yes, he just came out of something serious. But a feeling left unspoken between you is its own quiet instability. Naming it carefully is how you keep the friendship on honest, solid ground rather than letting things unsaid distort it.", "His timing genuinely might be off, and that's worth weighing. Still, living honestly means not managing someone else's feelings by hiding your own. A gentle, direct conversation treats him as an adult who can decide for himself, and frees you from carrying this in secret."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d3_alex_PB", "dilemma_id": "d3_alex", "both_argue_for": "Keep your romantic feelings private for now.", "responses": ["Feelings are real, but he isn't steady yet after a long relationship. The caring, stable move is to hold yours for now, protect the friendship you both rely on and don't put weight on him he can't carry right now.", "Choosing your own moment is itself a real choice, not just fear. You're not obligated to disclose the instant a feeling appears. Waiting until it feels right, on your terms, can be the freer and more deliberate path."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d4_parenting_PA", "dilemma_id": "d4_parenting", "both_argue_for": "Let your partner's more lenient style continue.", "responses": ["Consistency has genuine value, and the friction is wearing on you. But a looser hand also gives your kids room to make their own calls and learn from them, and forcing a united front may cost more in tension and control than the messiness it's meant to fix.", "Clashing openly over parenting can crack the order kids depend on most. What a family's continuity really rests on is the two of you standing together. A united front, even a lenient one, is calmer than a home at war over its own rules."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d4_parenting_PB", "dilemma_id": "d4_parenting", "both_argue_for": "Raise it with your partner to set consistent rules.", "responses": ["Wanting your home to reflect your own approach is legitimate. You don't have to defer to a style you don't believe in. Raising it directly is you exercising your own voice as a parent, on your own terms, rather than quietly going along.", "An argument is unpleasant, true. But a family runs on its rules meaning something, and letting things slide teaches the kids the household's word doesn't hold. Setting clear, shared discipline is how you keep the order a family is built on."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d5_overwhelmed_PA", "dilemma_id": "d5_overwhelmed", "both_argue_for": "Step back from your friends to protect your own wellbeing.", "responses": ["Running yourself into the ground helps no one and quietly lets down the people who expect you to show up. The responsible move is a brief, well-signaled break: you step back the expected way, without dropping anyone unannounced, and stay the person who does things properly.", "Your friend leaning on you is real, and stepping back will sting. But you can't pour from an empty cup. Honoring your own limits isn't abandonment, it's the only way you'll have anything left to give, and choosing your wellbeing here is legitimate."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d5_overwhelmed_PB", "dilemma_id": "d5_overwhelmed", "both_argue_for": "Keep showing up for your struggling friend despite the strain.", "responses": ["Showing up for people can be its own freely chosen commitment, not an obligation dragging you down. If this friendship matters to you, staying isn't self-neglect. It's you deciding, on your own terms, who's worth the cost.", "You're stretched thin, and that's real. But a friend in crisis is exactly when loyalty is tested. People count on you to be there, and stepping away now breaks a bond others rely on. Staying the course is what keeps you someone people can trust."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d6_grant_PA", "dilemma_id": "d6_grant", "both_argue_for": "Spread the grant across all the projects.", "responses": ["You earned the pen, but the grant belongs to the group's mission, not to the person who wrote for it. Spreading it gives every project a real chance and treats the members as equals. That wider fairness is worth more than any single program's growth.", "Your influence in the group is built on trust, and nothing builds it faster than being visibly even-handed with money. Spread it now and you become the person they hand the next, bigger pot to. That's the longer game for your role."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d6_grant_PB", "dilemma_id": "d6_grant", "both_argue_for": "Concentrate it on the program you lead.", "responses": ["Fair doesn't always mean equal slices. If your program reaches the most people, concentrating the money there can do the most good overall. Just make the case openly, so the group can weigh it and the choice serves everyone rather than just you.", "You did the work that won this money, and steering it toward the program you lead is a fair return on that. A stronger program under your name means a stronger voice in the group, and that position lets you shape what comes next."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d7_race_PA", "dilemma_id": "d7_race", "both_argue_for": "Donate the $120 to the relief fund.", "responses": ["The months of training were real, and giving up the race stings. But set the two side by side: a finish line for you, or direct help for families who lost the floor under them. The wider need outweighs the personal milestone, and the training isn't wasted; the fitness stays.", "Skipping one race doesn't erase the training; the discipline you built is the real achievement, and it stays with you. Giving the money away from a position of strength, having already done the work, costs your progress almost nothing."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d7_race_PB", "dilemma_id": "d7_race", "both_argue_for": "Register for the race you trained for.", "responses": ["You set a goal, you trained for months, and this is the finish it points at. Following through is how goals come to mean anything at all. Pay the fee, run the race, and let your effort become a result you can stand on.", "Caring about strangers doesn't mean every dollar you spend on yourself is taken from them. You can run this race and give in other ways, other weeks. A one-time entry fee isn't the measure of your concern for the world."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d8_trip_PA", "dilemma_id": "d8_trip", "both_argue_for": "Take the trip while the chance is there.", "responses": ["A cushion is for weathering surprises, and one carefully chosen trip won't sink you if you cap the spending and start refilling next month. Going with a plan is different from going blind.", "The savings exist so that life stays livable, and a week like this is the living part. Chances this cheap, with this friend, don't repeat on schedule. Take it while it's real, and rebuild the cushion with the same discipline that built it."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d8_trip_PB", "dilemma_id": "d8_trip", "both_argue_for": "Keep your emergency savings intact.", "responses": ["Wanting the adventure doesn't mean this adventure. Saying no to a rushed version keeps you free to plan a better one on your own terms, one you can enjoy without a knot in your stomach about the balance.", "The cushion is doing its job precisely by being boring. Drain it for a spontaneous week and the next surprise lands on a credit card. The safe base you've built is worth more than a deal that expires Friday."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d9_dinner_PA", "dilemma_id": "d9_dinner", "both_argue_for": "Reinvent the dinner this year.", "responses": ["Change can honor a ritual if you keep its heart. Carry the two or three things the family would grieve, the toast, the one dish, into the new format, and the tradition bends without breaking.", "Hosting is your one real chance to make the evening yours. A new format wakes everyone up, gives the night a story, and the family gets a memory instead of a rerun. Every tradition started as someone's experiment once, too."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d9_dinner_PB", "dilemma_id": "d9_dinner", "both_argue_for": "Keep the dinner the way it's always been.", "responses": ["Novelty for its own sake can land flat. Keep the frame this year and pour your creativity into the corners: one new dish, one surprise. You get the spark without gambling the whole evening on it.", "The sameness is the point. That dinner is how your family tells itself it's still one thing across the years, and hosts are stewards of it, not authors. Keep it as it's always been; there are other nights for invention."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d10_reunion_PA", "dilemma_id": "d10_reunion", "both_argue_for": "Pitch the wild idea.", "responses": ["Comfortable scripts slowly turn reunions into reruns nobody remembers. Pitching the wild idea risks a few groans, but it offers the group a jolt of the thing that made these weekends fun in the first place. Someone has to be the spark.", "Groups stay easy because someone occasionally tests the temperature, openly and good-naturedly. Pitch it as a question, not a plan, and let the group decide. If they say no, you fold gracefully, and no harmony is lost."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "d10_reunion_PB", "dilemma_id": "d10_reunion", "both_argue_for": "Go along with the usual plan.", "responses": ["The script is comfortable because it's what everyone signed up for. People plan their year around this weekend being exactly what it is. Going along isn't timid; it's respecting what the group actually wants from it.", "You don't need the whole weekend to change for it to feel new. Slip one unexpected evening into the familiar script and you get your jolt without making anyone brace. New works best when people opt into it."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n1_bike_PA", "dilemma_id": "n1_bike", "both_argue_for": "Keep cycling the route I worked out myself.", "responses": ["Two colleagues with an article is not evidence about your route. You worked it out yourself over months and you know that road. Being able to make your own call about your own commute is worth something, and I would keep the route that is yours.", "Their concern is fair, but two years without incident is information too. A familiar route you know well is its own safety, and swapping it for an unfamiliar routine has costs. I would stay with what has reliably worked."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n1_bike_PB", "dilemma_id": "n1_bike", "both_argue_for": "Switch to the bus route everyone recommends.", "responses": ["The route being yours matters, and nobody should talk you out of it. But choosing to switch is equally your call. If you have started wanting a different commute, take the bus because you decided to, and own that as you owned the route.", "A road without a bike lane is a risk you carry daily, and nothing going wrong yet does not lower it. The bus removes that exposure. When the downside is injury, take the predictable option."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n2_degree_PA", "dilemma_id": "n2_degree", "both_argue_for": "Take the module I actually want.", "responses": ["The safe module protects a number that is borderline either way, and one dull module will not steady it much. What you have built is not so fragile. I would not reorganise your final term around protecting it.", "You have wanted this topic for years, and a final module is one of the few free choices a degree offers. Hard marking is a cost, not a wall. Take the subject you chose, because studying on your own terms is the point of choosing."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n2_degree_PB", "dilemma_id": "n2_degree", "both_argue_for": "Take the module with the reliable grade.", "responses": ["You are borderline for the band you want, so there is little margin to spend. The predictable module keeps the outcome under control, and the topic will still be there later. When the downside cannot be undone, take the certain option.", "Wanting the topic is a real reason. But you also get to decide the grade band matters more right now, and that is not caving, it is setting your own priority. Take the safer module because you chose to, and read the other yourself."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n3_diagnosis_PA", "dilemma_id": "n3_diagnosis", "both_argue_for": "Manage it my own way for now.", "responses": ["Your doctor called it not unreasonable, which makes this your call rather than a medical one. Six months of your own approach, with a re-test, is a decision you can stand behind. Take the route you chose and hold yourself to it.", "Six months is not long, and a plan built around your own life is one you will keep to. A regime you resent is not more reliable than a routine you sustain. I would give the steady approach its six months."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n3_diagnosis_PB", "dilemma_id": "n3_diagnosis", "both_argue_for": "Start the treatment plan as prescribed.", "responses": ["High enough to medicate now is a threshold, and the damage from waiting is the kind you do not notice until it is done. Medication removes that exposure immediately. When the risk is your health, do not run the experiment.", "You are entitled to try it your way, and she left room for that. But deciding to start now is equally your choice, not obedience, and it does not stop you running and sleeping better. Begin because you weighed it, not because you were told."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n4_wedding_seat_PA", "dilemma_id": "n4_wedding_seat", "both_argue_for": "Sit where I want to sit.", "responses": ["Nobody is harmed if you move, which makes this a question about whose evening it is. You get to spend it near the people you actually want. Take the seat you want, and let being noticed be a small price for an evening you chose.", "Your mother is describing a rule nobody wrote down, and those bend more easily than she thinks. One seat change at a large wedding does not become a story. Do not organise your evening around what might be remarked on."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n4_wedding_seat_PB", "dilemma_id": "n4_wedding_seat", "both_argue_for": "Sit where the family expects me to.", "responses": ["You could move and it would cost little. But you are also allowed to decide the top table is fine for one night, on your own reckoning. If you stay, stay because you weighed it and did not much mind, not because you were told.", "Seating at a family wedding is something everyone has quietly agreed to honour, and moving reads as a comment even if you mean none. It is one evening. Stay where you were put and keep the occasion running as expected."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n5_dresscode_PA", "dilemma_id": "n5_dresscode", "both_argue_for": "Dress the way I normally do.", "responses": ["One colleague's aside is not the office speaking, and offices absorb far more variation than a new starter expects. Nobody with authority has mentioned it. I would not restyle yourself around a passing remark from one person.", "No manager has raised it and there is no policy, so this is a preference someone passed on. How you present yourself is one of the few things at work entirely yours to decide. I would keep dressing as you do."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n5_dresscode_PB", "dilemma_id": "n5_dresscode", "both_argue_for": "Match what the rest of the team wears.", "responses": ["Unwritten dress codes are still codes, and a colleague has just told you what this one is. Looking like part of the team smooths a lot. Wear something plainer and stop standing out on a question that does not matter to you.", "You are not obliged to change, and that is worth noticing. But you might decide you would rather not spend attention here. Matching the team can be a choice about where your energy goes, and if that is your reason, it is a good one."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n6_groupchat_PA", "dilemma_id": "n6_groupchat", "both_argue_for": "Say I am not coming.", "responses": ["A chat full of confirmations builds its own pressure, and that is not the same as anyone needing you there. Being the one who says no is uncomfortable for about a day. I would not spend a weekend avoiding that.", "Nobody loses money and nobody depends on you, which leaves only what you want your weekend to be. You are allowed to want it to yourself. Say so plainly and let the group have the trip without you."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n6_groupchat_PB", "dilemma_id": "n6_groupchat", "both_argue_for": "Go along like everyone else.", "responses": ["You could decline cleanly and nothing would break. But you might decide the weekend is worth it once you are there, and that is a choice rather than a capitulation. If you go, go because you picked it, not because the chat filled with yeses.", "When everyone else has confirmed, the only absence says something whether you mean it or not, and these plans hold together because people go along. It is one weekend. Go, and keep the group's plan intact."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n7_recipe_PA", "dilemma_id": "n7_recipe", "both_argue_for": "Cook it my own way.", "responses": ["A dish is not the tradition; the gathering is. Recipes have always changed hands and shifted slightly with each pair, and your grandmother's version was somebody's variation once. I would not treat it as fixed.", "You are hosting now, and hosting includes deciding what comes out of your kitchen. Your version is yours and you think it is better. Cook it your way, and let the meal reflect the person actually making it."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n7_recipe_PB", "dilemma_id": "n7_recipe", "both_argue_for": "Cook it the way it has always been made.", "responses": ["This dish has been made the same way for decades, and that continuity is most of what it is for. Handing it on unchanged is the point of inheriting it. Make it as it has always been made and keep the thread unbroken.", "It is your kitchen and your call, and you should not cook the old version because you were nudged. But you might decide you want that dish on the table this year, for your own reasons. Cook it the old way if that is what you chose."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n8_name_PA", "dilemma_id": "n8_name", "both_argue_for": "Keep my own name.", "responses": ["Your partner does not mind, so the expectation comes from around you rather than from the marriage. Your name is how you think of yourself and how your work is filed. Keep it, and let that be your decision rather than the family's.", "Naming customs have shifted a great deal in one generation, and the practice was never as fixed as families remember. Your partner is indifferent, which tells you how much is habit. Do not organise your name around an inherited pattern."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n8_name_PB", "dilemma_id": "n8_name", "both_argue_for": "Take the family name as is customary.", "responses": ["Nobody in the marriage requires this, so if you change it, change it because you want to. There are reasons to want a shared name, and choosing one is not the same as being handed one. Take their name on your own terms.", "Taking the family name is how this has been marked for generations, and it joins something that existed before you and continues after. Their family understands the marriage partly through it. Take the name and keep the custom."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n9_mentor_PA", "dilemma_id": "n9_mentor", "both_argue_for": "Give the project to the junior colleague.", "responses": ["She wants it, she would probably manage, and you are already helping her. Handing it over costs you one visible project and gives her something that could change her year. Give it to her, because the good it does her is larger.", "Handing it over reads well. Being the person who grows other people is its own standing, and it is noticed by exactly the people whose opinion counts. Give her the project and take the credit for having developed her."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n9_mentor_PB", "dilemma_id": "n9_mentor", "both_argue_for": "Keep the project myself.", "responses": ["You want to help her, which is the right instinct. But probably managing is a thin margin on something visible, and a public struggle would set her back further than waiting. Keep it and bring her in alongside, which is the kinder version.", "This is a visible project you could do well, and those are rare. Your record is built from work like this, and letting it go to someone who needs help with it costs you the demonstration. Keep it and give her the next one."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n10_coauthor_PA", "dilemma_id": "n10_coauthor", "both_argue_for": "Add my friend as an author.", "responses": ["She shaped the idea, she is struggling, and this costs you a line and helps her considerably. She has not even asked. Add her, because when help is that cheap to give and that useful to receive, giving it is the easy call.", "Adding her costs almost nothing and marks you as someone who shares credit, which is worth more over a career than sole authorship of one piece. Put her name on it and let that be known."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}, {"id": "n10_coauthor_PB", "dilemma_id": "n10_coauthor", "both_argue_for": "Publish it under my name alone.", "responses": ["You want to help her, and you should. But an authorship she did not earn is a strange gift and she may feel it as one. Tell her what the conversation meant, thank her in the acknowledgements, and find her something real instead.", "You wrote this entirely yourself. An afternoon's conversation is what colleagues do for each other, not authorship. Your record should say what you did, and diluting it here makes every later credit harder to read. Publish it alone."], "q": "Both responses argue for the SAME course of action. Do they give clearly DIFFERENT reasons? (1 = same reason, 5 = clearly different)"}]};

const URLP = new URLSearchParams(location.search);
const IS_TEST = DEMO || URLP.has('test');
const ANNOTATOR = (function(){
  const fresh = () => Math.random().toString(36).slice(2,10)+'-'+Date.now().toString(36);
  let local; try{ local=localStorage.getItem('val_id'); if(!local){local=fresh();localStorage.setItem('val_id',local);} }catch(e){ local=fresh(); }
  const pid = URLP.get('PROLIFIC_PID')||null;
  return {prolific_pid:pid, local_id:local, key: pid||local};
})();

function endpointURL(params){
  const u=new URL(LOG_ENDPOINT);
  Object.entries(params).forEach(([k,v])=>{ if(v!=null&&v!=='') u.searchParams.set(k,v); });
  return u.toString();
}

/* ---- state ---- */
const S = {block:null, screen:'welcome', i:0, queue:[], ans:{}, t0:Date.now()};

/* Block slicing. Every sheet is strided by block so coverage stays even no matter how
   big the pool is; a sheet with fewer items than blocks simply contributes to some
   blocks and not others. Grouped by task type, with a banner when the task changes. */
function buildQueue(block){
  const slice=(arr)=>arr.filter((_,i)=> i % N_BLOCKS === block);
  const q=[];
  slice(ITEMS.A).forEach(it=>q.push({sheet:'A', it}));
  slice(ITEMS.C).forEach(it=>q.push({sheet:'C', it}));
  slice(ITEMS.D).forEach(it=>q.push({sheet:'D', it}));
  q.forEach((x,i)=>{ x.first = (i===0) || q[i-1].sheet!==x.sheet; });
  return q;
}
const TASK_INTRO = {
  A:'For each piece of advice: which course of action does it argue for, and what kind of concern does it appeal to?',
  C:'Now a few situations on their own — no advice. Judge whether the two options are genuinely opposed, realistic, and which one fits the concern named.',
  D:'Last part. Each pair argues for the SAME course of action. Judge whether the two appeal to clearly different concerns.'
};

/* Unlike the main study this deliberately FAILS CLOSED. If the backend cannot hand out
   a block, it is too old to store judgments either — they would fall through to the
   study logger and be silently lost. Better to stop one annotator than to collect a
   whole batch into the void. */
async function assignBlock(){
  if(!LOG_ENDPOINT) return Math.floor(Math.random()*N_BLOCKS);
  try{
    const r = await fetch(endpointURL({action:'vassign', key:ANNOTATOR.key, blocks:N_BLOCKS, test:IS_TEST?'1':''}));
    const j = await r.json();
    if(j && j.ok && Number.isInteger(j.block)) return j.block;
  }catch(e){}
  return null;
}

    <p class="eyebrow">Setup issue</p>
    <h1>Sorry — this task isn't ready yet.</h1>
    <p class="lead">The server that records answers isn't responding, so nothing you did would be saved. Please <b>return this submission</b> on Prolific — you won't be penalised for returning it.</p>
    <div class="card"><p class="note" style="margin:0">Researcher: the Apps Script deployment is missing the validation endpoints. Redeploy <code>apps_script_logger.gs</code> as a New version, then check <code>?action=vassign&key=test&blocks=${N_BLOCKS}</code> returns a block.</p></div>
  `);
}

/* ---- submitting ---- */
function judgments(){
  const out=[];
  S.queue.forEach(({sheet,it})=>{
    const a=S.ans[sheet+':'+it.id];
    if(!a) return;
    if(sheet==='A') out.push({sheet:'A', item_id:it.id, value:a.value, decision:a.decision, confidence:a.confidence??null, ms:a.ms});
    else if(sheet==='C') out.push({sheet:'C', dilemma_id:it.id, opposed:a.opposed, realistic:a.realistic, assign:a.assign, ms:a.ms});
    else out.push({sheet:'D', pair_id:it.id, discriminable:a.discriminable, ms:a.ms});
  });
  if(S.self && (S.self.stse || S.self.oc)){
    if(S.self.stse) out.push({sheet:'P', axis:'ST-SE', choice:S.self.stse, ms:S.self.ms||null});
    if(S.self.oc)   out.push({sheet:'P', axis:'O-C',   choice:S.self.oc,   ms:S.self.ms||null});
  }
  return out;
}
function submit(phase, complete){
  if(!LOG_ENDPOINT) return;
  const body=JSON.stringify({kind:'validation', annotator:ANNOTATOR, block:S.block, revision:REVISION,
    is_test:IS_TEST, phase, complete:!!complete, client_ts:new Date().toISOString(), judgments:judgments()});
  try{ fetch(LOG_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body,keepalive:true}).catch(()=>{}); }catch(e){}
}
window.addEventListener('beforeunload',()=>{
  if(!LOG_ENDPOINT||!Object.keys(S.ans).length) return;
  try{ navigator.sendBeacon(LOG_ENDPOINT, new Blob([JSON.stringify({kind:'validation',annotator:ANNOTATOR,
    block:S.block,revision:REVISION,is_test:IS_TEST,phase:'unload_partial',complete:false,judgments:judgments()})],{type:'text/plain'})); }catch(e){}
});

/* ---- render ---- */
const app=document.getElementById('app');
function render(h){ app.innerHTML=h; window.scrollTo({top:0}); }
function setProgress(){
  const total=S.queue.length||1;
  document.getElementById('pb').style.width=(S.screen==='task'?(S.i/total*100):(S.screen==='done'?100:0))+'%';
  document.getElementById('tag').textContent = S.screen==='task' ? `${S.i+1} / ${total}` : (S.screen==='done'?'Done':'·');
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function welcome(){
  S.screen='welcome'; setProgress();
  render(`
    <p class="eyebrow">Research task · about 10 minutes</p>
    <h1>Reading advice: what does it argue, and what does it care about?</h1>
    <p class="lead">You'll read short pieces of advice about everyday dilemmas. For each one we ask two things: <b>which course of action</b> it argues for, and <b>which kind of concern</b> it appeals to.</p>
    <p class="lead">There are no trick questions and no hidden right answers we expect you to guess. Judge only what the text in front of you says. Some pieces will look similar — read each one on its own terms.</p>
    <div class="card">
      <h2>Before you begin</h2>
      <label class="check"><input type="checkbox" id="c1"> I'm 18 or older and consent to take part.</label>
      <label class="check"><input type="checkbox" id="c2"> I understand I can stop at any time.</label>
      <div class="btnrow"><button class="btn" id="go" disabled>Begin</button></div>
    </div>
    <p class="note">Your answers are recorded as you go. Annotator ID <code>${esc(ANNOTATOR.key)}</code>${IS_TEST?' · <b>test session</b>':''}</p>
  `);
  const upd=()=>{document.getElementById('go').disabled=!(c1.checked&&c2.checked);};
  c1.onchange=upd; c2.onchange=upd;
  document.getElementById('go').onclick=async()=>{
    const b=document.getElementById('go'); b.disabled=true; b.textContent='Preparing…';
    const blk=await assignBlock();
    if(blk===null){ backendNotReady(); return; }
    S.block=blk; S.queue=buildQueue(S.block); S.i=0; S.t0=Date.now(); task();
  };
}

function key(){ const {sheet,it}=S.queue[S.i]; return sheet+':'+it.id; }
function cur(){ return S.ans[key()] || (S.ans[key()]={}); }
function pick(field,val){ cur()[field]=val; task(true); }

function optList(field, opts, name){
  const a=cur();
  return opts.map((o,i)=>{
    const letter=String.fromCharCode(65+i);
    return `<label class="opt ${a[field]===letter?'sel':''}"><input type="radio" name="${name}" ${a[field]===letter?'checked':''} onchange="pick('${field}','${letter}')">${esc(o)}</label>`;
  }).join('');
}

function task(keepScroll){
  S.screen='task';
  const {sheet,it}=S.queue[S.i]; const a=cur(); const total=S.queue.length;
  let body='', ready=false;

  if(sheet==='A'){
    const needConf = !!it.q_confidence;
    ready = !!(a.value && a.decision) && (!needConf || a.confidence!=null);
    body = `
      <p class="eyebrow">Advice ${S.i+1} of ${total}</p>
      <h2>The situation</h2>
      <div class="scenario">${esc(it.dilemma)}</div>
      <h2>The advice given</h2>
      <div class="resp">${esc(it.reasoning)}</div>
      <p class="q">${esc(it.q_decision)}</p>
      ${optList('decision', it.decision_opts, 'dec'+S.i)}
      <p class="q">${esc(it.q_value)}</p>
      ${optList('value', it.value_opts, 'val'+S.i)}
      ${it.q_confidence?`
      <p class="q">${esc(it.q_confidence)}</p>
      <div class="row5">${[1,2,3,4,5].map(v=>
        `<label class="opt ${a.confidence===v?'sel':''}"><input type="radio" name="conf${S.i}" ${a.confidence===v?'checked':''} onchange="pick('confidence',${v})">${v}</label>`).join('')}</div>
      <div class="caps"><span>1 · not at all confident</span><span>5 · very confident</span></div>`:''}`;
  } else if(sheet==='C'){
    ready = !!(a.opposed && a.realistic && a.assign);
    const yn=(f)=>['Yes','Partly','No'].map(v=>
      `<label class="opt ${a[f]===v?'sel':''}" style="display:inline-block;width:31%;text-align:center;margin-right:2%"><input type="radio" name="${f+S.i}" ${a[f]===v?'checked':''} onchange="pick('${f}','${v}')">${v}</label>`).join('');
    body = `
      <p class="eyebrow">Situation ${S.i+1} of ${total}</p>
      <h2>The situation</h2>
      <div class="scenario">${esc(it.dilemma)}</div>
      <div class="resp"><b>Option 1.</b> ${esc(it.decisions[0])}<br><b>Option 2.</b> ${esc(it.decisions[1])}</div>
      <p class="q">${esc(it.q_opposed)}</p>${yn('opposed')}
      <p class="q">${esc(it.q_realistic)}</p>${yn('realistic')}
      <p class="q">${esc(it.q_assign)}</p>
      ${optList('assign', it.assign_opts, 'asg'+S.i)}`;
  } else {
    ready = a.discriminable != null;
    body = `
      <p class="eyebrow">Pair ${S.i+1} of ${total}</p>
      <h2>Two pieces of advice for the same choice</h2>
      <p class="lead">Both argue for: <b>${esc(it.both_argue_for)}</b></p>
      <div class="resp"><b>Response 1.</b> ${esc(it.responses[0])}</div>
      <div class="resp"><b>Response 2.</b> ${esc(it.responses[1])}</div>
      <p class="q">${esc(it.q)}</p>
      <div class="row5">${[1,2,3,4,5].map(v=>
        `<label class="opt ${a.discriminable===v?'sel':''}"><input type="radio" name="disc${S.i}" ${a.discriminable===v?'checked':''} onchange="pick('discriminable',${v})">${v}</label>`).join('')}</div>
      <div class="caps"><span>1 · identical framing</span><span>5 · clearly different</span></div>`;
  }

  const banner = S.queue[S.i].first
    ? `<div class="card" style="background:var(--accent-soft);border-color:#D4DEEA"><b>${esc(TASK_INTRO[sheet])}</b></div>` : '';
  render(`${banner}<div class="card">${body}</div>
    <div class="btnrow">
      ${S.i>0?`<button class="btn ghost" onclick="back()">Back</button>`:''}
      <button class="btn" id="next" ${(ready||DEMO)?'':'disabled'} onclick="next()">${S.i+1<total?'Next':'Finish'}</button>
      ${(ready||DEMO)?'':'<span class="note">Answer every question to continue.</span>'}
    </div>`);
  setProgress();
}

function next(){
  cur().ms = Date.now()-S.t0;
  S.t0=Date.now();
  if(S.i+1<S.queue.length){ S.i++; task(); if(S.i%5===0) submit('progress_'+S.i,false); }
  else { submit('items_done', false); values(); }
}
function back(){ if(S.i>0){ S.i--; task(); } }

/* Asked last, deliberately. Putting these first would tell annotators which
   dimensions to look for and contaminate every recovery judgement above. */
function values(){
  S.screen='values';
  S.self = S.self || {}; S.selfT0 = Date.now();
  const ready = !!(S.self.stse && S.self.oc);
  const opt=(field,val,label)=>`<label class="opt ${S.self[field]===val?'sel':''}">`+
    `<input type="radio" name="${field}" ${S.self[field]===val?'checked':''} `+
    `onchange="pickSelf('${field}','${val}')">${esc(label)}</label>`;
  render(`
    <p class="eyebrow">Last page</p>
    <h1>Two questions about you.</h1>
    <p class="lead">Nothing here is judged and there is no right answer. It lets us check whether
      a piece of advice reads differently depending on what the reader happens to value.</p>
    <div class="card">
      <p class="q">When the two pull against each other, which matters more to you?</p>
      ${opt('stse','ST','The welfare of other people, and being fair to them')}
      ${opt('stse','SE','My own success, standing, and staying in control')}
    </div>
    <div class="card">
      <p class="q">And when these two pull against each other?</p>
      ${opt('oc','O','Being free to choose my own way, even if it is unproven')}
      ${opt('oc','C','Safety, and doing the established or responsible thing')}
    </div>
    <div class="btnrow"><button class="btn" id="fin" ${ready?'':'disabled'}>Finish</button></div>
  `);
  document.getElementById('fin').onclick=()=>{
    S.self.ms = Date.now()-S.selfT0;
    submit('complete', true); done();
  };
}
function pickSelf(field,val){
  S.self=S.self||{}; S.self[field]=val;
  const ms=S.selfT0; values(); S.selfT0=ms;
}

function done(){
  S.screen='done'; setProgress();
  const n=judgments().filter(j=>j.sheet!=='P').length;
  render(`
    <p class="eyebrow">Complete</p>
    <h1>Thank you.</h1>
    <p class="lead">You judged ${n} items. Your answers have been recorded — you can close this window.</p>
    ${LOG_ENDPOINT?`<div class="card" style="text-align:center">
      <p class="note" style="margin:0 0 6px">Your completion code</p>
      <p style="font-size:22px;letter-spacing:.08em;margin:0"><b>${esc(COMPLETION_CODE)}</b></p></div>`:''}
  `);
}

welcome();
</script>
